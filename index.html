<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7X7X-H5小游戏合集 - 10,000个独立游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 120px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #e74c3c;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #c0392b;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #3498db;
            background: transparent;
            color: #3498db;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #3498db;
            color: white;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 30px 0;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-color: #e74c3c;
        }

        .game-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        .game-type {
            background: #e74c3c;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 15px;
        }

        .game-description {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .game-actions {
            display: flex;
            gap: 10px;
        }

        .play-btn {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .footer {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #7f8c8d;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 10px 15px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .page-btn.active,
        .page-btn:hover {
            background: #3498db;
            color: white;
        }

        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                gap: 20px;
            }
            
            .filters {
                justify-content: center;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🎮 7X7X-H5小游戏合集</h1>
            <div class="subtitle">一站式HTML5游戏体验平台</div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="total-games">9420</div>
                    <div class="stat-label">游戏总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">15</div>
                    <div class="stat-label">游戏类型</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">免费畅玩</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-section">
            <input type="text" class="search-box" placeholder="🔍 搜索游戏名称、类型或编号..." id="searchInput">
            <div class="filters">
                <button class="filter-btn active" data-type="all">全部</button>
                <button class="filter-btn" data-type="飞机大战">飞机大战</button>
                <button class="filter-btn" data-type="消消乐">消消乐</button>
                <button class="filter-btn" data-type="俄罗斯方块">俄罗斯方块</button>
                <button class="filter-btn" data-type="贪吃蛇">贪吃蛇</button>
                <button class="filter-btn" data-type="扫雷">扫雷</button>
                <button class="filter-btn" data-type="拼图">拼图</button>
                <button class="filter-btn" data-type="记忆翻牌">记忆翻牌</button>
                <button class="filter-btn" data-type="数字华容道">数字华容道</button>
                <button class="filter-btn" data-type="连连看">连连看</button>
                <button class="filter-btn" data-type="跳跃">跳跃</button>
                <button class="filter-btn" data-type="打砖块">打砖块</button>
                <button class="filter-btn" data-type="迷宫">迷宫</button>
                <button class="filter-btn" data-type="塔防">塔防</button>
                <button class="filter-btn" data-type="跑酷">跑酷</button>
                <button class="filter-btn" data-type="益智">益智</button>
            </div>
        </div>

        <div class="pagination" id="pagination"></div>

        <div class="games-grid" id="gamesGrid">
            <div class="loading">正在加载游戏列表...</div>
        </div>

        <div class="pagination" id="pagination-bottom"></div>
    </div>

    <div class="footer">
        <div class="container">
            <p>🎯 7X7X-H5小游戏合集 | 精心收录优质HTML5游戏</p>
            <p>💡 无需下载，即点即玩 | 支持所有现代浏览器</p>
            <p style="margin-top: 15px; opacity: 0.7;">
                Made with ❤️ | 
                <a href="https://github.com/IdentityVplayer/game" style="color: #3498db;">GitHub源码</a>
            </p>
        </div>
    </div>

    <script>
        // 游戏类型映射
        const gameTypes = [
            '飞机大战', '消消乐', '俄罗斯方块', '贪吃蛇', '扫雷',
            '拼图', '记忆翻牌', '数字华容道', '连连看', '跳跃',
            '打砖块', '迷宫', '塔防', '跑酷', '益智'
        ];

        // 游戏描述模板
        const gameDescriptions = {
            '飞机大战': '经典的射击游戏，操控战机消灭敌人',
            '消消乐': '点击相同的方块来消除它们',
            '俄罗斯方块': '经典的方块拼图游戏',
            '贪吃蛇': '控制小蛇吃食物变长',
            '扫雷': '在雷区中找出所有安全区域',
            '拼图': '将打乱的图片重新拼接完整',
            '记忆翻牌': '翻牌找出相同的图案',
            '数字华容道': '将数字按顺序排列',
            '连连看': '连接相同的图案来消除',
            '跳跃': '控制角色跳跃躲避障碍',
            '打砖块': '用球拍反弹球来打破砖块',
            '迷宫': '在迷宫中找到出口',
            '塔防': '建造防御塔抵御敌人',
            '跑酷': '在奔跑中躲避障碍物',
            '益智': '锻炼思维的智力游戏'
        };

        let allGames = [];
        let filteredGames = [];
        let currentPage = 1;
        const gamesPerPage = 24;

        // 生成游戏数据
        function generateGameData() {
            const games = [];
            for (let i = 1; i <= 9420; i++) {
                const type = gameTypes[(i - 1) % gameTypes.length];
                games.push({
                    id: i,
                    name: `${type} ${i}`,
                    type: type,
                    description: gameDescriptions[type],
                    file: `games/${i}.html`
                });
            }
            return games;
        }

        // 渲染游戏网格
        function renderGames(games, page = 1) {
            const startIndex = (page - 1) * gamesPerPage;
            const endIndex = startIndex + gamesPerPage;
            const pageGames = games.slice(startIndex, endIndex);

            const gamesGrid = document.getElementById('gamesGrid');
            
            if (pageGames.length === 0) {
                gamesGrid.innerHTML = '<div class="loading">没有找到匹配的游戏</div>';
                return;
            }

            gamesGrid.innerHTML = pageGames.map(game => `
                <div class="game-card" data-type="${game.type}">
                    <div class="game-title">${game.name}</div>
                    <div class="game-type">${game.type}</div>
                    <div class="game-description">${game.description}</div>
                    <div class="game-actions">
                        <a href="${game.file}" class="play-btn" target="_blank">
                            🎮 立即游玩
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // 渲染分页
        function renderPagination(games, currentPage) {
            const totalPages = Math.ceil(games.length / gamesPerPage);
            const pagination = document.getElementById('pagination');
            const paginationBottom = document.getElementById('pagination-bottom');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                paginationBottom.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // 上一页
            if (currentPage > 1) {
                paginationHTML += `<a href="#" class="page-btn" data-page="${currentPage - 1}">« 上一页</a>`;
            }

            // 页码
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                paginationHTML += `<a href="#" class="page-btn" data-page="1">1</a>`;
                if (startPage > 2) {
                    paginationHTML += `<span class="page-btn">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `<a href="#" class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</a>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span class="page-btn">...</span>`;
                }
                paginationHTML += `<a href="#" class="page-btn" data-page="${totalPages}">${totalPages}</a>`;
            }

            // 下一页
            if (currentPage < totalPages) {
                paginationHTML += `<a href="#" class="page-btn" data-page="${currentPage + 1}">下一页 »</a>`;
            }

            pagination.innerHTML = paginationHTML;
            paginationBottom.innerHTML = paginationHTML;
        }

        // 过滤游戏
        function filterGames(type = 'all', searchTerm = '') {
            filteredGames = allGames.filter(game => {
                const matchType = type === 'all' || game.type === type;
                const matchSearch = searchTerm === '' || 
                    game.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    game.type.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    game.id.toString().includes(searchTerm);
                return matchType && matchSearch;
            });
            
            currentPage = 1;
            renderGames(filteredGames, currentPage);
            renderPagination(filteredGames, currentPage);
        }

        // 初始化
        function init() {
            allGames = generateGameData();
            filteredGames = allGames;
            renderGames(filteredGames, currentPage);
            renderPagination(filteredGames, currentPage);

            // 搜索功能
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const currentFilter = document.querySelector('.filter-btn.active').dataset.type;
                filterGames(currentFilter, e.target.value);
            });

            // 过滤按钮
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    filterGames(e.target.dataset.type, searchInput.value);
                });
            });

            // 分页点击事件
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('page-btn') && e.target.dataset.page) {
                    e.preventDefault();
                    currentPage = parseInt(e.target.dataset.page);
                    renderGames(filteredGames, currentPage);
                    renderPagination(filteredGames, currentPage);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
