<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级飞机大战 - Super Airplane War</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #87CEEB, #4682B4, #191970);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        .game-area {
            position: relative;
            background: linear-gradient(180deg, #87CEEB, #4682B4, #2F4F4F);
            border-radius: 15px;
            margin: 20px 0;
            height: 600px;
            overflow: hidden;
            border: 3px solid #B8860B;
        }
        .player-plane {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #4ECDC4, #45B7D1);
            border-radius: 50% 50% 0 0;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.1s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.7);
        }
        .enemy-plane {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #FF6B6B, #EE5A24);
            border-radius: 0 0 50% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: enemyMove 3s linear;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
        }
        .boss-plane {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #8E44AD, #9B59B6);
            font-size: 40px;
            animation: bossMove 5s linear;
            box-shadow: 0 0 30px rgba(142, 68, 173, 0.8);
        }
        @keyframes enemyMove {
            from { top: -50px; }
            to { top: 100%; }
        }
        @keyframes bossMove {
            from { top: -100px; }
            to { top: 100%; }
        }
        .bullet {
            position: absolute;
            width: 6px;
            height: 15px;
            background: linear-gradient(to top, #ffd700, #ffff00);
            border-radius: 3px;
            animation: bulletMove 1s linear;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        .enemy-bullet {
            background: linear-gradient(to bottom, #ff6b6b, #ff4757);
            animation: enemyBulletMove 2s linear;
        }
        @keyframes bulletMove {
            from { bottom: 80px; }
            to { bottom: 100%; }
        }
        @keyframes enemyBulletMove {
            from { top: 0; }
            to { top: 100%; }
        }
        .explosion {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6b6b, #ffa500, transparent);
            animation: explode 0.6s ease-out;
            pointer-events: none;
            z-index: 15;
        }
        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }
        .power-up {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: powerUpMove 4s linear;
            cursor: pointer;
        }
        .power-up-health {
            background: radial-gradient(circle, #2ecc71, #27ae60);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.7);
        }
        .power-up-weapon {
            background: radial-gradient(circle, #f39c12, #e67e22);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.7);
        }
        .power-up-shield {
            background: radial-gradient(circle, #3498db, #2980b9);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.7);
        }
        @keyframes powerUpMove {
            from { top: -40px; }
            to { top: 100%; }
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .health-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 200px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #e74c3c, #f1c40f, #2ecc71);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .wave-indicator {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            z-index: 100;
        }
        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mobile-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.4);
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ 超级飞机大战 Super Airplane War</h1>
        
        <div class="game-header">
            <div class="stat-item">
                <div>分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div>波数</div>
                <div class="stat-value" id="wave">1</div>
            </div>
            <div class="stat-item">
                <div>敌机数</div>
                <div class="stat-value" id="enemies">0</div>
            </div>
            <div class="stat-item">
                <div>武器等级</div>
                <div class="stat-value" id="weaponLevel">1</div>
            </div>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="health-bar">
                <div class="health-fill" id="healthFill" style="width: 100%;"></div>
            </div>
            <div class="wave-indicator" id="waveIndicator">波数 1 - 准备开始</div>
            
            <div class="player-plane" id="playerPlane">✈️</div>
        </div>
        
        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="shootBtn">🔥</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="startGame()">开始游戏</button>
            <button class="btn" onclick="pauseGame()">暂停</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-top: 20px; backdrop-filter: blur(10px);">
            <h3>🎮 游玩方法:</h3>
            <p>• 使用方向键或手机按钮控制飞机移动</p>
            <p>• 按空格键或点击射击按钮发射子弹</p>
            <p>• 消灭敌机获得分数，避开敌机子弹</p>
            <p>• 收集道具：❤️ 回血、🔥 升级武器、🛡️ 护盾</p>
            <p>• 每波数结束后会出现BOSS敌机</p>
            <p>• 生命值为0时游戏结束</p>
        </div>
        
        <a href="../index.html" style="color: #ffd700; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>
    
    <div id="gameOverModal" class="game-over">
        <h2>🚀 游戏结束</h2>
        <p id="finalScore"></p>
        <p id="finalWave"></p>
        <button class="btn" onclick="hideGameOver()">继续游戏</button>
    </div>

    <script>
        let game = {
            score: 0,
            wave: 1,
            health: 100,
            maxHealth: 100,
            weaponLevel: 1,
            gameRunning: false,
            gameLoop: null,
            player: { x: 350, speed: 5 },
            enemies: [],
            bullets: [],
            enemyBullets: [],
            powerUps: [],
            keys: {},
            shield: false,
            shieldTime: 0,
            lastShoot: 0,
            shootCooldown: 200
        };
        
        const gameArea = document.getElementById('gameArea');
        const playerPlane = document.getElementById('playerPlane');
        
        function startGame() {
            if (game.gameRunning) return;
            
            game.gameRunning = true;
            game.score = 0;
            game.wave = 1;
            game.health = 100;
            game.weaponLevel = 1;
            game.player.x = 350;
            game.enemies = [];
            game.bullets = [];
            game.enemyBullets = [];
            game.powerUps = [];
            game.shield = false;
            
            updateDisplay();
            spawnWave();
            
            game.gameLoop = setInterval(updateGame, 16); // 60 FPS
        }
        
        function updateGame() {
            if (!game.gameRunning) return;
            
            updatePlayer();
            updateBullets();
            updateEnemies();
            updatePowerUps();
            checkCollisions();
            
            // 检查波数完成
            if (game.enemies.length === 0) {
                setTimeout(() => {
                    game.wave++;
                    spawnWave();
                }, 2000);
            }
        }
        
        function updatePlayer() {
            // 键盘控制
            if (game.keys['ArrowLeft'] || game.keys['KeyA']) {
                game.player.x = Math.max(30, game.player.x - game.player.speed);
            }
            if (game.keys['ArrowRight'] || game.keys['KeyD']) {
                game.player.x = Math.min(gameArea.offsetWidth - 90, game.player.x + game.player.speed);
            }
            if (game.keys['Space']) {
                shoot();
            }
            
            // 更新玩家位置
            playerPlane.style.left = game.player.x + 'px';
            
            // 更新护盾状态
            if (game.shield) {
                game.shieldTime -= 16;
                if (game.shieldTime <= 0) {
                    game.shield = false;
                    playerPlane.style.boxShadow = '0 0 20px rgba(78, 205, 196, 0.7)';
                }
            }
        }
        
        function shoot() {
            const now = Date.now();
            if (now - game.lastShoot < game.shootCooldown) return;
            
            game.lastShoot = now;
            
            // 根据武器等级发射不同数量的子弹
            const bulletCount = Math.min(game.weaponLevel, 3);
            const spreadAngle = 30; // 度
            
            for (let i = 0; i < bulletCount; i++) {
                const bullet = document.createElement('div');
                bullet.className = 'bullet';
                
                let startX = game.player.x + 27; // 飞机中心
                let angle = 0;
                
                if (bulletCount > 1) {
                    angle = (i - (bulletCount - 1) / 2) * (spreadAngle / (bulletCount - 1));
                    startX += angle; // 简单偏移
                }
                
                bullet.style.left = startX + 'px';
                bullet.style.bottom = '80px';
                
                gameArea.appendChild(bullet);
                game.bullets.push({
                    element: bullet,
                    x: startX,
                    y: gameArea.offsetHeight - 80,
                    speed: 8,
                    angle: angle
                });
                
                // 自动清理
                setTimeout(() => {
                    if (bullet.parentNode) {
                        bullet.remove();
                        game.bullets = game.bullets.filter(b => b.element !== bullet);
                    }
                }, 1000);
            }
        }
        
        function updateBullets() {
            game.bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                bullet.element.style.bottom = (gameArea.offsetHeight - bullet.y) + 'px';
                
                if (bullet.y < 0) {
                    bullet.element.remove();
                    game.bullets.splice(index, 1);
                }
            });
            
            game.enemyBullets.forEach((bullet, index) => {
                bullet.y += bullet.speed;
                bullet.element.style.top = bullet.y + 'px';
                
                if (bullet.y > gameArea.offsetHeight) {
                    bullet.element.remove();
                    game.enemyBullets.splice(index, 1);
                }
            });
        }
        
        function spawnWave() {
            document.getElementById('waveIndicator').textContent = `波数 ${game.wave} - 正在生成敌机...`;
            
            const enemyCount = 5 + game.wave * 2;
            
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => {
                    spawnEnemy();
                }, i * 500);
            }
            
            // 每5波生成BOSS
            if (game.wave % 5 === 0) {
                setTimeout(() => {
                    spawnBoss();
                }, enemyCount * 500 + 2000);
            }
        }
        
        function spawnEnemy() {
            const enemy = document.createElement('div');
            enemy.className = 'enemy-plane';
            enemy.textContent = '🚁';
            
            const x = Math.random() * (gameArea.offsetWidth - 50);
            enemy.style.left = x + 'px';
            enemy.style.top = '-50px';
            
            gameArea.appendChild(enemy);
            
            const enemyData = {
                element: enemy,
                x: x,
                y: -50,
                speed: 1 + Math.random() * 2 + game.wave * 0.2,
                health: 1,
                type: 'normal',
                lastShoot: 0,
                shootCooldown: 1000 + Math.random() * 2000
            };
            
            game.enemies.push(enemyData);
            
            // 自动清理
            setTimeout(() => {
                if (enemy.parentNode) {
                    enemy.remove();
                    game.enemies = game.enemies.filter(e => e.element !== enemy);
                }
            }, 8000);
        }
        
        function spawnBoss() {
            const boss = document.createElement('div');
            boss.className = 'enemy-plane boss-plane';
            boss.textContent = '🛸';
            
            const x = gameArea.offsetWidth / 2 - 50;
            boss.style.left = x + 'px';
            boss.style.top = '-100px';
            
            gameArea.appendChild(boss);
            
            const bossData = {
                element: boss,
                x: x,
                y: -100,
                speed: 0.5,
                health: 10 + game.wave * 2,
                maxHealth: 10 + game.wave * 2,
                type: 'boss',
                lastShoot: 0,
                shootCooldown: 500
            };
            
            game.enemies.push(bossData);
        }
        
        function updateEnemies() {
            game.enemies.forEach((enemy, index) => {
                enemy.y += enemy.speed;
                enemy.element.style.top = enemy.y + 'px';
                
                // 敌机射击
                const now = Date.now();
                if (now - enemy.lastShoot > enemy.shootCooldown) {
                    enemy.lastShoot = now;
                    enemyShoot(enemy);
                }
                
                // 清理超出屏幕的敌机
                if (enemy.y > gameArea.offsetHeight) {
                    enemy.element.remove();
                    game.enemies.splice(index, 1);
                }
            });
        }
        
        function enemyShoot(enemy) {
            const bullet = document.createElement('div');
            bullet.className = 'bullet enemy-bullet';
            
            bullet.style.left = (enemy.x + 22) + 'px';
            bullet.style.top = (enemy.y + 50) + 'px';
            
            gameArea.appendChild(bullet);
            
            game.enemyBullets.push({
                element: bullet,
                x: enemy.x + 22,
                y: enemy.y + 50,
                speed: 3
            });
            
            setTimeout(() => {
                if (bullet.parentNode) {
                    bullet.remove();
                    game.enemyBullets = game.enemyBullets.filter(b => b.element !== bullet);
                }
            }, 2000);
        }
        
        function checkCollisions() {
            // 玩家子弹与敌机碰撞
            game.bullets.forEach((bullet, bulletIndex) => {
                game.enemies.forEach((enemy, enemyIndex) => {
                    if (isColliding(bullet, enemy, 25, 25)) {
                        // 创建爆炸效果
                        createExplosion(enemy.x + 25, enemy.y + 25);
                        
                        enemy.health--;
                        if (enemy.health <= 0) {
                            // 敌机死亡
                            game.score += enemy.type === 'boss' ? 100 : 10;
                            
                            // 随机掉落道具
                            if (Math.random() < 0.3) {
                                spawnPowerUp(enemy.x + 25, enemy.y + 25);
                            }
                            
                            enemy.element.remove();
                            game.enemies.splice(enemyIndex, 1);
                        }
                        
                        bullet.element.remove();
                        game.bullets.splice(bulletIndex, 1);
                    }
                });
            });
            
            // 敌机子弹与玩家碰撞
            game.enemyBullets.forEach((bullet, index) => {
                if (isColliding(bullet, game.player, 30, 30)) {
                    if (!game.shield) {
                        game.health -= 10;
                        createExplosion(game.player.x + 30, gameArea.offsetHeight - 50);
                    }
                    
                    bullet.element.remove();
                    game.enemyBullets.splice(index, 1);
                }
            });
            
            // 敌机与玩家碰撞
            game.enemies.forEach((enemy, index) => {
                if (isColliding(enemy, game.player, 40, 40)) {
                    if (!game.shield) {
                        game.health -= 20;
                        createExplosion(game.player.x + 30, gameArea.offsetHeight - 50);
                    }
                    
                    enemy.element.remove();
                    game.enemies.splice(index, 1);
                }
            });
            
            // 玩家与道具碰撞
            game.powerUps.forEach((powerUp, index) => {
                if (isColliding(powerUp, game.player, 30, 30)) {
                    applyPowerUp(powerUp.type);
                    powerUp.element.remove();
                    game.powerUps.splice(index, 1);
                }
            });
            
            // 检查游戏结束
            if (game.health <= 0) {
                gameOver();
            }
            
            updateDisplay();
        }
        
        function isColliding(obj1, obj2, size1, size2) {
            const rect1 = {
                x: obj1.x || game.player.x,
                y: obj1.y || gameArea.offsetHeight - 80,
                width: size1,
                height: size1
            };
            
            const rect2 = {
                x: obj2.x || game.player.x,
                y: obj2.y || gameArea.offsetHeight - 80,
                width: size2,
                height: size2
            };
            
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = (x - 40) + 'px';
            explosion.style.top = (y - 40) + 'px';
            
            gameArea.appendChild(explosion);
            
            setTimeout(() => {
                explosion.remove();
            }, 600);
        }
        
        function spawnPowerUp(x, y) {
            const powerUp = document.createElement('div');
            powerUp.className = 'power-up';
            
            const types = ['health', 'weapon', 'shield'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerUp.classList.add(`power-up-${type}`);
            
            switch(type) {
                case 'health':
                    powerUp.textContent = '❤️';
                    break;
                case 'weapon':
                    powerUp.textContent = '🔥';
                    break;
                case 'shield':
                    powerUp.textContent = '🛡️';
                    break;
            }
            
            powerUp.style.left = x + 'px';
            powerUp.style.top = y + 'px';
            
            gameArea.appendChild(powerUp);
            
            game.powerUps.push({
                element: powerUp,
                x: x,
                y: y,
                type: type,
                speed: 2
            });
            
            setTimeout(() => {
                if (powerUp.parentNode) {
                    powerUp.remove();
                    game.powerUps = game.powerUps.filter(p => p.element !== powerUp);
                }
            }, 4000);
        }
        
        function updatePowerUps() {
            game.powerUps.forEach((powerUp, index) => {
                powerUp.y += powerUp.speed;
                powerUp.element.style.top = powerUp.y + 'px';
                
                if (powerUp.y > gameArea.offsetHeight) {
                    powerUp.element.remove();
                    game.powerUps.splice(index, 1);
                }
            });
        }
        
        function applyPowerUp(type) {
            switch(type) {
                case 'health':
                    game.health = Math.min(game.maxHealth, game.health + 30);
                    break;
                case 'weapon':
                    game.weaponLevel = Math.min(5, game.weaponLevel + 1);
                    game.shootCooldown = Math.max(50, game.shootCooldown - 20);
                    break;
                case 'shield':
                    game.shield = true;
                    game.shieldTime = 5000; // 5秒
                    playerPlane.style.boxShadow = '0 0 20px rgba(52, 152, 219, 1)';
                    break;
            }
        }
        
        function pauseGame() {
            game.gameRunning = !game.gameRunning;
            if (!game.gameRunning) {
                clearInterval(game.gameLoop);
            } else {
                game.gameLoop = setInterval(updateGame, 16);
            }
        }
        
        function resetGame() {
            game.gameRunning = false;
            clearInterval(game.gameLoop);
            
            // 清理所有元素
            document.querySelectorAll('.enemy-plane, .bullet, .power-up, .explosion').forEach(el => el.remove());
            
            game.score = 0;
            game.wave = 1;
            game.health = 100;
            game.weaponLevel = 1;
            game.player.x = 350;
            game.enemies = [];
            game.bullets = [];
            game.enemyBullets = [];
            game.powerUps = [];
            game.shield = false;
            
            updateDisplay();
        }
        
        function gameOver() {
            game.gameRunning = false;
            clearInterval(game.gameLoop);
            
            document.getElementById('finalScore').textContent = `最终分数: ${game.score}`;
            document.getElementById('finalWave').textContent = `到达波数: ${game.wave}`;
            document.getElementById('gameOverModal').style.display = 'block';
        }
        
        function hideGameOver() {
            document.getElementById('gameOverModal').style.display = 'none';
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('wave').textContent = game.wave;
            document.getElementById('enemies').textContent = game.enemies.length;
            document.getElementById('weaponLevel').textContent = game.weaponLevel;
            
            const healthPercent = (game.health / game.maxHealth) * 100;
            document.getElementById('healthFill').style.width = healthPercent + '%';
        }
        
        // 事件监听器
        document.addEventListener('keydown', (e) => {
            game.keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            game.keys[e.code] = false;
        });
        
        // 手机控制
        document.getElementById('leftBtn').addEventListener('touchstart', () => {
            game.keys['ArrowLeft'] = true;
        });
        document.getElementById('leftBtn').addEventListener('touchend', () => {
            game.keys['ArrowLeft'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('touchstart', () => {
            game.keys['ArrowRight'] = true;
        });
        document.getElementById('rightBtn').addEventListener('touchend', () => {
            game.keys['ArrowRight'] = false;
        });
        
        document.getElementById('shootBtn').addEventListener('touchstart', () => {
            game.keys['Space'] = true;
        });
        document.getElementById('shootBtn').addEventListener('touchend', () => {
            game.keys['Space'] = false;
        });
        
        // 鼠标支持
        document.getElementById('leftBtn').addEventListener('mousedown', () => {
            game.keys['ArrowLeft'] = true;
        });
        document.getElementById('leftBtn').addEventListener('mouseup', () => {
            game.keys['ArrowLeft'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('mousedown', () => {
            game.keys['ArrowRight'] = true;
        });
        document.getElementById('rightBtn').addEventListener('mouseup', () => {
            game.keys['ArrowRight'] = false;
        });
        
        document.getElementById('shootBtn').addEventListener('mousedown', () => {
            game.keys['Space'] = true;
        });
        document.getElementById('shootBtn').addEventListener('mouseup', () => {
            game.keys['Space'] = false;
        });
        
        // 初始化
        updateDisplay();
    </script>
</body>
</html>
