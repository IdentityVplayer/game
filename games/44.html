<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光线反射迷宫 - Light Reflection Maze</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        .game-header {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header-item {
            text-align: center;
        }
        .header-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }
        .game-board {
            position: relative;
            background: #000;
            border: 3px solid #333;
            border-radius: 10px;
            margin: 20px auto;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            overflow: hidden;
        }
        .grid {
            display: grid;
            gap: 1px;
            background: #111;
        }
        .cell {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #222;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .cell:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        .cell-wall {
            background: #444 !important;
            cursor: not-allowed;
        }
        .cell-mirror {
            background: linear-gradient(45deg, #silver, #c0c0c0) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #000;
        }
        .cell-target {
            background: radial-gradient(circle, #ff6b6b, #ee5a24) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: targetPulse 2s ease-in-out infinite;
        }
        .cell-laser {
            background: #4ecdc4 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.7);
        }
        @keyframes targetPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 107, 0.7); }
            50% { box-shadow: 0 0 40px rgba(255, 107, 107, 1); }
        }
        .light-beam {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            pointer-events: none;
            z-index: 5;
            animation: beamFlow 1s ease-in-out infinite;
        }
        .light-beam-vertical {
            width: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .light-beam-horizontal {
            height: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
        @keyframes beamFlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .tool-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .tool-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            padding: 15px;
            font-size: 24px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .difficulty {
            margin: 20px 0;
        }
        .difficulty button {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
        }
        .difficulty button.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.3);
        }
        .objective {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #00d4ff;
        }
        .win-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .hint-system {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .mirror-angles {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .angle-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .angle-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔆 光线反射迷宫 Light Reflection Maze</h1>
        
        <div class="game-header">
            <div class="header-item">
                <div>关卡</div>
                <div class="header-value" id="level">1</div>
            </div>
            <div class="header-item">
                <div>移动次数</div>
                <div class="header-value" id="moves">0</div>
            </div>
            <div class="header-item">
                <div>目标数</div>
                <div class="header-value" id="targets">0/1</div>
            </div>
            <div class="header-item">
                <div>光线状态</div>
                <div class="header-value" id="laserStatus">关闭</div>
            </div>
        </div>
        
        <div class="objective">
            <strong>目标：</strong> 使用镜子将激光光线反射到所有红色目标点上。点击激光器可以开启/关闭光线。
        </div>
        
        <div class="difficulty">
            <button class="btn active" onclick="setDifficulty('easy')">简单 (8x8)</button>
            <button class="btn" onclick="setDifficulty('medium')">中等 (10x10)</button>
            <button class="btn" onclick="setDifficulty('hard')">困难 (12x12)</button>
        </div>
        
        <div class="tool-selector">
            <button class="btn tool-btn active" data-tool="mirror" onclick="selectTool('mirror')">🔍</button>
            <button class="btn tool-btn" data-tool="erase" onclick="selectTool('erase')">✖️</button>
            <button class="btn tool-btn" data-tool="laser" onclick="selectTool('laser')">🔦</button>
        </div>
        
        <div class="mirror-angles" id="mirrorAngles" style="display: block;">
            <div class="angle-btn active" onclick="selectAngle('/')">/</div>
            <div class="angle-btn" onclick="selectAngle('\\')">\</div>
        </div>
        
        <div class="game-board">
            <div id="gameGrid" class="grid"></div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="generateLevel()">新关卡</button>
            <button class="btn" onclick="clearBoard()">清空棋盘</button>
            <button class="btn" onclick="showHint()">提示</button>
            <button class="btn" onclick="toggleLaser()">开启/关闭激光</button>
        </div>
        
        <div class="hint-system">
            <h4>💡 提示系统</h4>
            <p id="hintText">点击“提示”按钮获得帮助</p>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-top: 20px; backdrop-filter: blur(10px);">
            <h3>🎮 游玩方法:</h3>
            <p>• 选择工具：🔍 镜子、✖️ 擦除、🔦 激光器</p>
            <p>• 点击空白格子放置选中的工具</p>
            <p>• 镜子有两种角度: / 和 ，可反射光线</p>
            <p>• 激光器发出光线，需要将光线引导到目标</p>
            <p>• 光线遇到镜子会反射，遇到墙壁会停止</p>
            <p>• 点亮所有红色目标即可通关</p>
        </div>
        
        <a href="../index.html" style="color: #00d4ff; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>
    
    <div id="winModal" class="win-modal">
        <h2>🎉 关卡通过！</h2>
        <p id="winMessage"></p>
        <button class="btn" onclick="nextLevel()">下一关</button>
        <button class="btn" onclick="hideWinModal()">继续游戏</button>
    </div>

    <script>
        let game = {
            grid: [],
            level: 1,
            moves: 0,
            difficulty: 'easy',
            size: 8,
            selectedTool: 'mirror',
            selectedAngle: '/',
            laserOn: false,
            laserPos: null,
            laserDir: 'right',
            targets: [],
            hitTargets: new Set(),
            lightBeams: []
        };
        
        const difficulties = {
            easy: { size: 8, targets: 1, walls: 8 },
            medium: { size: 10, targets: 2, walls: 15 },
            hard: { size: 12, targets: 3, walls: 25 }
        };
        
        function setDifficulty(level) {
            game.difficulty = level;
            game.size = difficulties[level].size;
            
            document.querySelectorAll('.difficulty .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            generateLevel();
        }
        
        function selectTool(tool) {
            game.selectedTool = tool;
            
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
            
            // 显示/隐藏镜子角度选择
            document.getElementById('mirrorAngles').style.display = 
                tool === 'mirror' ? 'flex' : 'none';
        }
        
        function selectAngle(angle) {
            game.selectedAngle = angle;
            
            document.querySelectorAll('.angle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function generateLevel() {
            const config = difficulties[game.difficulty];
            const size = game.size;
            
            // 初始化网格
            game.grid = [];
            for (let i = 0; i < size; i++) {
                game.grid[i] = [];
                for (let j = 0; j < size; j++) {
                    game.grid[i][j] = { type: 'empty' };
                }
            }
            
            // 随机放置墙壁
            for (let i = 0; i < config.walls; i++) {
                const x = Math.floor(Math.random() * size);
                const y = Math.floor(Math.random() * size);
                if (game.grid[y][x].type === 'empty') {
                    game.grid[y][x] = { type: 'wall' };
                }
            }
            
            // 放置激光器
            let laserPlaced = false;
            while (!laserPlaced) {
                const x = Math.floor(Math.random() * size);
                const y = Math.floor(Math.random() * size);
                if (game.grid[y][x].type === 'empty') {
                    game.grid[y][x] = { type: 'laser', direction: 'right' };
                    game.laserPos = { x, y };
                    laserPlaced = true;
                }
            }
            
            // 放置目标
            game.targets = [];
            for (let i = 0; i < config.targets; i++) {
                let targetPlaced = false;
                while (!targetPlaced) {
                    const x = Math.floor(Math.random() * size);
                    const y = Math.floor(Math.random() * size);
                    if (game.grid[y][x].type === 'empty') {
                        game.grid[y][x] = { type: 'target', id: i };
                        game.targets.push({ x, y, id: i });
                        targetPlaced = true;
                    }
                }
            }
            
            game.moves = 0;
            game.laserOn = false;
            game.hitTargets.clear();
            game.lightBeams = [];
            
            renderGrid();
            updateDisplay();
        }
        
        function renderGrid() {
            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            gameGrid.style.gridTemplateColumns = `repeat(${game.size}, 1fr)`;
            
            for (let i = 0; i < game.size; i++) {
                for (let j = 0; j < game.size; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = j;
                    cell.dataset.y = i;
                    
                    const cellData = game.grid[i][j];
                    
                    switch(cellData.type) {
                        case 'wall':
                            cell.classList.add('cell-wall');
                            break;
                        case 'mirror':
                            cell.classList.add('cell-mirror');
                            cell.textContent = cellData.angle;
                            break;
                        case 'laser':
                            cell.classList.add('cell-laser');
                            cell.textContent = '🔦';
                            cell.onclick = () => toggleLaser();
                            break;
                        case 'target':
                            cell.classList.add('cell-target');
                            cell.textContent = '🎯';
                            break;
                        default:
                            cell.onclick = () => placeTool(j, i);
                            break;
                    }
                    
                    gameGrid.appendChild(cell);
                }
            }
            
            // 渲染光线
            if (game.laserOn) {
                calculateLightPath();
            }
        }
        
        function placeTool(x, y) {
            if (game.grid[y][x].type !== 'empty') return;
            
            game.moves++;
            
            switch(game.selectedTool) {
                case 'mirror':
                    game.grid[y][x] = { type: 'mirror', angle: game.selectedAngle };
                    break;
                case 'erase':
                    game.grid[y][x] = { type: 'empty' };
                    break;
                case 'laser':
                    // 移除旧激光器
                    if (game.laserPos) {
                        game.grid[game.laserPos.y][game.laserPos.x] = { type: 'empty' };
                    }
                    game.grid[y][x] = { type: 'laser', direction: 'right' };
                    game.laserPos = { x, y };
                    break;
            }
            
            renderGrid();
            updateDisplay();
            
            if (game.laserOn) {
                calculateLightPath();
            }
        }
        
        function toggleLaser() {
            game.laserOn = !game.laserOn;
            
            // 清除旧光线
            document.querySelectorAll('.light-beam').forEach(beam => beam.remove());
            
            if (game.laserOn) {
                calculateLightPath();
            }
            
            updateDisplay();
        }
        
        function calculateLightPath() {
            if (!game.laserPos) return;
            
            // 清除旧光线
            document.querySelectorAll('.light-beam').forEach(beam => beam.remove());
            game.hitTargets.clear();
            
            let currentPos = { ...game.laserPos };
            let currentDir = 'right';
            const visited = new Set();
            
            while (true) {
                const posKey = `${currentPos.x},${currentPos.y},${currentDir}`;
                if (visited.has(posKey)) break; // 防止无限循环
                visited.add(posKey);
                
                // 计算下一个位置
                let nextPos = { ...currentPos };
                switch(currentDir) {
                    case 'right': nextPos.x++; break;
                    case 'left': nextPos.x--; break;
                    case 'up': nextPos.y--; break;
                    case 'down': nextPos.y++; break;
                }
                
                // 检查边界
                if (nextPos.x < 0 || nextPos.x >= game.size || 
                    nextPos.y < 0 || nextPos.y >= game.size) {
                    break;
                }
                
                // 绘制光线
                drawLightBeam(currentPos, nextPos);
                
                currentPos = nextPos;
                const cell = game.grid[currentPos.y][currentPos.x];
                
                // 检查碰撞
                if (cell.type === 'wall') {
                    break;
                } else if (cell.type === 'mirror') {
                    // 光线反射
                    currentDir = reflectDirection(currentDir, cell.angle);
                } else if (cell.type === 'target') {
                    // 命中目标
                    game.hitTargets.add(cell.id);
                }
            }
            
            // 检查胜利条件
            if (game.hitTargets.size === game.targets.length) {
                setTimeout(() => showWinModal(), 500);
            }
            
            updateDisplay();
        }
        
        function reflectDirection(direction, mirrorAngle) {
            const reflectionMap = {
                '/': {
                    'right': 'up',
                    'left': 'down',
                    'up': 'right',
                    'down': 'left'
                },
                '\\': {
                    'right': 'down',
                    'left': 'up',
                    'up': 'left',
                    'down': 'right'
                }
            };
            
            return reflectionMap[mirrorAngle][direction] || direction;
        }
        
        function drawLightBeam(from, to) {
            const gameGrid = document.getElementById('gameGrid');
            const beam = document.createElement('div');
            beam.className = 'light-beam';
            
            const cellSize = 40; // 颗估单元格大小
            
            if (from.x === to.x) {
                // 垂直光线
                beam.classList.add('light-beam-vertical');
                beam.style.left = (from.x * cellSize + cellSize/2) + 'px';
                beam.style.top = (Math.min(from.y, to.y) * cellSize) + 'px';
                beam.style.height = cellSize + 'px';
            } else {
                // 水平光线
                beam.classList.add('light-beam-horizontal');
                beam.style.top = (from.y * cellSize + cellSize/2) + 'px';
                beam.style.left = (Math.min(from.x, to.x) * cellSize) + 'px';
                beam.style.width = cellSize + 'px';
            }
            
            gameGrid.appendChild(beam);
        }
        
        function showHint() {
            const hints = [
                '尝试在光线路径上放置镜子来改变光线方向',
                '使用 / 镜子可以将水平光线变为垂直光线',
                '使用 \\ 镜子可以将水平光线变为向下的光线',
                '可以移动激光器的位置来改变起始光线方向',
                '光线遇到墙壁会停止，可以利用这个特性设计路径'
            ];
            
            const randomHint = hints[Math.floor(Math.random() * hints.length)];
            document.getElementById('hintText').textContent = randomHint;
        }
        
        function clearBoard() {
            for (let i = 0; i < game.size; i++) {
                for (let j = 0; j < game.size; j++) {
                    if (game.grid[i][j].type === 'mirror') {
                        game.grid[i][j] = { type: 'empty' };
                    }
                }
            }
            
            game.moves = 0;
            renderGrid();
            updateDisplay();
        }
        
        function showWinModal() {
            const winMessage = document.getElementById('winMessage');
            winMessage.innerHTML = `
                <p>关卡 ${game.level} 完成！</p>
                <p>移动次数: ${game.moves}</p>
                <p>命中目标: ${game.hitTargets.size}/${game.targets.length}</p>
            `;
            
            document.getElementById('winModal').style.display = 'block';
        }
        
        function nextLevel() {
            game.level++;
            hideWinModal();
            generateLevel();
        }
        
        function hideWinModal() {
            document.getElementById('winModal').style.display = 'none';
        }
        
        function updateDisplay() {
            document.getElementById('level').textContent = game.level;
            document.getElementById('moves').textContent = game.moves;
            document.getElementById('targets').textContent = 
                `${game.hitTargets.size}/${game.targets.length}`;
            document.getElementById('laserStatus').textContent = 
                game.laserOn ? '开启' : '关闭';
        }
        
        // 初始化游戏
        generateLevel();
    </script>
</body>
</html>
