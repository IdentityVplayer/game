<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦幻射击 3747</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #45B7D1, #DDA0DD);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #4ECDC4, #4ECDC4);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameCanvas {
            border: 3px solid #333;
            background: #000;
            margin: 20px 0;
        }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>梦幻射击 3747</h1>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="score">得分: <span id="score">0</span></div>
        <div class="score">生命: <span id="lives">3</span></div>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div style="margin-top: 10px; font-size: 14px;">
            使用方向键移动，空格键射击
        </div>
        
    </div>
    
    <script>
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 40,
            height: 30,
            speed: 5,
            color: '#45B7D1'
        };
        
        let bullets = [];
        let enemies = [];
        let powerups = [];
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let keys = {};
        let lastShot = 0;
        
        function gameLoop() {
            if (!gameRunning) return;
            
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            const now = Date.now();
            
            // Player movement
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if (keys['ArrowUp'] && player.y > 0) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }
            
            // Shooting
            if (keys['Space'] && now - lastShot > 200) {
                bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y,
                    width: 4,
                    height: 10,
                    speed: 8,
                    color: '#ffff00'
                });
                lastShot = now;
            }
            
            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
            
            // Spawn enemies
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 2 + Math.random() * 3,
                    color: '#ff4444',
                    health: 1
                });
            }
            
            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    continue;
                }
                
                // Enemy-player collision
                if (player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y) {
                    
                    enemies.splice(i, 1);
                    lives--;
                    if (lives <= 0) {
                        gameOver();
                        return;
                    }
                }
            }
            
            // Bullet-enemy collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (bullets[i].x < enemies[j].x + enemies[j].width &&
                        bullets[i].x + bullets[i].width > enemies[j].x &&
                        bullets[i].y < enemies[j].y + enemies[j].height &&
                        bullets[i].y + bullets[i].height > enemies[j].y) {
                        
                        enemies[j].health--;
                        bullets.splice(i, 1);
                        
                        if (enemies[j].health <= 0) {
                            score += 100;
                            enemies.splice(j, 1);
                            
                            // Random powerup
                            if (Math.random() < 0.1) {
                                powerups.push({
                                    x: enemies[j] ? enemies[j].x : Math.random() * canvas.width,
                                    y: enemies[j] ? enemies[j].y : Math.random() * canvas.height,
                                    width: 20,
                                    height: 20,
                                    type: 'health',
                                    color: '#00ff00'
                                });
                            }
                        }
                        break;
                    }
                }
            }
            
            // Update powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += 2;
                
                if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                    continue;
                }
                
                // Powerup-player collision
                if (player.x < powerups[i].x + powerups[i].width &&
                    player.x + player.width > powerups[i].x &&
                    player.y < powerups[i].y + powerups[i].height &&
                    player.y + player.height > powerups[i].y) {
                    
                    if (powerups[i].type === 'health') {
                        lives = Math.min(lives + 1, 5);
                    }
                    powerups.splice(i, 1);
                }
            }
            
            updateUI();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars background
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }
            
            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw player details
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + 18, player.y - 5, 4, 10);
            
            // Draw bullets
            for (let bullet of bullets) {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }
            
            // Draw enemies
            for (let enemy of enemies) {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            }
            
            // Draw powerups
            for (let powerup of powerups) {
                ctx.fillStyle = powerup.color;
                ctx.fillRect(powerup.x, powerup.y, powerup.width, powerup.height);
                
                // Draw + sign for health
                if (powerup.type === 'health') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(powerup.x + 8, powerup.y + 5, 4, 10);
                    ctx.fillRect(powerup.x + 5, powerup.y + 8, 10, 4);
                }
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }
        
        function gameOver() {
            gameRunning = false;
            alert('游戏结束！得分: ' + score);
        }
        
        function startGame() {
            bullets = [];
            enemies = [];
            powerups = [];
            score = 0;
            lives = 3;
            gameRunning = true;
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;
            updateUI();
            gameLoop();
        }
        
        // Keyboard event listeners
        document.addEventListener('keydown', function(e) {
            keys[e.code] = true;
            e.preventDefault();
        });
        
        document.addEventListener('keyup', function(e) {
            keys[e.code] = false;
            e.preventDefault();
        });
        
        updateUI();
        
    </script>
</body>
</html>
