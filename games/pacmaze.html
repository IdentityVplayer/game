<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Maze - 迷宫吃豆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000428, #004e92);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border: 3px solid #ffff00;
            border-radius: 10px;
            box-shadow: 0 0 20px #ffff00;
            background: #000;
        }

        canvas {
            background: #000;
            display: block;
            border-radius: 7px;
        }

        .ui {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 16px;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
        }

        .controls {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 7px;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #ffff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #cccc00;
            transform: scale(1.05);
        }

        .touch-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            width: 120px;
            height: 120px;
        }

        .dpad-btn {
            background: rgba(255, 255, 0, 0.3);
            border: 2px solid #ffff00;
            border-radius: 5px;
            color: #ffff00;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .dpad-btn:active {
            background: rgba(255, 255, 0, 0.6);
        }

        @media (max-width: 768px) {
            .game-container {
                width: 95vw;
                height: 70vh;
            }
            
            .touch-controls {
                display: block;
            }
            
            .controls {
                bottom: -120px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div class="ui">
            <div>得分: <span id="score">0</span></div>
            <div>等级: <span id="level">1</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>
        
        <div class="controls">
            <div>使用方向键控制移动</div>
            <div>吃掉所有豆子避开敌人</div>
        </div>
        
        <div class="touch-controls">
            <div class="dpad">
                <div></div>
                <div class="dpad-btn" data-direction="up">↑</div>
                <div></div>
                <div class="dpad-btn" data-direction="left">←</div>
                <div></div>
                <div class="dpad-btn" data-direction="right">→</div>
                <div></div>
                <div class="dpad-btn" data-direction="down">↓</div>
                <div></div>
            </div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <h1 style="font-size: 48px; color: #ffff00; text-shadow: 0 0 20px #ffff00; margin-bottom: 20px;">PAC-MAZE</h1>
            <p style="font-size: 18px; margin-bottom: 10px;">迷宫吃豆游戏</p>
            <p style="font-size: 14px; color: #888; margin-bottom: 20px;">吃掉所有豆子，避开敌人！</p>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏配置
        const CELL_SIZE = 20;
        const ROWS = Math.floor(canvas.height / CELL_SIZE);
        const COLS = Math.floor(canvas.width / CELL_SIZE);

        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;

        // 迷宫地图 (1=墙, 0=空, 2=豆子, 3=大豆子)
        let maze = [];
        let originalMaze = [];

        // 游戏对象
        let player = { x: 1, y: 1, direction: 0, nextDirection: 0 };
        let ghosts = [];
        let powerUpTime = 0;

        // 方向常量
        const DIRECTIONS = {
            RIGHT: 0,
            DOWN: 1,
            LEFT: 2,
            UP: 3
        };

        const DIR_VECTORS = [
            { x: 1, y: 0 },   // RIGHT
            { x: 0, y: 1 },   // DOWN
            { x: -1, y: 0 },  // LEFT
            { x: 0, y: -1 }   // UP
        ];

        // 按键状态
        const keys = {};

        // 事件监听
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            switch(e.key) {
                case 'ArrowUp': player.nextDirection = DIRECTIONS.UP; break;
                case 'ArrowDown': player.nextDirection = DIRECTIONS.DOWN; break;
                case 'ArrowLeft': player.nextDirection = DIRECTIONS.LEFT; break;
                case 'ArrowRight': player.nextDirection = DIRECTIONS.RIGHT; break;
            }
            e.preventDefault();
        });

        // 触摸控制
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const direction = btn.dataset.direction;
                switch(direction) {
                    case 'up': player.nextDirection = DIRECTIONS.UP; break;
                    case 'down': player.nextDirection = DIRECTIONS.DOWN; break;
                    case 'left': player.nextDirection = DIRECTIONS.LEFT; break;
                    case 'right': player.nextDirection = DIRECTIONS.RIGHT; break;
                }
            });
        });

        function generateMaze() {
            // 创建基础迷宫
            maze = [];
            for (let y = 0; y < ROWS; y++) {
                maze[y] = [];
                for (let x = 0; x < COLS; x++) {
                    if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) {
                        maze[y][x] = 1; // 边界墙
                    } else if (x % 2 === 0 && y % 2 === 0) {
                        maze[y][x] = 1; // 内部墙
                    } else {
                        maze[y][x] = 2; // 豆子
                    }
                }
            }

            // 添加一些随机墙
            for (let i = 0; i < 20; i++) {
                const x = Math.floor(Math.random() * (COLS - 2)) + 1;
                const y = Math.floor(Math.random() * (ROWS - 2)) + 1;
                if (maze[y][x] !== 1) {
                    maze[y][x] = Math.random() > 0.3 ? 1 : 2;
                }
            }

            // 确保玩家起始位置为空
            maze[1][1] = 0;
            maze[1][2] = 0;
            maze[2][1] = 0;

            // 添加大豆子
            for (let i = 0; i < 4; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * (COLS - 2)) + 1;
                    y = Math.floor(Math.random() * (ROWS - 2)) + 1;
                } while (maze[y][x] !== 2);
                maze[y][x] = 3;
            }

            originalMaze = maze.map(row => [...row]);
        }

        function createGhosts() {
            ghosts = [];
            const colors = ['#ff0000', '#ffb8ff', '#00ffff', '#ffb852'];
            
            for (let i = 0; i < Math.min(4, level + 1); i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * (COLS - 2)) + 1;
                    y = Math.floor(Math.random() * (ROWS - 2)) + 1;
                } while (maze[y][x] === 1 || (x < 3 && y < 3));

                ghosts.push({
                    x: x,
                    y: y,
                    direction: Math.floor(Math.random() * 4),
                    color: colors[i % colors.length],
                    mode: 'chase', // chase, flee, scatter
                    modeTimer: 0
                });
            }
        }

        function startGame() {
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';
            
            score = 0;
            level = 1;
            lives = 3;
            powerUpTime = 0;
            
            player = { x: 1, y: 1, direction: 0, nextDirection: 0 };
            
            generateMaze();
            createGhosts();
            
            gameLoop();
        }

        function canMove(x, y) {
            return x >= 0 && x < COLS && y >= 0 && y < ROWS && maze[y][x] !== 1;
        }

        function updatePlayer() {
            const nextDir = DIR_VECTORS[player.nextDirection];
            if (canMove(player.x + nextDir.x, player.y + nextDir.y)) {
                player.direction = player.nextDirection;
            }

            const dir = DIR_VECTORS[player.direction];
            const newX = player.x + dir.x;
            const newY = player.y + dir.y;

            if (canMove(newX, newY)) {
                player.x = newX;
                player.y = newY;

                // 吃豆子
                if (maze[player.y][player.x] === 2) {
                    maze[player.y][player.x] = 0;
                    score += 10;
                } else if (maze[player.y][player.x] === 3) {
                    maze[player.y][player.x] = 0;
                    score += 50;
                    powerUpTime = 200; // 200帧的无敌时间
                }

                // 边界传送
                if (player.x < 0) player.x = COLS - 1;
                if (player.x >= COLS) player.x = 0;
            }
        }

        function updateGhosts() {
            for (const ghost of ghosts) {
                ghost.modeTimer++;
                
                // 模式切换
                if (powerUpTime > 0) {
                    ghost.mode = 'flee';
                } else if (ghost.modeTimer > 300) {
                    ghost.mode = Math.random() > 0.7 ? 'scatter' : 'chase';
                    ghost.modeTimer = 0;
                }

                // AI移动
                const possibleMoves = [];
                for (let i = 0; i < 4; i++) {
                    const dir = DIR_VECTORS[i];
                    const newX = ghost.x + dir.x;
                    const newY = ghost.y + dir.y;
                    
                    if (canMove(newX, newY) && i !== (ghost.direction + 2) % 4) {
                        possibleMoves.push(i);
                    }
                }

                if (possibleMoves.length > 0) {
                    if (ghost.mode === 'flee') {
                        // 逃跑模式 - 远离玩家
                        let bestDir = possibleMoves[0];
                        let maxDist = 0;
                        
                        for (const dir of possibleMoves) {
                            const vec = DIR_VECTORS[dir];
                            const newX = ghost.x + vec.x;
                            const newY = ghost.y + vec.y;
                            const dist = Math.abs(newX - player.x) + Math.abs(newY - player.y);
                            
                            if (dist > maxDist) {
                                maxDist = dist;
                                bestDir = dir;
                            }
                        }
                        ghost.direction = bestDir;
                    } else if (ghost.mode === 'chase') {
                        // 追逐模式 - 接近玩家
                        let bestDir = possibleMoves[0];
                        let minDist = Infinity;
                        
                        for (const dir of possibleMoves) {
                            const vec = DIR_VECTORS[dir];
                            const newX = ghost.x + vec.x;
                            const newY = ghost.y + vec.y;
                            const dist = Math.abs(newX - player.x) + Math.abs(newY - player.y);
                            
                            if (dist < minDist) {
                                minDist = dist;
                                bestDir = dir;
                            }
                        }
                        ghost.direction = bestDir;
                    } else {
                        // 随机模式
                        ghost.direction = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                    }
                }

                // 移动幽灵
                const dir = DIR_VECTORS[ghost.direction];
                const newX = ghost.x + dir.x;
                const newY = ghost.y + dir.y;

                if (canMove(newX, newY)) {
                    ghost.x = newX;
                    ghost.y = newY;
                }

                // 边界传送
                if (ghost.x < 0) ghost.x = COLS - 1;
                if (ghost.x >= COLS) ghost.x = 0;
            }

            if (powerUpTime > 0) {
                powerUpTime--;
            }
        }

        function checkCollisions() {
            for (const ghost of ghosts) {
                if (ghost.x === player.x && ghost.y === player.y) {
                    if (powerUpTime > 0) {
                        // 吃掉幽灵
                        score += 200;
                        ghost.x = Math.floor(COLS / 2);
                        ghost.y = Math.floor(ROWS / 2);
                    } else {
                        // 玩家死亡
                        lives--;
                        player.x = 1;
                        player.y = 1;
                        
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                }
            }
        }

        function checkWin() {
            let dotsLeft = 0;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === 2 || maze[y][x] === 3) {
                        dotsLeft++;
                    }
                }
            }

            if (dotsLeft === 0) {
                level++;
                score += 1000;
                generateMaze();
                createGhosts();
                player.x = 1;
                player.y = 1;
            }
        }

        function endGame() {
            gameRunning = false;
            const startScreen = document.getElementById('startScreen');
            startScreen.style.display = 'flex';
            startScreen.innerHTML = `
                <h1 style="font-size: 48px; color: #ffff00; text-shadow: 0 0 20px #ffff00; margin-bottom: 20px;">游戏结束</h1>
                <p style="font-size: 24px; margin-bottom: 10px;">最终得分: ${score}</p>
                <p style="font-size: 18px; margin-bottom: 20px;">达到等级: ${level}</p>
                <button class="start-btn" onclick="startGame()">重新开始</button>
            `;
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制迷宫
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cellX = x * CELL_SIZE;
                    const cellY = y * CELL_SIZE;

                    if (maze[y][x] === 1) {
                        // 墙
                        ctx.fillStyle = '#0000ff';
                        ctx.fillRect(cellX, cellY, CELL_SIZE, CELL_SIZE);
                    } else if (maze[y][x] === 2) {
                        // 小豆子
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(cellX + CELL_SIZE / 2, cellY + CELL_SIZE / 2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (maze[y][x] === 3) {
                        // 大豆子
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(cellX + CELL_SIZE / 2, cellY + CELL_SIZE / 2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // 绘制玩家
            const playerX = player.x * CELL_SIZE + CELL_SIZE / 2;
            const playerY = player.y * CELL_SIZE + CELL_SIZE / 2;
            
            ctx.fillStyle = powerUpTime > 0 ? '#00ff00' : '#ffff00';
            ctx.beginPath();
            
            // Pac-Man形状
            const mouthAngle = Math.PI / 4;
            const startAngle = player.direction * Math.PI / 2 - mouthAngle / 2;
            const endAngle = player.direction * Math.PI / 2 + mouthAngle / 2;
            
            ctx.arc(playerX, playerY, CELL_SIZE / 2 - 2, endAngle, startAngle);
            ctx.lineTo(playerX, playerY);
            ctx.closePath();
            ctx.fill();

            // 绘制幽灵
            for (const ghost of ghosts) {
                const ghostX = ghost.x * CELL_SIZE + CELL_SIZE / 2;
                const ghostY = ghost.y * CELL_SIZE + CELL_SIZE / 2;
                
                ctx.fillStyle = powerUpTime > 0 ? '#0000ff' : ghost.color;
                
                // 幽灵身体
                ctx.beginPath();
                ctx.arc(ghostX, ghostY - 2, CELL_SIZE / 2 - 2, Math.PI, 0);
                ctx.lineTo(ghostX + CELL_SIZE / 2 - 2, ghostY + CELL_SIZE / 2 - 2);
                
                // 幽灵底部锯齿
                for (let i = 0; i < 3; i++) {
                    const x = ghostX + CELL_SIZE / 2 - 2 - (i + 1) * (CELL_SIZE - 4) / 3;
                    const y = ghostY + CELL_SIZE / 2 - 2 - (i % 2) * 3;
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(ghostX - CELL_SIZE / 2 + 2, ghostY + CELL_SIZE / 2 - 2);
                ctx.closePath();
                ctx.fill();

                // 幽灵眼睛
                if (powerUpTime <= 0) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ghostX - 4, ghostY - 4, 2, 0, Math.PI * 2);
                    ctx.arc(ghostX + 4, ghostY - 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(ghostX - 4, ghostY - 4, 1, 0, Math.PI * 2);
                    ctx.arc(ghostX + 4, ghostY - 4, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 更新UI
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
        }

        function gameLoop() {
            if (!gameRunning) return;

            updatePlayer();
            updateGhosts();
            checkCollisions();
            checkWin();
            draw();

            setTimeout(() => requestAnimationFrame(gameLoop), 150);
        }

        // 响应式调整
        function resizeCanvas() {
            if (window.innerWidth <= 768) {
                canvas.width = Math.min(400, window.innerWidth - 40);
                canvas.height = Math.min(400, window.innerHeight - 300);
            } else {
                canvas.width = 600;
                canvas.height = 600;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 初始绘制
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
