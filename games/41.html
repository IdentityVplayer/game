<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迎宫打鼠 - Whack-a-Mole Palace</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .score-display {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        .timer-display {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
        }
        .level-display {
            font-size: 20px;
            font-weight: bold;
            color: #4ecdc4;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(139, 69, 19, 0.8);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .hole {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #8B4513, #654321);
            border-radius: 50%;
            position: relative;
            border: 5px solid #A0522D;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .hole:hover {
            transform: scale(1.05);
        }
        .mole {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #8B4513, #A0522D);
            border-radius: 50% 50% 40% 40%;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            z-index: 10;
        }
        .mole.show {
            bottom: 20px;
            animation: moleWiggle 0.5s ease-in-out infinite alternate;
        }
        .mole::before {
            content: '🐭';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            z-index: 1;
        }
        .mole.golden::before {
            content: '🦇';
            animation: goldShine 1s ease-in-out infinite;
        }
        .mole.bomb::before {
            content: '💣';
            animation: bombPulse 0.5s ease-in-out infinite;
        }
        @keyframes moleWiggle {
            0% { transform: translateX(-50%) rotate(-2deg); }
            100% { transform: translateX(-50%) rotate(2deg); }
        }
        @keyframes goldShine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5) drop-shadow(0 0 10px gold); }
        }
        @keyframes bombPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .hit-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
            pointer-events: none;
            animation: hitPop 0.6s ease-out;
        }
        @keyframes hitPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-30px);
            }
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .difficulty {
            margin: 20px 0;
        }
        .difficulty button {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
        }
        .difficulty button.active {
            border-color: #ffd700;
            background: rgba(255,215,0,0.3);
        }
        .power-ups {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .power-up {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            min-width: 80px;
        }
        .power-up.active {
            border-color: #4ecdc4;
            background: rgba(78,205,196,0.2);
        }
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐭 迎宫打鼠 Whack-a-Mole Palace</h1>
        
        <div class="game-header">
            <div class="score-display">🏆 分数: <span id="score">0</span></div>
            <div class="timer-display">⏱️ 时间: <span id="timer">60</span>s</div>
            <div class="level-display">🎆 等级: <span id="level">1</span></div>
        </div>
        
        <div class="power-ups">
            <div class="power-up" id="slowTime">
                <div>⏳ 时间减缓</div>
                <div style="font-size: 12px;">0/3</div>
            </div>
            <div class="power-up" id="doubleScore">
                <div>✨ 双倍分数</div>
                <div style="font-size: 12px;">0/2</div>
            </div>
            <div class="power-up" id="moreTime">
                <div>⏰ 时间加成</div>
                <div style="font-size: 12px;">0/1</div>
            </div>
        </div>
        
        <div class="difficulty">
            <button class="btn active" onclick="setDifficulty('easy')">简单</button>
            <button class="btn" onclick="setDifficulty('medium')">中等</button>
            <button class="btn" onclick="setDifficulty('hard')">困难</button>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 9个洞穴将在这里生成 -->
        </div>
        
        <div class="controls">
            <button class="btn" onclick="startGame()">开始游戏</button>
            <button class="btn" onclick="pauseGame()">暂停</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-top: 20px; backdrop-filter: blur(10px);">
            <h3>🎮 游玩方法:</h3>
            <p>• 点击出现的地鼠获得分数</p>
            <p>• 🦇 黄金地鼠价值更高，可获得道具</p>
            <p>• 💣 炸弹地鼠不要点击，会扣分</p>
            <p>• 随着等级提升，地鼠出现速度加快</p>
            <p>• 合理使用道具获得更高分数</p>
            <p>• 在限定时间内获得尽可能高的分数</p>
        </div>
        
        <a href="../index.html" style="color: #ffd700; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>
    
    <div id="gameOverModal" class="game-over">
        <h2>🎉 游戏结束！</h2>
        <p id="finalScore"></p>
        <p id="finalLevel"></p>
        <button class="btn" onclick="hideGameOver()">继续游戏</button>
    </div>

    <script>
        let game = {
            score: 0,
            timeLeft: 60,
            level: 1,
            gameRunning: false,
            gameTimer: null,
            moleTimer: null,
            difficulty: 'easy',
            activeMoles: [],
            powerUps: {
                slowTime: 0,
                doubleScore: 0,
                moreTime: 0
            },
            effects: {
                slowTimeActive: false,
                doubleScoreActive: false
            }
        };
        
        const difficulties = {
            easy: { minInterval: 1500, maxInterval: 3000, moleTime: 2000 },
            medium: { minInterval: 1000, maxInterval: 2000, moleTime: 1500 },
            hard: { minInterval: 500, maxInterval: 1200, moleTime: 1000 }
        };
        
        function initializeGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            // 创建9个洞穴
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.dataset.index = i;
                
                const mole = document.createElement('div');
                mole.className = 'mole';
                mole.onclick = () => hitMole(i);
                
                hole.appendChild(mole);
                gameBoard.appendChild(hole);
            }
            
            updateDisplay();
        }
        
        function setDifficulty(level) {
            game.difficulty = level;
            
            document.querySelectorAll('.difficulty .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function startGame() {
            if (game.gameRunning) return;
            
            game.gameRunning = true;
            game.score = 0;
            game.timeLeft = 60;
            game.level = 1;
            game.activeMoles = [];
            game.powerUps = { slowTime: 0, doubleScore: 0, moreTime: 0 };
            game.effects = { slowTimeActive: false, doubleScoreActive: false };
            
            updateDisplay();
            updatePowerUps();
            
            // 开始计时器
            game.gameTimer = setInterval(() => {
                game.timeLeft--;
                updateDisplay();
                
                if (game.timeLeft <= 0) {
                    endGame();
                }
                
                // 等级提升
                const newLevel = Math.floor(game.score / 500) + 1;
                if (newLevel > game.level) {
                    game.level = newLevel;
                    updateDisplay();
                }
            }, 1000);
            
            // 开始生成地鼠
            spawnMole();
        }
        
        function spawnMole() {
            if (!game.gameRunning) return;
            
            const config = difficulties[game.difficulty];
            let interval = config.minInterval + Math.random() * (config.maxInterval - config.minInterval);
            
            // 等级越高，间隔越短
            interval = interval * Math.max(0.5, 1 - game.level * 0.1);
            
            // 时间减缓效果
            if (game.effects.slowTimeActive) {
                interval *= 1.5;
            }
            
            setTimeout(() => {
                if (game.gameRunning) {
                    createMole();
                    spawnMole();
                }
            }, interval);
        }
        
        function createMole() {
            // 获取没有地鼠的洞穴
            const emptyHoles = [];
            for (let i = 0; i < 9; i++) {
                if (!game.activeMoles.includes(i)) {
                    emptyHoles.push(i);
                }
            }
            
            if (emptyHoles.length === 0) return;
            
            const holeIndex = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];
            const mole = document.querySelector(`[data-index="${holeIndex}"] .mole`);
            
            // 随机决定地鼠类型
            let moleType = 'normal';
            const rand = Math.random();
            
            if (rand < 0.05) {
                moleType = 'bomb';
            } else if (rand < 0.15) {
                moleType = 'golden';
            }
            
            mole.className = `mole show ${moleType}`;
            game.activeMoles.push(holeIndex);
            
            // 设置地鼠消失时间
            const config = difficulties[game.difficulty];
            let hideTime = config.moleTime;
            
            if (game.effects.slowTimeActive) {
                hideTime *= 1.3;
            }
            
            setTimeout(() => {
                if (mole.classList.contains('show')) {
                    hideMole(holeIndex);
                }
            }, hideTime);
        }
        
        function hitMole(holeIndex) {
            const mole = document.querySelector(`[data-index="${holeIndex}"] .mole`);
            const hole = document.querySelector(`[data-index="${holeIndex}"]`);
            
            if (!mole.classList.contains('show')) return;
            
            let points = 0;
            let effect = '';
            
            if (mole.classList.contains('bomb')) {
                // 炸弹地鼠，扣分
                points = -50;
                effect = '-50';
                showHitEffect(hole, effect, '#ff6b6b');
            } else if (mole.classList.contains('golden')) {
                // 黄金地鼠
                points = 100;
                effect = '+100';
                showHitEffect(hole, effect, '#ffd700');
                
                // 随机获得道具
                const powerUpTypes = ['slowTime', 'doubleScore', 'moreTime'];
                const randomPowerUp = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
                
                if (randomPowerUp === 'slowTime' && game.powerUps.slowTime < 3) {
                    game.powerUps.slowTime++;
                } else if (randomPowerUp === 'doubleScore' && game.powerUps.doubleScore < 2) {
                    game.powerUps.doubleScore++;
                } else if (randomPowerUp === 'moreTime' && game.powerUps.moreTime < 1) {
                    game.powerUps.moreTime++;
                }
                
                updatePowerUps();
            } else {
                // 普通地鼠
                points = 20 + game.level * 5;
                effect = '+' + points;
                showHitEffect(hole, effect, '#4ecdc4');
            }
            
            // 双倍分数效果
            if (game.effects.doubleScoreActive && points > 0) {
                points *= 2;
            }
            
            game.score = Math.max(0, game.score + points);
            hideMole(holeIndex);
            updateDisplay();
        }
        
        function hideMole(holeIndex) {
            const mole = document.querySelector(`[data-index="${holeIndex}"] .mole`);
            mole.className = 'mole';
            
            const index = game.activeMoles.indexOf(holeIndex);
            if (index > -1) {
                game.activeMoles.splice(index, 1);
            }
        }
        
        function showHitEffect(hole, text, color) {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.textContent = text;
            effect.style.color = color;
            
            hole.style.position = 'relative';
            hole.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 600);
        }
        
        function usePowerUp(type) {
            if (game.powerUps[type] <= 0 || !game.gameRunning) return;
            
            game.powerUps[type]--;
            
            switch(type) {
                case 'slowTime':
                    game.effects.slowTimeActive = true;
                    setTimeout(() => {
                        game.effects.slowTimeActive = false;
                    }, 10000);
                    break;
                    
                case 'doubleScore':
                    game.effects.doubleScoreActive = true;
                    setTimeout(() => {
                        game.effects.doubleScoreActive = false;
                    }, 15000);
                    break;
                    
                case 'moreTime':
                    game.timeLeft += 20;
                    break;
            }
            
            updatePowerUps();
            updateDisplay();
        }
        
        function updatePowerUps() {
            document.querySelector('#slowTime div:last-child').textContent = `${game.powerUps.slowTime}/3`;
            document.querySelector('#doubleScore div:last-child').textContent = `${game.powerUps.doubleScore}/2`;
            document.querySelector('#moreTime div:last-child').textContent = `${game.powerUps.moreTime}/1`;
            
            // 更新按钮状态
            document.getElementById('slowTime').className = 
                game.powerUps.slowTime > 0 ? 'power-up active' : 'power-up';
            document.getElementById('doubleScore').className = 
                game.powerUps.doubleScore > 0 ? 'power-up active' : 'power-up';
            document.getElementById('moreTime').className = 
                game.powerUps.moreTime > 0 ? 'power-up active' : 'power-up';
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('timer').textContent = game.timeLeft;
            document.getElementById('level').textContent = game.level;
        }
        
        function pauseGame() {
            if (!game.gameRunning) return;
            
            game.gameRunning = false;
            clearInterval(game.gameTimer);
            
            // 暂停所有地鼠动画
            document.querySelectorAll('.mole.show').forEach(mole => {
                mole.style.animationPlayState = 'paused';
            });
        }
        
        function resetGame() {
            game.gameRunning = false;
            clearInterval(game.gameTimer);
            
            // 清理所有地鼠
            document.querySelectorAll('.mole').forEach(mole => {
                mole.className = 'mole';
            });
            
            game.activeMoles = [];
            game.score = 0;
            game.timeLeft = 60;
            game.level = 1;
            game.powerUps = { slowTime: 0, doubleScore: 0, moreTime: 0 };
            game.effects = { slowTimeActive: false, doubleScoreActive: false };
            
            updateDisplay();
            updatePowerUps();
        }
        
        function endGame() {
            game.gameRunning = false;
            clearInterval(game.gameTimer);
            
            document.getElementById('finalScore').textContent = `最终分数: ${game.score}`;
            document.getElementById('finalLevel').textContent = `达到等级: ${game.level}`;
            document.getElementById('gameOverModal').style.display = 'block';
        }
        
        function hideGameOver() {
            document.getElementById('gameOverModal').style.display = 'none';
        }
        
        // 道具点击事件
        document.getElementById('slowTime').addEventListener('click', () => usePowerUp('slowTime'));
        document.getElementById('doubleScore').addEventListener('click', () => usePowerUp('doubleScore'));
        document.getElementById('moreTime').addEventListener('click', () => usePowerUp('moreTime'));
        
        // 初始化游戏
        initializeGame();
    </script>
</body>
</html>
