<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字棋</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 30px auto;
            background: #2c3e50;
            padding: 5px;
            border-radius: 10px;
        }

        .cell {
            background: #ecf0f1;
            border: none;
            border-radius: 8px;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #bdc3c7;
            transform: scale(1.05);
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell.winning {
            background: #f1c40f;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .game-info {
            margin: 30px 0;
            font-size: 20px;
            color: #2c3e50;
        }

        .status {
            background: #ecf0f1;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: bold;
            margin: 20px 0;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            font-size: 18px;
        }

        .score-item {
            text-align: center;
        }

        .score-number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .controls {
            margin: 30px 0;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .difficulty {
            margin: 20px 0;
        }

        .difficulty label {
            margin: 0 15px;
            font-size: 16px;
        }

        input[type="radio"] {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>❌⭕ 井字棋</h1>
    
    <div class="game-container">
        <div class="status" id="status">你的回合 (X)</div>
        
        <div class="board" id="board">
            <!-- 9个格子将通过JavaScript生成 -->
        </div>
        
        <div class="score">
            <div class="score-item">
                <div>你 (X)</div>
                <div class="score-number" id="playerScore">0</div>
            </div>
            <div class="score-item">
                <div>平局</div>
                <div class="score-number" id="drawScore">0</div>
            </div>
            <div class="score-item">
                <div>电脑 (O)</div>
                <div class="score-number" id="computerScore">0</div>
            </div>
        </div>
        
        <div class="difficulty">
            <label><input type="radio" name="difficulty" value="easy" checked> 简单</label>
            <label><input type="radio" name="difficulty" value="medium"> 中等</label>
            <label><input type="radio" name="difficulty" value="hard"> 困难</label>
        </div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="resetScores()">重置计分</button>
        </div>
    </div>

    <script>
        class TicTacToe {
            constructor() {
                this.board = Array(9).fill('');
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.playerScore = 0;
                this.computerScore = 0;
                this.drawScore = 0;
                this.difficulty = 'easy';
                
                this.loadScores();
                this.initBoard();
                this.updateStatus();
            }

            initBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    cell.onclick = () => this.makeMove(i);
                    
                    if (this.board[i]) {
                        cell.textContent = this.board[i];
                        cell.classList.add(this.board[i].toLowerCase());
                    }
                    
                    boardElement.appendChild(cell);
                }
            }

            makeMove(index) {
                if (this.gameOver || this.board[index] || this.currentPlayer !== 'X') {
                    return;
                }
                
                this.board[index] = 'X';
                this.initBoard();
                
                if (this.checkWin('X')) {
                    this.endGame('player');
                    return;
                }
                
                if (this.isBoardFull()) {
                    this.endGame('draw');
                    return;
                }
                
                this.currentPlayer = 'O';
                this.updateStatus();
                
                // 电脑移动
                setTimeout(() => {
                    this.computerMove();
                }, 500);
            }

            computerMove() {
                if (this.gameOver) return;
                
                const move = this.getBestMove();
                if (move !== -1) {
                    this.board[move] = 'O';
                    this.initBoard();
                    
                    if (this.checkWin('O')) {
                        this.endGame('computer');
                        return;
                    }
                    
                    if (this.isBoardFull()) {
                        this.endGame('draw');
                        return;
                    }
                    
                    this.currentPlayer = 'X';
                    this.updateStatus();
                }
            }

            getBestMove() {
                this.difficulty = document.querySelector('input[name="difficulty"]:checked').value;
                
                switch (this.difficulty) {
                    case 'easy':
                        return this.getRandomMove();
                    case 'medium':
                        return Math.random() < 0.7 ? this.getOptimalMove() : this.getRandomMove();
                    case 'hard':
                        return this.getOptimalMove();
                    default:
                        return this.getRandomMove();
                }
            }

            getRandomMove() {
                const emptyCells = [];
                for (let i = 0; i < 9; i++) {
                    if (!this.board[i]) {
                        emptyCells.push(i);
                    }
                }
                return emptyCells.length > 0 ? emptyCells[Math.floor(Math.random() * emptyCells.length)] : -1;
            }

            getOptimalMove() {
                // 首先检查是否能获胜
                for (let i = 0; i < 9; i++) {
                    if (!this.board[i]) {
                        this.board[i] = 'O';
                        if (this.checkWin('O')) {
                            this.board[i] = '';
                            return i;
                        }
                        this.board[i] = '';
                    }
                }
                
                // 然后检查是否需要阻止玩家获胜
                for (let i = 0; i < 9; i++) {
                    if (!this.board[i]) {
                        this.board[i] = 'X';
                        if (this.checkWin('X')) {
                            this.board[i] = '';
                            return i;
                        }
                        this.board[i] = '';
                    }
                }
                
                // 优先选择中心
                if (!this.board[4]) {
                    return 4;
                }
                
                // 选择角落
                const corners = [0, 2, 6, 8];
                for (let corner of corners) {
                    if (!this.board[corner]) {
                        return corner;
                    }
                }
                
                // 最后选择边
                const edges = [1, 3, 5, 7];
                for (let edge of edges) {
                    if (!this.board[edge]) {
                        return edge;
                    }
                }
                
                return this.getRandomMove();
            }

            checkWin(player) {
                const winPatterns = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
                    [0, 4, 8], [2, 4, 6] // 对角线
                ];
                
                for (let pattern of winPatterns) {
                    if (pattern.every(index => this.board[index] === player)) {
                        this.highlightWinningCells(pattern);
                        return true;
                    }
                }
                
                return false;
            }

            highlightWinningCells(pattern) {
                pattern.forEach(index => {
                    const cell = document.querySelector(`[data-index="${index}"]`);
                    cell.classList.add('winning');
                });
            }

            isBoardFull() {
                return this.board.every(cell => cell !== '');
            }

            endGame(result) {
                this.gameOver = true;
                
                switch (result) {
                    case 'player':
                        this.playerScore++;
                        break;
                    case 'computer':
                        this.computerScore++;
                        break;
                    case 'draw':
                        this.drawScore++;
                        break;
                }
                
                this.updateScores();
                this.saveScores();
                this.updateStatus();
            }

            updateStatus() {
                const status = document.getElementById('status');
                
                if (this.gameOver) {
                    if (this.checkWin('X')) {
                        status.textContent = '🎉 你赢了！';
                        status.style.background = '#d4edda';
                        status.style.color = '#155724';
                    } else if (this.checkWin('O')) {
                        status.textContent = '😔 电脑赢了！';
                        status.style.background = '#f8d7da';
                        status.style.color = '#721c24';
                    } else {
                        status.textContent = '🤝 平局！';
                        status.style.background = '#fff3cd';
                        status.style.color = '#856404';
                    }
                } else {
                    if (this.currentPlayer === 'X') {
                        status.textContent = '你的回合 (X)';
                    } else {
                        status.textContent = '电脑回合 (O)';
                    }
                    status.style.background = '#ecf0f1';
                    status.style.color = '#2c3e50';
                }
            }

            updateScores() {
                document.getElementById('playerScore').textContent = this.playerScore;
                document.getElementById('computerScore').textContent = this.computerScore;
                document.getElementById('drawScore').textContent = this.drawScore;
            }

            saveScores() {
                localStorage.setItem('ticTacToeScores', JSON.stringify({
                    player: this.playerScore,
                    computer: this.computerScore,
                    draw: this.drawScore
                }));
            }

            loadScores() {
                const scores = localStorage.getItem('ticTacToeScores');
                if (scores) {
                    const parsed = JSON.parse(scores);
                    this.playerScore = parsed.player || 0;
                    this.computerScore = parsed.computer || 0;
                    this.drawScore = parsed.draw || 0;
                    this.updateScores();
                }
            }

            reset() {
                this.board = Array(9).fill('');
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.initBoard();
                this.updateStatus();
            }

            resetScores() {
                this.playerScore = 0;
                this.computerScore = 0;
                this.drawScore = 0;
                this.updateScores();
                this.saveScores();
            }
        }

        let game;

        function newGame() {
            game.reset();
        }

        function resetScores() {
            game.resetScores();
        }

        // 初始化游戏
        game = new TicTacToe();
    </script>
</body>
</html>
