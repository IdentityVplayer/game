<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense - 塔防游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border: 3px solid #27ae60;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(39, 174, 96, 0.5);
            background: #34495e;
        }

        canvas {
            background: #2c3e50;
            display: block;
            border-radius: 7px;
        }

        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #ecf0f1;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .tower-shop {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }

        .tower-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #27ae60;
            border-radius: 8px;
            background: rgba(39, 174, 96, 0.2);
            color: #ecf0f1;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .tower-btn:hover {
            background: rgba(39, 174, 96, 0.4);
            transform: scale(1.05);
        }

        .tower-btn.selected {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.3);
        }

        .wave-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 7px;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .game-container {
                width: 95vw;
                height: 70vh;
            }
            
            .ui {
                font-size: 12px;
                padding: 8px;
            }
            
            .tower-btn {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui">
            <div>💰 金币: <span id="money">100</span></div>
            <div>❤️ 生命: <span id="health">20</span></div>
            <div>⭐ 得分: <span id="score">0</span></div>
        </div>
        
        <div class="wave-info">
            <div>第 <span id="waveNum">1</span> 波</div>
            <div>敌人: <span id="enemiesLeft">10</span></div>
            <button id="startWaveBtn" onclick="startWave()">开始波次</button>
        </div>
        
        <div class="tower-shop">
            <div class="tower-btn" data-type="basic" onclick="selectTower('basic')">
                <div>🗼</div>
                <div>$20</div>
            </div>
            <div class="tower-btn" data-type="laser" onclick="selectTower('laser')">
                <div>⚡</div>
                <div>$50</div>
            </div>
            <div class="tower-btn" data-type="missile" onclick="selectTower('missile')">
                <div>🚀</div>
                <div>$80</div>
            </div>
            <div class="tower-btn" data-type="freeze" onclick="selectTower('freeze')">
                <div>❄️</div>
                <div>$60</div>
            </div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <h1 style="font-size: 48px; color: #27ae60; margin-bottom: 20px;">TOWER DEFENSE</h1>
            <p style="font-size: 18px; margin-bottom: 10px;">塔防游戏</p>
            <p style="font-size: 14px; color: #bdc3c7; margin-bottom: 20px;">建造防御塔阻止敌人到达终点！</p>
            <button class="start-btn" onclick="startGame()">开始防御</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameRunning = false;
        let money = 100;
        let health = 20;
        let score = 0;
        let waveNumber = 1;
        let selectedTowerType = 'basic';
        let waveActive = false;

        // 游戏对象数组
        let towers = [];
        let enemies = [];
        let bullets = [];
        let particles = [];

        // 路径点
        const path = [
            { x: 0, y: 300 },
            { x: 200, y: 300 },
            { x: 200, y: 150 },
            { x: 400, y: 150 },
            { x: 400, y: 450 },
            { x: 600, y: 450 },
            { x: 600, y: 100 },
            { x: 800, y: 100 }
        ];

        // 塔类型配置
        const towerTypes = {
            basic: { cost: 20, damage: 15, range: 80, rate: 30, color: '#27ae60' },
            laser: { cost: 50, damage: 25, range: 100, rate: 20, color: '#e74c3c' },
            missile: { cost: 80, damage: 40, range: 120, rate: 60, color: '#f39c12' },
            freeze: { cost: 60, damage: 10, range: 90, rate: 40, color: '#3498db' }
        };

        // 敌人类型配置
        const enemyTypes = [
            { hp: 50, speed: 1, reward: 10, color: '#e67e22' },
            { hp: 80, speed: 0.8, reward: 15, color: '#8e44ad' },
            { hp: 120, speed: 1.2, reward: 20, color: '#c0392b' },
            { hp: 200, speed: 0.6, reward: 30, color: '#2c3e50' }
        ];

        function startGame() {
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';
            
            // 重置游戏状态
            money = 100;
            health = 20;
            score = 0;
            waveNumber = 1;
            waveActive = false;
            
            // 清空数组
            towers = [];
            enemies = [];
            bullets = [];
            particles = [];
            
            updateUI();
            gameLoop();
        }

        function selectTower(type) {
            selectedTowerType = type;
            
            // 更新UI选择状态
            document.querySelectorAll('.tower-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
        }

        function startWave() {
            if (waveActive) return;
            
            waveActive = true;
            const numEnemies = 10 + waveNumber * 2;
            
            // 生成敌人
            for (let i = 0; i < numEnemies; i++) {
                setTimeout(() => {
                    spawnEnemy();
                }, i * 1000);
            }
            
            document.getElementById('startWaveBtn').style.display = 'none';
        }

        function spawnEnemy() {
            const typeIndex = Math.min(Math.floor(waveNumber / 3), enemyTypes.length - 1);
            const type = enemyTypes[typeIndex];
            
            enemies.push({
                x: path[0].x,
                y: path[0].y,
                hp: type.hp + waveNumber * 10,
                maxHp: type.hp + waveNumber * 10,
                speed: type.speed,
                reward: type.reward,
                color: type.color,
                pathIndex: 0,
                freezeTime: 0
            });
        }

        function placeTower(x, y) {
            const towerConfig = towerTypes[selectedTowerType];
            
            if (money >= towerConfig.cost) {
                // 检查是否在路径上
                let onPath = false;
                for (let i = 0; i < path.length - 1; i++) {
                    const p1 = path[i];
                    const p2 = path[i + 1];
                    const dist = distanceToLine(x, y, p1.x, p1.y, p2.x, p2.y);
                    if (dist < 30) {
                        onPath = true;
                        break;
                    }
                }
                
                // 检查是否与其他塔重叠
                let overlap = false;
                for (const tower of towers) {
                    if (Math.hypot(x - tower.x, y - tower.y) < 40) {
                        overlap = true;
                        break;
                    }
                }
                
                if (!onPath && !overlap) {
                    towers.push({
                        x: x,
                        y: y,
                        type: selectedTowerType,
                        damage: towerConfig.damage,
                        range: towerConfig.range,
                        rate: towerConfig.rate,
                        color: towerConfig.color,
                        lastShot: 0,
                        target: null
                    });
                    
                    money -= towerConfig.cost;
                    updateUI();
                }
            }
        }

        function distanceToLine(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            
            if (lenSq !== 0) param = dot / lenSq;
            
            let xx, yy;
            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }
            
            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updateTowers() {
            for (const tower of towers) {
                tower.lastShot++;
                
                // 寻找目标
                tower.target = null;
                let closestDist = tower.range;
                
                for (const enemy of enemies) {
                    const dist = Math.hypot(tower.x - enemy.x, tower.y - enemy.y);
                    if (dist < closestDist) {
                        closestDist = dist;
                        tower.target = enemy;
                    }
                }
                
                // 射击
                if (tower.target && tower.lastShot >= tower.rate) {
                    const angle = Math.atan2(tower.target.y - tower.y, tower.target.x - tower.x);
                    
                    bullets.push({
                        x: tower.x,
                        y: tower.y,
                        velX: Math.cos(angle) * 5,
                        velY: Math.sin(angle) * 5,
                        damage: tower.damage,
                        type: tower.type,
                        target: tower.target
                    });
                    
                    tower.lastShot = 0;
                }
            }
        }

        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                if (enemy.freezeTime > 0) {
                    enemy.freezeTime--;
                    continue;
                }
                
                // 沿路径移动
                if (enemy.pathIndex < path.length - 1) {
                    const target = path[enemy.pathIndex + 1];
                    const dx = target.x - enemy.x;
                    const dy = target.y - enemy.y;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist < 10) {
                        enemy.pathIndex++;
                    } else {
                        enemy.x += (dx / dist) * enemy.speed;
                        enemy.y += (dy / dist) * enemy.speed;
                    }
                } else {
                    // 到达终点
                    health--;
                    enemies.splice(i, 1);
                    if (health <= 0) {
                        endGame();
                        return;
                    }
                }
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                bullet.x += bullet.velX;
                bullet.y += bullet.velY;
                
                // 检查碰撞
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    
                    if (dist < 15) {
                        // 伤害敌人
                        enemy.hp -= bullet.damage;
                        
                        // 特殊效果
                        if (bullet.type === 'freeze') {
                            enemy.freezeTime = 60;
                        } else if (bullet.type === 'missile') {
                            // 爆炸伤害
                            for (const e of enemies) {
                                const explosionDist = Math.hypot(bullet.x - e.x, bullet.y - e.y);
                                if (explosionDist < 50) {
                                    e.hp -= bullet.damage * 0.5;
                                }
                            }
                        }
                        
                        // 爆炸粒子
                        for (let k = 0; k < 5; k++) {
                            particles.push({
                                x: bullet.x,
                                y: bullet.y,
                                velX: (Math.random() - 0.5) * 4,
                                velY: (Math.random() - 0.5) * 4,
                                life: 30,
                                color: bullet.type === 'freeze' ? '#3498db' : '#f39c12'
                            });
                        }
                        
                        // 检查敌人死亡
                        if (enemy.hp <= 0) {
                            money += enemy.reward;
                            score += enemy.reward * 10;
                            enemies.splice(j, 1);
                        }
                        
                        hit = true;
                        break;
                    }
                }
                
                // 移除子弹
                if (hit || bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                particle.x += particle.velX;
                particle.y += particle.velY;
                particle.life--;
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function checkWaveComplete() {
            if (waveActive && enemies.length === 0) {
                waveActive = false;
                waveNumber++;
                money += 50;
                score += 500;
                document.getElementById('startWaveBtn').style.display = 'block';
            }
        }

        function endGame() {
            gameRunning = false;
            const startScreen = document.getElementById('startScreen');
            startScreen.style.display = 'flex';
            startScreen.innerHTML = `
                <h1 style="font-size: 48px; color: #e74c3c; margin-bottom: 20px;">防御失败</h1>
                <p style="font-size: 24px; margin-bottom: 10px;">最终得分: ${score}</p>
                <p style="font-size: 18px; margin-bottom: 20px;">坚持到第 ${waveNumber} 波</p>
                <button class="start-btn" onclick="startGame()">重新开始</button>
            `;
        }

        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('health').textContent = health;
            document.getElementById('score').textContent = score;
            document.getElementById('waveNum').textContent = waveNumber;
            document.getElementById('enemiesLeft').textContent = enemies.length;
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制路径
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 30;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i < path.length; i++) {
                if (i === 0) {
                    ctx.moveTo(path[i].x, path[i].y);
                } else {
                    ctx.lineTo(path[i].x, path[i].y);
                }
            }
            ctx.stroke();
            
            // 绘制塔
            for (const tower of towers) {
                // 射程圈（仅在鼠标悬停时显示）
                if (selectedTowerType === tower.type) {
                    ctx.strokeStyle = tower.color + '40';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // 塔身
                ctx.fillStyle = tower.color;
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // 炮管
                if (tower.target) {
                    const angle = Math.atan2(tower.target.y - tower.y, tower.target.x - tower.x);
                    ctx.strokeStyle = tower.color;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(tower.x, tower.y);
                    ctx.lineTo(tower.x + Math.cos(angle) * 20, tower.y + Math.sin(angle) * 20);
                    ctx.stroke();
                }
            }
            
            // 绘制敌人
            for (const enemy of enemies) {
                // 血条背景
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(enemy.x - 15, enemy.y - 25, 30, 5);
                
                // 血条
                const hpPercent = enemy.hp / enemy.maxHp;
                ctx.fillStyle = hpPercent > 0.5 ? '#27ae60' : hpPercent > 0.2 ? '#f39c12' : '#e74c3c';
                ctx.fillRect(enemy.x - 15, enemy.y - 25, 30 * hpPercent, 5);
                
                // 敌人身体
                ctx.fillStyle = enemy.freezeTime > 0 ? '#3498db' : enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // 冰冻效果
                if (enemy.freezeTime > 0) {
                    ctx.strokeStyle = '#3498db';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, 15, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // 绘制子弹
            for (const bullet of bullets) {
                ctx.fillStyle = bullet.type === 'laser' ? '#e74c3c' : 
                               bullet.type === 'freeze' ? '#3498db' : '#f39c12';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制粒子
            for (const particle of particles) {
                const alpha = particle.life / 30;
                ctx.fillStyle = particle.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            updateTowers();
            updateEnemies();
            updateBullets();
            updateParticles();
            checkWaveComplete();
            
            draw();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }

        // 鼠标事件
        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            placeTower(x, y);
        });

        // 响应式调整
        function resizeCanvas() {
            if (window.innerWidth <= 768) {
                canvas.width = Math.min(600, window.innerWidth - 40);
                canvas.height = Math.min(450, window.innerHeight - 200);
            } else {
                canvas.width = 800;
                canvas.height = 600;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 初始化
        selectTower('basic');
    </script>
</body>
</html>
