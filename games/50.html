<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间防御战 - 塔防射击游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .game-area {
            position: relative;
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #000428, #004e92);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .player {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: #00ff88;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }
        .enemy {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ff4757;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
            animation: moveDown 4s linear;
        }
        @keyframes moveDown {
            from { top: -40px; }
            to { top: 100%; }
        }
        .bullet {
            position: absolute;
            width: 4px;
            height: 15px;
            background: #00ff88;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            animation: moveUp 1s linear;
        }
        @keyframes moveUp {
            from { bottom: 80px; }
            to { bottom: 100%; }
        }
        .explosion {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffff00, #ff6b00, transparent);
            border-radius: 50%;
            animation: explode 0.5s ease-out;
        }
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .stat {
            text-align: center;
            color: #00d4ff;
            font-size: 1.2em;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(45deg, #00d4ff, #0984e3);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }
        .instruction {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .power-bar {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            width: 100%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 空间防御战</h1>
        
        <div class="ui">
            <div class="stat">
                <div>得分</div>
                <div id="score">0</div>
            </div>
            <div class="stat">
                <div>生命</div>
                <div id="health">100</div>
            </div>
            <div class="stat">
                <div>等级</div>
                <div id="level">1</div>
            </div>
            <div class="stat">
                <div>武器能量</div>
                <div class="power-bar">
                    <div class="power-fill" id="powerBar"></div>
                </div>
            </div>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="player" id="player"></div>
        </div>
        
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="pauseGame()">暂停</button>
            <button onclick="resetGame()">重新开始</button>
        </div>
        
        <div class="instruction">
            <h3>🎮 游玩方法：</h3>
            <p><strong>游戏目标：</strong>保卫基地，消灭入侵的敌舰</p>
            <p><strong>操作方式：</strong></p>
            <ul>
                <li>移动鼠标控制飞船左右移动</li>
                <li>点击鼠标或按空格键发射激光</li>
                <li>躲避敌人攻击，保护基地</li>
                <li>消灭敌人获得分数和能量</li>
            </ul>
            <p><strong>游戏机制：</strong></p>
            <ul>
                <li>敌人击中基地会减少生命值</li>
                <li>消灭敌人获得分数</li>
                <li>随着等级提升，敌人会更加强大</li>
                <li>武器能量充满时伤害翻倍</li>
            </ul>
            <p><strong>小贴士：</strong>瞄准准确，节约弹药，保持冷静！</p>
        </div>
    </div>

    <script>
        let gameState = {
            running: false,
            score: 0,
            health: 100,
            level: 1,
            power: 100,
            playerX: 50,
            enemies: [],
            bullets: [],
            lastShot: 0
        };
        
        let gameInterval;
        let enemyInterval;
        
        function startGame() {
            if (gameState.running) return;
            gameState.running = true;
            
            gameInterval = setInterval(updateGame, 50);
            enemyInterval = setInterval(spawnEnemy, 2000 - gameState.level * 100);
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('click', shoot);
            document.addEventListener('keydown', handleKeydown);
        }
        
        function pauseGame() {
            gameState.running = false;
            clearInterval(gameInterval);
            clearInterval(enemyInterval);
        }
        
        function resetGame() {
            pauseGame();
            gameState = {
                running: false,
                score: 0,
                health: 100,
                level: 1,
                power: 100,
                playerX: 50,
                enemies: [],
                bullets: [],
                lastShot: 0
            };
            
            document.getElementById('gameArea').innerHTML = '<div class="player" id="player"></div>';
            updateUI();
        }
        
        function handleMouseMove(event) {
            if (!gameState.running) return;
            
            const gameArea = document.getElementById('gameArea');
            const rect = gameArea.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            
            gameState.playerX = Math.max(5, Math.min(95, x));
            updatePlayerPosition();
        }
        
        function handleKeydown(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                shoot();
            }
        }
        
        function updatePlayerPosition() {
            const player = document.getElementById('player');
            player.style.left = gameState.playerX + '%';
        }
        
        function shoot() {
            if (!gameState.running) return;
            
            const now = Date.now();
            if (now - gameState.lastShot < 200) return;
            
            gameState.lastShot = now;
            gameState.power = Math.max(0, gameState.power - 10);
            
            const bullet = {
                x: gameState.playerX,
                y: 90,
                element: createBulletElement()
            };
            
            gameState.bullets.push(bullet);
        }
        
        function createBulletElement() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = gameState.playerX + '%';
            document.getElementById('gameArea').appendChild(bullet);
            return bullet;
        }
        
        function spawnEnemy() {
            if (!gameState.running) return;
            
            const enemy = {
                x: Math.random() * 90 + 5,
                y: 0,
                element: createEnemyElement()
            };
            
            gameState.enemies.push(enemy);
        }
        
        function createEnemyElement() {
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.left = Math.random() * 90 + 5 + '%';
            document.getElementById('gameArea').appendChild(enemy);
            return enemy;
        }
        
        function updateGame() {
            if (!gameState.running) return;
            
            // 更新子弹
            gameState.bullets = gameState.bullets.filter(bullet => {
                bullet.y -= 5;
                bullet.element.style.bottom = bullet.y + '%';
                
                if (bullet.y > 100) {
                    bullet.element.remove();
                    return false;
                }
                return true;
            });
            
            // 更新敌人
            gameState.enemies = gameState.enemies.filter(enemy => {
                enemy.y += 2 + gameState.level * 0.5;
                enemy.element.style.top = enemy.y + '%';
                
                if (enemy.y > 100) {
                    enemy.element.remove();
                    gameState.health -= 10;
                    if (gameState.health <= 0) {
                        gameOver();
                    }
                    return false;
                }
                return true;
            });
            
            // 检测碰撞
            checkCollisions();
            
            // 恢复能量
            gameState.power = Math.min(100, gameState.power + 0.5);
            
            updateUI();
        }
        
        function checkCollisions() {
            gameState.bullets.forEach((bullet, bulletIndex) => {
                gameState.enemies.forEach((enemy, enemyIndex) => {
                    const dx = Math.abs(bullet.x - enemy.x);
                    const dy = Math.abs((100 - bullet.y) - enemy.y);
                    
                    if (dx < 5 && dy < 8) {
                        // 创建爆炸效果
                        createExplosion(enemy.x, enemy.y);
                        
                        // 移除子弹和敌人
                        bullet.element.remove();
                        enemy.element.remove();
                        gameState.bullets.splice(bulletIndex, 1);
                        gameState.enemies.splice(enemyIndex, 1);
                        
                        // 计分
                        const points = gameState.power > 80 ? 200 : 100;
                        gameState.score += points;
                        
                        // 升级检查
                        if (gameState.score > gameState.level * 1000) {
                            gameState.level++;
                            clearInterval(enemyInterval);
                            enemyInterval = setInterval(spawnEnemy, Math.max(500, 2000 - gameState.level * 100));
                        }
                    }
                });
            });
        }
        
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = x + '%';
            explosion.style.top = y + '%';
            document.getElementById('gameArea').appendChild(explosion);
            
            setTimeout(() => {
                explosion.remove();
            }, 500);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('health').textContent = gameState.health;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('powerBar').style.width = gameState.power + '%';
        }
        
        function gameOver() {
            pauseGame();
            alert(`游戏结束！\n最终得分：${gameState.score}\n到达等级：${gameState.level}`);
        }
        
        // 初始化
        updateUI();
        updatePlayerPosition();
    </script>
</body>
</html>
