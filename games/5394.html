<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霸王反应 5394</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #FFEAA7, #FFEAA7);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #98D8C8, #4ECDC4);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameArea {
            width: 400px;
            height: 400px;
            border: 3px solid #333;
            margin: 20px auto;
            position: relative;
            background: #f0f0f0;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: red;
            position: absolute;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }
        
        #circle.green {
            background: #4caf50;
        }
        
        #instructions {
            font-size: 24px;
            font-weight: bold;
            color: #666;
        }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>霸王反应 5394</h1>
        
        <div id="gameArea">
            <div id="circle"></div>
            <div id="instructions">点击开始</div>
        </div>
        <div class="score">反应时间: <span id="reactionTime">-</span>ms</div>
        <div class="score">最佳时间: <span id="bestTime">-</span>ms</div>
        <button class="btn" onclick="startReactionTest()">开始测试</button>
        
    </div>
    
    <script>
        
        let startTime = 0;
        let endTime = 0;
        let timeout = null;
        let gameActive = false;
        let bestTime = localStorage.getItem('bestReactionTime') || null;
        
        function updateDisplay() {
            if (bestTime) {
                document.getElementById('bestTime').textContent = bestTime;
            }
        }
        
        function startReactionTest() {
            const circle = document.getElementById('circle');
            const instructions = document.getElementById('instructions');
            
            if (gameActive) return;
            
            // Reset
            circle.style.display = 'none';
            circle.classList.remove('green');
            instructions.textContent = '等待绿色圆圈...';
            gameActive = true;
            
            // Random delay between 1-5 seconds
            const delay = Math.random() * 4000 + 1000;
            
            timeout = setTimeout(() => {
                showGreenCircle();
            }, delay);
        }
        
        function showGreenCircle() {
            const circle = document.getElementById('circle');
            const instructions = document.getElementById('instructions');
            
            // Random position
            const gameArea = document.getElementById('gameArea');
            const areaRect = gameArea.getBoundingClientRect();
            const maxX = 300; // 400 - 100 (circle width)
            const maxY = 300; // 400 - 100 (circle height)
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            circle.style.left = x + 'px';
            circle.style.top = y + 'px';
            circle.style.display = 'block';
            circle.classList.add('green');
            
            instructions.textContent = '点击绿色圆圈！';
            startTime = Date.now();
            
            circle.onclick = () => {
                if (gameActive) {
                    endTime = Date.now();
                    const reactionTime = endTime - startTime;
                    
                    document.getElementById('reactionTime').textContent = reactionTime;
                    
                    if (!bestTime || reactionTime < parseInt(bestTime)) {
                        bestTime = reactionTime;
                        localStorage.setItem('bestReactionTime', bestTime);
                        instructions.textContent = '新纪录！反应时间: ' + reactionTime + 'ms';
                    } else {
                        instructions.textContent = '反应时间: ' + reactionTime + 'ms';
                    }
                    
                    updateDisplay();
                    endGame();
                }
            };
            
            // Auto end after 3 seconds
            setTimeout(() => {
                if (gameActive) {
                    instructions.textContent = '太慢了！';
                    endGame();
                }
            }, 3000);
        }
        
        function endGame() {
            gameActive = false;
            const circle = document.getElementById('circle');
            circle.style.display = 'none';
            circle.onclick = null;
            
            if (timeout) {
                clearTimeout(timeout);
                timeout = null;
            }
        }
        
        // Prevent early clicks
        document.getElementById('gameArea').addEventListener('click', function(e) {
            if (gameActive && !e.target.id === 'circle') {
                const instructions = document.getElementById('instructions');
                instructions.textContent = '太早了！重新开始';
                endGame();
            }
        });
        
        updateDisplay();
        
    </script>
</body>
</html>
