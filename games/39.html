<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - Gomoku</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8B4513, #CD853F, #DEB887);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .game-area {
            background: rgba(139, 69, 19, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #gameBoard {
            background: #F4A460;
            border: 3px solid #8B4513;
            border-radius: 10px;
            margin: 0 auto;
            cursor: crosshair;
        }
        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
        }
        .info-item {
            text-align: center;
        }
        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
        }
        .current-player {
            font-size: 20px;
            margin: 15px 0;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        .player-black {
            color: #333;
            background: rgba(255,255,255,0.9);
        }
        .player-white {
            color: white;
            background: rgba(0,0,0,0.7);
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #8B4513, #CD853F);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .game-mode {
            margin: 20px 0;
        }
        .game-mode button {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
        }
        .game-mode button.active {
            border-color: #FFD700;
            background: rgba(255,215,0,0.3);
        }
        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚫ 五子棋 Gomoku</h1>
        
        <div class="game-info">
            <div class="info-item">
                <div>黑子胜利</div>
                <div class="info-value" id="blackWins">0</div>
            </div>
            <div class="info-item">
                <div>白子胜利</div>
                <div class="info-value" id="whiteWins">0</div>
            </div>
            <div class="info-item">
                <div>平局</div>
                <div class="info-value" id="draws">0</div>
            </div>
        </div>
        
        <div id="currentPlayer" class="current-player player-black">
            当前玩家: ⚫ 黑子
        </div>
        
        <div class="game-mode">
            <button class="btn active" onclick="setGameMode('pvp')">双人对战</button>
            <button class="btn" onclick="setGameMode('ai')">人机对战</button>
        </div>
        
        <div class="game-area">
            <canvas id="gameBoard" width="450" height="450"></canvas>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="startNewGame()">新游戏</button>
            <button class="btn" onclick="undoMove()">撤销</button>
            <button class="btn" onclick="resetStats()">重置统计</button>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-top: 20px;">
            <h3>🎮 游玩方法:</h3>
            <p>• 黑子先手，轮流下子</p>
            <p>• 在棋盘交叉点上点击下子</p>
            <p>• 率先连成五子一线者获胜</p>
            <p>• 可选择双人对战或人机对战模式</p>
            <p>• 支持撤销功能，但仅限上一步</p>
        </div>
        
        <a href="../index.html" style="color: #FFD700; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>
    
    <div id="winMessage" class="win-message">
        <h2 id="winTitle">🎉 游戏结束！</h2>
        <p id="winText"></p>
        <button class="btn" onclick="hideWinMessage()">继续游戏</button>
    </div>

    <script>
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        
        let game = {
            board: [],
            currentPlayer: 1, // 1: 黑子, 2: 白子
            gameActive: true,
            gameMode: 'pvp', // 'pvp' 或 'ai'
            moveHistory: [],
            boardSize: 15,
            cellSize: 30,
            stats: {
                blackWins: 0,
                whiteWins: 0,
                draws: 0
            }
        };
        
        function initializeBoard() {
            game.board = [];
            for (let i = 0; i < game.boardSize; i++) {
                game.board[i] = [];
                for (let j = 0; j < game.boardSize; j++) {
                    game.board[i][j] = 0;
                }
            }
            game.currentPlayer = 1;
            game.gameActive = true;
            game.moveHistory = [];
            drawBoard();
            updateCurrentPlayer();
        }
        
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            ctx.fillStyle = '#F4A460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < game.boardSize; i++) {
                // 竖线
                ctx.beginPath();
                ctx.moveTo(game.cellSize + i * game.cellSize, game.cellSize);
                ctx.lineTo(game.cellSize + i * game.cellSize, canvas.height - game.cellSize);
                ctx.stroke();
                
                // 横线
                ctx.beginPath();
                ctx.moveTo(game.cellSize, game.cellSize + i * game.cellSize);
                ctx.lineTo(canvas.width - game.cellSize, game.cellSize + i * game.cellSize);
                ctx.stroke();
            }
            
            // 绘制星位
            const starPoints = [
                [3, 3], [7, 7], [11, 11], [3, 11], [11, 3],
                [7, 3], [7, 11], [3, 7], [11, 7]
            ];
            
            ctx.fillStyle = '#8B4513';
            starPoints.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(game.cellSize + x * game.cellSize, 
                       game.cellSize + y * game.cellSize, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 绘制棋子
            for (let i = 0; i < game.boardSize; i++) {
                for (let j = 0; j < game.boardSize; j++) {
                    if (game.board[i][j] !== 0) {
                        drawPiece(i, j, game.board[i][j]);
                    }
                }
            }
        }
        
        function drawPiece(row, col, player) {
            const x = game.cellSize + col * game.cellSize;
            const y = game.cellSize + row * game.cellSize;
            
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            
            if (player === 1) {
                // 黑子
                const gradient = ctx.createRadialGradient(x-3, y-3, 0, x, y, 12);
                gradient.addColorStop(0, '#666');
                gradient.addColorStop(1, '#000');
                ctx.fillStyle = gradient;
            } else {
                // 白子
                const gradient = ctx.createRadialGradient(x-3, y-3, 0, x, y, 12);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(1, '#ddd');
                ctx.fillStyle = gradient;
            }
            
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        function getBoardPosition(event) {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const col = Math.round((x - game.cellSize) / game.cellSize);
            const row = Math.round((y - game.cellSize) / game.cellSize);
            
            if (row >= 0 && row < game.boardSize && col >= 0 && col < game.boardSize) {
                return { row, col };
            }
            return null;
        }
        
        function makeMove(row, col) {
            if (!game.gameActive || game.board[row][col] !== 0) {
                return false;
            }
            
            game.board[row][col] = game.currentPlayer;
            game.moveHistory.push({ row, col, player: game.currentPlayer });
            
            drawBoard();
            
            if (checkWin(row, col)) {
                gameWin(game.currentPlayer);
                return true;
            }
            
            if (checkDraw()) {
                gameDraw();
                return true;
            }
            
            game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
            updateCurrentPlayer();
            
            // AI 回合
            if (game.gameMode === 'ai' && game.currentPlayer === 2 && game.gameActive) {
                setTimeout(() => {
                    makeAIMove();
                }, 500);
            }
            
            return true;
        }
        
        function makeAIMove() {
            const move = getAIMove();
            if (move) {
                makeMove(move.row, move.col);
            }
        }
        
        function getAIMove() {
            // 简单AI算法：先尝试胜利，再阻止对手，最后随机
            
            // 1. 检查是否可以获胜
            for (let i = 0; i < game.boardSize; i++) {
                for (let j = 0; j < game.boardSize; j++) {
                    if (game.board[i][j] === 0) {
                        game.board[i][j] = 2;
                        if (checkWin(i, j)) {
                            game.board[i][j] = 0;
                            return { row: i, col: j };
                        }
                        game.board[i][j] = 0;
                    }
                }
            }
            
            // 2. 检查是否需要阻止对手获胜
            for (let i = 0; i < game.boardSize; i++) {
                for (let j = 0; j < game.boardSize; j++) {
                    if (game.board[i][j] === 0) {
                        game.board[i][j] = 1;
                        if (checkWin(i, j)) {
                            game.board[i][j] = 0;
                            return { row: i, col: j };
                        }
                        game.board[i][j] = 0;
                    }
                }
            }
            
            // 3. 随机选择
            const emptyCells = [];
            for (let i = 0; i < game.boardSize; i++) {
                for (let j = 0; j < game.boardSize; j++) {
                    if (game.board[i][j] === 0) {
                        emptyCells.push({ row: i, col: j });
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            return null;
        }
        
        function checkWin(row, col) {
            const player = game.board[row][col];
            const directions = [
                [0, 1],   // 水平
                [1, 0],   // 垂直
                [1, 1],   // 对角线1
                [1, -1]   // 对角线2
            ];
            
            for (let [dx, dy] of directions) {
                let count = 1;
                
                // 正方向计数
                let r = row + dx, c = col + dy;
                while (r >= 0 && r < game.boardSize && c >= 0 && c < game.boardSize && 
                       game.board[r][c] === player) {
                    count++;
                    r += dx;
                    c += dy;
                }
                
                // 反方向计数
                r = row - dx;
                c = col - dy;
                while (r >= 0 && r < game.boardSize && c >= 0 && c < game.boardSize && 
                       game.board[r][c] === player) {
                    count++;
                    r -= dx;
                    c -= dy;
                }
                
                if (count >= 5) {
                    return true;
                }
            }
            
            return false;
        }
        
        function checkDraw() {
            for (let i = 0; i < game.boardSize; i++) {
                for (let j = 0; j < game.boardSize; j++) {
                    if (game.board[i][j] === 0) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        function gameWin(player) {
            game.gameActive = false;
            
            if (player === 1) {
                game.stats.blackWins++;
                document.getElementById('winTitle').textContent = '🎉 黑子获胜！';
                document.getElementById('winText').textContent = '黑子连成五子，恭喜获胜！';
            } else {
                game.stats.whiteWins++;
                document.getElementById('winTitle').textContent = '🎉 白子获胜！';
                document.getElementById('winText').textContent = '白子连成五子，恭喜获胜！';
            }
            
            updateStats();
            document.getElementById('winMessage').style.display = 'block';
        }
        
        function gameDraw() {
            game.gameActive = false;
            game.stats.draws++;
            
            document.getElementById('winTitle').textContent = '🤝 平局！';
            document.getElementById('winText').textContent = '棋盘已满，游戏平局！';
            
            updateStats();
            document.getElementById('winMessage').style.display = 'block';
        }
        
        function updateCurrentPlayer() {
            const playerDisplay = document.getElementById('currentPlayer');
            if (game.currentPlayer === 1) {
                playerDisplay.textContent = '当前玩家: ⚫ 黑子';
                playerDisplay.className = 'current-player player-black';
            } else {
                playerDisplay.textContent = '当前玩家: ⚪ 白子';
                playerDisplay.className = 'current-player player-white';
            }
        }
        
        function updateStats() {
            document.getElementById('blackWins').textContent = game.stats.blackWins;
            document.getElementById('whiteWins').textContent = game.stats.whiteWins;
            document.getElementById('draws').textContent = game.stats.draws;
        }
        
        function setGameMode(mode) {
            game.gameMode = mode;
            
            document.querySelectorAll('.game-mode .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            startNewGame();
        }
        
        function startNewGame() {
            initializeBoard();
        }
        
        function undoMove() {
            if (game.moveHistory.length === 0) return;
            
            const lastMove = game.moveHistory.pop();
            game.board[lastMove.row][lastMove.col] = 0;
            
            // 如果是AI模式，需要撤销两步
            if (game.gameMode === 'ai' && game.moveHistory.length > 0) {
                const prevMove = game.moveHistory.pop();
                game.board[prevMove.row][prevMove.col] = 0;
            }
            
            game.currentPlayer = 1; // 始终让黑子先手
            game.gameActive = true;
            
            drawBoard();
            updateCurrentPlayer();
        }
        
        function resetStats() {
            game.stats.blackWins = 0;
            game.stats.whiteWins = 0;
            game.stats.draws = 0;
            updateStats();
        }
        
        function hideWinMessage() {
            document.getElementById('winMessage').style.display = 'none';
        }
        
        // 事件监听
        canvas.addEventListener('click', (event) => {
            if (!game.gameActive) return;
            if (game.gameMode === 'ai' && game.currentPlayer === 2) return;
            
            const pos = getBoardPosition(event);
            if (pos) {
                makeMove(pos.row, pos.col);
            }
        });
        
        // 初始化
        initializeBoard();
        updateStats();
    </script>
</body>
</html>
