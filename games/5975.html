<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速记忆 5975</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #98D8C8, #4ECDC4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #4ECDC4, #DDA0DD);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            margin: 20px auto;
            width: fit-content;
        }
        
        .memory-card {
            width: 80px;
            height: 80px;
            border: 3px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            background: #ddd;
            transition: all 0.6s;
            transform-style: preserve-3d;
        }
        
        .memory-card.flipped {
            transform: rotateY(180deg);
        }
        
        .memory-card.matched {
            background: #4caf50;
            color: white;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
        }
        
        .card-front {
            background: #666;
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-back {
            background: #ddd;
        }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>极速记忆 5975</h1>
        
        <div id="gameBoard"></div>
        <div class="score">配对: <span id="pairs">0</span>/8</div>
        <div class="score">翻牌: <span id="flips">0</span></div>
        <button class="btn" onclick="newGame()">新游戏</button>
        
    </div>
    
    <script>
        
        const symbols = ['🌟', '🎈', '🎯', '🎨', '🎵', '🎲', '🎪', '🎭'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let flipCount = 0;
        let gameActive = true;
        
        function createCards() {
            const gameCards = [...symbols, ...symbols]; // 创建成对的符号
            
            // 随机排列
            for (let i = gameCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gameCards[i], gameCards[j]] = [gameCards[j], gameCards[i]];
            }
            
            return gameCards.map((symbol, index) => ({
                id: index,
                symbol: symbol,
                flipped: false,
                matched: false
            }));
        }
        
        function newGame() {
            cards = createCards();
            flippedCards = [];
            matchedPairs = 0;
            flipCount = 0;
            gameActive = true;
            updateDisplay();
        }
        
        function updateDisplay() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'memory-card';
                
                if (card.flipped || card.matched) {
                    cardElement.classList.add('flipped');
                }
                
                if (card.matched) {
                    cardElement.classList.add('matched');
                }
                
                cardElement.innerHTML = `
                    <div class="card-back">?</div>
                    <div class="card-front">${card.symbol}</div>
                `;
                
                cardElement.onclick = () => flipCard(card.id);
                gameBoard.appendChild(cardElement);
            });
            
            document.getElementById('pairs').textContent = matchedPairs;
            document.getElementById('flips').textContent = flipCount;
        }
        
        function flipCard(cardId) {
            if (!gameActive) return;
            
            const card = cards[cardId];
            
            // 不能翻已经翻开或匹配的卡
            if (card.flipped || card.matched) return;
            
            // 不能翻超过2张卡
            if (flippedCards.length >= 2) return;
            
            card.flipped = true;
            flippedCards.push(card);
            flipCount++;
            
            updateDisplay();
            
            if (flippedCards.length === 2) {
                gameActive = false;
                setTimeout(checkMatch, 1000);
            }
        }
        
        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.symbol === card2.symbol) {
                // 匹配成功
                card1.matched = true;
                card2.matched = true;
                matchedPairs++;
                
                if (matchedPairs === symbols.length) {
                    setTimeout(() => {
                        alert(`恭喜完成！总共翻牌 ${flipCount} 次`);
                    }, 500);
                }
            } else {
                // 匹配失败，翻回去
                card1.flipped = false;
                card2.flipped = false;
            }
            
            flippedCards = [];
            gameActive = true;
            updateDisplay();
        }
        
        newGame();
        
    </script>
</body>
</html>
