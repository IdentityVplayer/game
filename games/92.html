<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相似大作战</title>
    <style>
        body { background: linear-gradient(135deg, #ff9a9e, #fecfef); font-family: 'Arial', sans-serif; margin: 0; color: #333; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); color: #e91e63; }
        .game-category { color: #9c27b0; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(255,255,255,0.9); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .battle-field { width: 100%; height: 500px; background: linear-gradient(135deg, #ffecd2, #fcb69f); border-radius: 10px; position: relative; display: flex; justify-content: space-between; align-items: center; padding: 50px; box-sizing: border-box; }
        .player-side { display: flex; flex-direction: column; align-items: center; }
        .ai-side { display: flex; flex-direction: column; align-items: center; }
        .character { width: 150px; height: 200px; background: linear-gradient(45deg, #ff6b6b, #ff8e8e); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 20px; position: relative; }
        .ai-character { background: linear-gradient(45deg, #74b9ff, #81ecec); }
        .health-bar { width: 150px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ff8e8e); transition: width 0.5s ease; }
        .ai-health-fill { background: linear-gradient(90deg, #74b9ff, #81ecec); }
        .move-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .move-btn { background: #e91e63; color: white; border: none; padding: 15px 20px; font-size: 1em; border-radius: 10px; cursor: pointer; min-width: 100px; }
        .move-btn:hover { background: #c2185b; }
        .move-btn:disabled { background: #ccc; cursor: not-allowed; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #9c27b0; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #7b1fa2; }
        .battle-log { height: 150px; background: #f5f5f5; border-radius: 10px; padding: 15px; margin-top: 20px; overflow-y: auto; text-align: left; font-size: 14px; }
        .damage-effect { position: absolute; color: #ff0000; font-size: 24px; font-weight: bold; pointer-events: none; animation: damageFloat 1s ease-out; }
        .heal-effect { color: #00ff00; }
        @keyframes damageFloat { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
        .character.attacking { animation: attack 0.5s ease-in-out; }
        @keyframes attack { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateX(10px); } }
        .how-to-play { background: rgba(0,0,0,0.1); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">相似大作战</h1>
        <div class="game-category">#策略游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>胜利: <span id="wins">0</span></div>
                <div>失败: <span id="losses">0</span></div>
                <div>回合: <span id="round">1</span></div>
            </div>
            
            <div class="battle-field" id="battleField">
                <div class="player-side">
                    <div class="health-bar">
                        <div class="health-fill" id="playerHealth"></div>
                    </div>
                    <div class="character" id="playerCharacter">🤖</div>
                    <div style="font-weight: bold;">玩家</div>
                </div>
                
                <div class="ai-side">
                    <div class="health-bar">
                        <div class="health-fill ai-health-fill" id="aiHealth"></div>
                    </div>
                    <div class="character ai-character" id="aiCharacter">🤖</div>
                    <div style="font-weight: bold;">AI</div>
                </div>
            </div>
            
            <div class="move-buttons" id="moveButtons">
                <button class="move-btn" onclick="playerMove('attack')">攻击</button>
                <button class="move-btn" onclick="playerMove('defend')">防御</button>
                <button class="move-btn" onclick="playerMove('heal')">治疗</button>
                <button class="move-btn" onclick="playerMove('special')">特殊攻击</button>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始对战</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
            
            <div class="battle-log" id="battleLog">
                <div><strong>对战日志:</strong></div>
                <div>游戏尚未开始...</div>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 选择你的行动：攻击、防御、治疗或特殊攻击</p>
            <p>• 攻击：对敌人造成 15-25 点伤害</p>
            <p>• 防御：减少下次受到的伤害 50%</p>
            <p>• 治疗：恢复 20-30 点生命值</p>
            <p>• 特殊攻击：造成 25-35 点伤害，但有冷却时间</p>
            <p>• 策略性地选择行动，击败AI获得胜利</p>
            <p>• 生命值归零的一方败北！</p>
        </div>
    </div>
    
    <script>
        let playerHealth = 100;
        let aiHealth = 100;
        let wins = 0;
        let losses = 0;
        let round = 1;
        let gameRunning = false;
        let playerDefending = false;
        let aiDefending = false;
        let specialCooldown = 0;
        let aiSpecialCooldown = 0;
        
        const moves = {
            attack: { damage: [15, 25], name: '攻击' },
            defend: { name: '防御' },
            heal: { heal: [20, 30], name: '治疗' },
            special: { damage: [25, 35], name: '特殊攻击', cooldown: 3 }
        };
        
        function startGame() {
            gameRunning = true;
            playerHealth = 100;
            aiHealth = 100;
            round = 1;
            specialCooldown = 0;
            aiSpecialCooldown = 0;
            playerDefending = false;
            aiDefending = false;
            
            updateDisplay();
            enableMoveButtons(true);
            addBattleLog('对战开始！选择你的行动。');
        }
        
        function resetGame() {
            gameRunning = false;
            playerHealth = 100;
            aiHealth = 100;
            wins = 0;
            losses = 0;
            round = 1;
            specialCooldown = 0;
            aiSpecialCooldown = 0;
            playerDefending = false;
            aiDefending = false;
            
            updateDisplay();
            enableMoveButtons(false);
            clearBattleLog();
            addBattleLog('游戏已重置。点击“开始对战”开始游戏。');
        }
        
        function playerMove(moveType) {
            if (!gameRunning) return;
            
            // Check special attack cooldown
            if (moveType === 'special' && specialCooldown > 0) {
                addBattleLog('特殊攻击在冷却中，还需 ' + specialCooldown + ' 回合。');
                return;
            }
            
            enableMoveButtons(false);
            
            // Player action
            const playerResult = executeMove(moveType, 'player');
            
            // AI action
            setTimeout(() => {
                const aiMove = chooseAIMove();
                const aiResult = executeMove(aiMove, 'ai');
                
                // Process turn results
                setTimeout(() => {
                    processTurnResults(playerResult, aiResult);
                }, 1000);
            }, 1000);
        }
        
        function executeMove(moveType, actor) {
            const move = moves[moveType];
            let result = { type: moveType, actor: actor };
            
            if (moveType === 'attack' || moveType === 'special') {
                const damage = Math.floor(Math.random() * (move.damage[1] - move.damage[0] + 1)) + move.damage[0];
                result.damage = damage;
                
                if (actor === 'player') {
                    addBattleLog(`玩家使用${move.name}，造成 ${damage} 点伤害！`);
                    animateAttack('playerCharacter');
                } else {
                    addBattleLog(`AI使用${move.name}，造成 ${damage} 点伤害！`);
                    animateAttack('aiCharacter');
                }
                
                if (moveType === 'special') {
                    if (actor === 'player') {
                        specialCooldown = move.cooldown;
                    } else {
                        aiSpecialCooldown = move.cooldown;
                    }
                }
                
            } else if (moveType === 'defend') {
                result.defending = true;
                
                if (actor === 'player') {
                    playerDefending = true;
                    addBattleLog('玩家采取防御姿态，下次受到的伤害减少 50%！');
                } else {
                    aiDefending = true;
                    addBattleLog('AI采取防御姿态，下次受到的伤害减少 50%！');
                }
                
            } else if (moveType === 'heal') {
                const healAmount = Math.floor(Math.random() * (move.heal[1] - move.heal[0] + 1)) + move.heal[0];
                result.heal = healAmount;
                
                if (actor === 'player') {
                    playerHealth = Math.min(100, playerHealth + healAmount);
                    addBattleLog(`玩家使用治疗，恢复 ${healAmount} 点生命值！`);
                    showDamageEffect('playerCharacter', '+' + healAmount, '#00ff00');
                } else {
                    aiHealth = Math.min(100, aiHealth + healAmount);
                    addBattleLog(`AI使用治疗，恢复 ${healAmount} 点生命值！`);
                    showDamageEffect('aiCharacter', '+' + healAmount, '#00ff00');
                }
            }
            
            return result;
        }
        
        function processTurnResults(playerResult, aiResult) {
            // Apply damage
            if (playerResult.damage) {
                let damage = playerResult.damage;
                if (aiDefending) {
                    damage = Math.floor(damage * 0.5);
                    addBattleLog('AI的防御减少了伤害！');
                }
                aiHealth = Math.max(0, aiHealth - damage);
                showDamageEffect('aiCharacter', '-' + damage);
            }
            
            if (aiResult.damage) {
                let damage = aiResult.damage;
                if (playerDefending) {
                    damage = Math.floor(damage * 0.5);
                    addBattleLog('玩家的防御减少了伤害！');
                }
                playerHealth = Math.max(0, playerHealth - damage);
                showDamageEffect('playerCharacter', '-' + damage);
            }
            
            // Reset defense states
            playerDefending = false;
            aiDefending = false;
            
            // Update cooldowns
            if (specialCooldown > 0) specialCooldown--;
            if (aiSpecialCooldown > 0) aiSpecialCooldown--;
            
            round++;
            
            updateDisplay();
            
            // Check win conditions
            setTimeout(() => {
                if (playerHealth <= 0) {
                    losses++;
                    addBattleLog('玩家败北！AI获得胜利！');
                    endBattle();
                } else if (aiHealth <= 0) {
                    wins++;
                    addBattleLog('玩家获得胜利！AI败北！');
                    endBattle();
                } else {
                    enableMoveButtons(true);
                    addBattleLog('--- 第 ' + round + ' 回合 ---');
                }
            }, 1000);
        }
        
        function chooseAIMove() {
            // Simple AI strategy
            if (aiHealth < 30 && Math.random() < 0.6) {
                return 'heal';
            } else if (aiSpecialCooldown === 0 && Math.random() < 0.3) {
                return 'special';
            } else if (playerHealth > 70 && Math.random() < 0.3) {
                return 'defend';
            } else {
                return 'attack';
            }
        }
        
        function animateAttack(characterId) {
            const character = document.getElementById(characterId);
            character.classList.add('attacking');
            setTimeout(() => {
                character.classList.remove('attacking');
            }, 500);
        }
        
        function showDamageEffect(characterId, text, color = '#ff0000') {
            const character = document.getElementById(characterId);
            const effect = document.createElement('div');
            effect.className = 'damage-effect';
            effect.textContent = text;
            effect.style.color = color;
            effect.style.left = '50%';
            effect.style.top = '20px';
            
            character.style.position = 'relative';
            character.appendChild(effect);
            
            setTimeout(() => effect.remove(), 1000);
        }
        
        function endBattle() {
            gameRunning = false;
            enableMoveButtons(false);
            updateDisplay();
            
            setTimeout(() => {
                const playAgain = confirm('游戏结束！\n玩家胜利: ' + wins + ' 次\nAI胜利: ' + losses + ' 次\n\n是否开始新的对战？');
                if (playAgain) {
                    startGame();
                }
            }, 1000);
        }
        
        function enableMoveButtons(enabled) {
            const buttons = document.querySelectorAll('.move-btn');
            buttons.forEach(button => {
                button.disabled = !enabled;
            });
            
            // Special attack button
            if (enabled && specialCooldown > 0) {
                buttons[3].disabled = true;
                buttons[3].textContent = `特殊攻击 (${specialCooldown})`;
            } else if (enabled) {
                buttons[3].textContent = '特殊攻击';
            }
        }
        
        function updateDisplay() {
            document.getElementById('wins').textContent = wins;
            document.getElementById('losses').textContent = losses;
            document.getElementById('round').textContent = round;
            
            document.getElementById('playerHealth').style.width = playerHealth + '%';
            document.getElementById('aiHealth').style.width = aiHealth + '%';
        }
        
        function addBattleLog(message) {
            const log = document.getElementById('battleLog');
            const entry = document.createElement('div');
            entry.textContent = message;
            entry.style.marginBottom = '5px';
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        function clearBattleLog() {
            const log = document.getElementById('battleLog');
            log.innerHTML = '<div><strong>对战日志:</strong></div>';
        }
        
        // Initialize
        updateDisplay();
        enableMoveButtons(false);
    </script>
</body>
</html>
