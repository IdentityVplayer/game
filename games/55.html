<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周期元素大冒险 - 化学学习游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .stat {
            text-align: center;
            color: #ffd93d;
            font-size: 1.2em;
        }
        .element-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px;
            color: #333;
        }
        .element-symbol {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
        }
        .element-name {
            font-size: 2em;
            margin: 10px 0;
        }
        .element-details {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .option {
            padding: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .option:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .option.correct {
            background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%);
            animation: correctPulse 0.6s ease;
        }
        .option.wrong {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: wrongShake 0.6s ease;
        }
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #56CCF2, #2F80ED);
            transition: width 0.5s ease;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 5px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .game-mode {
            text-align: center;
            margin: 20px 0;
        }
        .game-mode label {
            margin: 0 15px;
            cursor: pointer;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .game-mode input[type="radio"] {
            margin-right: 8px;
        }
        .game-mode label:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .instruction {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .periodic-table-mini {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .mini-element {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mini-element:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .mini-element.current {
            background: #ffd93d;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ 周期元素大冒险</h1>
        
        <div class="game-info">
            <div class="stat">
                <div>得分</div>
                <div id="score">0</div>
            </div>
            <div class="stat">
                <div>连续正确</div>
                <div id="streak">0</div>
            </div>
            <div class="stat">
                <div>题目进度</div>
                <div id="questionProgress">1/20</div>
            </div>
            <div class="stat">
                <div>等级</div>
                <div id="level">1</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 5%;"></div>
        </div>
        
        <div class="game-mode">
            <label><input type="radio" name="mode" value="symbol" checked> 符号识别</label>
            <label><input type="radio" name="mode" value="name"> 名称匹配</label>
            <label><input type="radio" name="mode" value="properties"> 属性知识</label>
        </div>
        
        <div class="element-display" id="elementDisplay">
            <div class="element-symbol" id="elementSymbol">H</div>
            <div class="element-name" id="elementName">氢</div>
            <div class="element-details" id="elementDetails">原子序数: 1 | 原子量: 1.008</div>
        </div>
        
        <div class="options-grid" id="optionsGrid">
            <!-- 选项将由JavaScript生成 -->
        </div>
        
        <div class="periodic-table-mini" id="miniTable">
            <!-- 迷你元素周期表 -->
        </div>
        
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="nextQuestion()" id="nextBtn" style="display: none;">下一题</button>
            <button onclick="resetGame()">重新开始</button>
            <button onclick="showHint()">提示</button>
        </div>
        
        <div class="instruction">
            <h3>🎮 游玩方法：</h3>
            <p><strong>游戏目标：</strong>学习化学元素知识，提高化学水平</p>
            <p><strong>游戏模式：</strong></p>
            <ul>
                <li>🔬 符号识别：根据元素信息选择正确符号</li>
                <li>📝 名称匹配：根据符号选择正确元素名称</li>
                <li>⚖️ 属性知识：回答元素的化学属性问题</li>
            </ul>
            <p><strong>评分规则：</strong></p>
            <ul>
                <li>正确回答：+10分</li>
                <li>连续正确：额外奖励分</li>
                <li>错误回答：连续次数清零</li>
                <li>等级提升：更难的元素和问题</li>
            </ul>
            <p><strong>小贴士：</strong>多观察元素周期表，熟悉元素的位置和规律！</p>
        </div>
    </div>

    <script>
        let gameState = {
            running: false,
            score: 0,
            streak: 0,
            questionCount: 0,
            totalQuestions: 20,
            level: 1,
            currentElement: null,
            gameMode: 'symbol',
            answered: false
        };
        
        const elements = [
            { symbol: 'H', name: '氢', number: 1, mass: 1.008, category: '非金属' },
            { symbol: 'He', name: '氦', number: 2, mass: 4.003, category: '稀有气体' },
            { symbol: 'Li', name: '锂', number: 3, mass: 6.941, category: '碱金属' },
            { symbol: 'Be', name: '铍', number: 4, mass: 9.012, category: '碱土金属' },
            { symbol: 'B', name: '硅', number: 5, mass: 10.811, category: '类金属' },
            { symbol: 'C', name: '碳', number: 6, mass: 12.011, category: '非金属' },
            { symbol: 'N', name: '氮', number: 7, mass: 14.007, category: '非金属' },
            { symbol: 'O', name: '氧', number: 8, mass: 15.999, category: '非金属' },
            { symbol: 'F', name: '氟', number: 9, mass: 18.998, category: '卒素' },
            { symbol: 'Ne', name: '氖', number: 10, mass: 20.180, category: '稀有气体' },
            { symbol: 'Na', name: '钠', number: 11, mass: 22.990, category: '碱金属' },
            { symbol: 'Mg', name: '镁', number: 12, mass: 24.305, category: '碱土金属' },
            { symbol: 'Al', name: '铝', number: 13, mass: 26.982, category: '金属' },
            { symbol: 'Si', name: '硅', number: 14, mass: 28.086, category: '类金属' },
            { symbol: 'P', name: '磷', number: 15, mass: 30.974, category: '非金属' },
            { symbol: 'S', name: '硫', number: 16, mass: 32.065, category: '非金属' },
            { symbol: 'Cl', name: '氯', number: 17, mass: 35.453, category: '卒素' },
            { symbol: 'Ar', name: '氩', number: 18, mass: 39.948, category: '稀有气体' },
            { symbol: 'K', name: '钾', number: 19, mass: 39.098, category: '碱金属' },
            { symbol: 'Ca', name: '钙', number: 20, mass: 40.078, category: '碱土金属' },
            { symbol: 'Fe', name: '铁', number: 26, mass: 55.845, category: '过渡金属' },
            { symbol: 'Cu', name: '铜', number: 29, mass: 63.546, category: '过渡金属' },
            { symbol: 'Zn', name: '锌', number: 30, mass: 65.38, category: '过渡金属' },
            { symbol: 'Ag', name: '银', number: 47, mass: 107.868, category: '过渡金属' },
            { symbol: 'Au', name: '金', number: 79, mass: 196.967, category: '过渡金属' }
        ];
        
        function getGameMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }
        
        function startGame() {
            gameState.running = true;
            gameState.score = 0;
            gameState.streak = 0;
            gameState.questionCount = 0;
            gameState.level = 1;
            gameState.gameMode = getGameMode();
            
            createMiniTable();
            nextQuestion();
            updateUI();
        }
        
        function createMiniTable() {
            const miniTable = document.getElementById('miniTable');
            miniTable.innerHTML = '';
            
            // 显示前24个元素
            const displayElements = elements.slice(0, 24);
            
            displayElements.forEach(element => {
                const div = document.createElement('div');
                div.className = 'mini-element';
                div.textContent = element.symbol;
                div.title = element.name;
                miniTable.appendChild(div);
            });
        }
        
        function nextQuestion() {
            if (gameState.questionCount >= gameState.totalQuestions) {
                endGame();
                return;
            }
            
            gameState.questionCount++;
            gameState.answered = false;
            
            // 根据等级选择元素难度
            const availableElements = elements.slice(0, Math.min(10 + gameState.level * 3, elements.length));
            gameState.currentElement = availableElements[Math.floor(Math.random() * availableElements.length)];
            
            generateQuestion();
            updateUI();
            
            document.getElementById('nextBtn').style.display = 'none';
        }
        
        function generateQuestion() {
            const mode = gameState.gameMode;
            const element = gameState.currentElement;
            
            if (mode === 'symbol') {
                generateSymbolQuestion(element);
            } else if (mode === 'name') {
                generateNameQuestion(element);
            } else if (mode === 'properties') {
                generatePropertyQuestion(element);
            }
            
            // 高亮当前元素
            highlightCurrentElement();
        }
        
        function generateSymbolQuestion(element) {
            document.getElementById('elementSymbol').textContent = '?';
            document.getElementById('elementName').textContent = element.name;
            document.getElementById('elementDetails').textContent = 
                `原子序数: ${element.number} | 原子量: ${element.mass}`;
            
            const options = [element.symbol];
            while (options.length < 4) {
                const randomElement = elements[Math.floor(Math.random() * elements.length)];
                if (!options.includes(randomElement.symbol)) {
                    options.push(randomElement.symbol);
                }
            }
            
            shuffleArray(options);
            createOptions(options, element.symbol);
        }
        
        function generateNameQuestion(element) {
            document.getElementById('elementSymbol').textContent = element.symbol;
            document.getElementById('elementName').textContent = '?';
            document.getElementById('elementDetails').textContent = 
                `原子序数: ${element.number} | 类别: ${element.category}`;
            
            const options = [element.name];
            while (options.length < 4) {
                const randomElement = elements[Math.floor(Math.random() * elements.length)];
                if (!options.includes(randomElement.name)) {
                    options.push(randomElement.name);
                }
            }
            
            shuffleArray(options);
            createOptions(options, element.name);
        }
        
        function generatePropertyQuestion(element) {
            const questions = [
                {
                    question: `${element.name}(符号: ${element.symbol})的原子序数是？`,
                    correct: element.number.toString(),
                    options: [element.number - 1, element.number, element.number + 1, element.number + 2].map(n => n.toString())
                },
                {
                    question: `${element.name}(符号: ${element.symbol})属于哪个类别？`,
                    correct: element.category,
                    options: [element.category, '碱金属', '过渡金属', '非金属'].filter((v, i, a) => a.indexOf(v) === i)
                }
            ];
            
            const selectedQuestion = questions[Math.floor(Math.random() * questions.length)];
            
            document.getElementById('elementSymbol').textContent = '❓';
            document.getElementById('elementName').textContent = selectedQuestion.question;
            document.getElementById('elementDetails').textContent = '选择正确答案';
            
            // 确保有四个不同选项
            const options = [...selectedQuestion.options];
            while (options.length < 4) {
                const randomNum = Math.floor(Math.random() * 50) + 1;
                if (!options.includes(randomNum.toString())) {
                    options.push(randomNum.toString());
                }
            }
            
            shuffleArray(options.slice(0, 4));
            createOptions(options.slice(0, 4), selectedQuestion.correct);
        }
        
        function createOptions(options, correctAnswer) {
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                optionDiv.addEventListener('click', () => selectOption(option, correctAnswer));
                optionsGrid.appendChild(optionDiv);
            });
        }
        
        function selectOption(selected, correct) {
            if (gameState.answered) return;
            
            gameState.answered = true;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                if (option.textContent === selected) {
                    if (selected === correct) {
                        option.classList.add('correct');
                        handleCorrectAnswer();
                    } else {
                        option.classList.add('wrong');
                        handleWrongAnswer();
                    }
                } else if (option.textContent === correct) {
                    option.classList.add('correct');
                }
                option.style.pointerEvents = 'none';
            });
            
            setTimeout(() => {
                document.getElementById('nextBtn').style.display = 'inline-block';
            }, 1500);
        }
        
        function handleCorrectAnswer() {
            gameState.streak++;
            let points = 10 + gameState.streak * 2;
            gameState.score += points;
            
            showScoreEffect(`+${points}`, '#56CCF2');
            
            // 等级提升
            if (gameState.streak > 0 && gameState.streak % 5 === 0) {
                gameState.level++;
                showScoreEffect('等级提升!', '#ffd93d');
            }
        }
        
        function handleWrongAnswer() {
            gameState.streak = 0;
            showScoreEffect('错误!', '#ff6b6b');
        }
        
        function showScoreEffect(text, color) {
            const effect = document.createElement('div');
            effect.textContent = text;
            effect.style.cssText = `
                position: fixed;
                top: 30%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: ${color};
                font-size: 2em;
                font-weight: bold;
                pointer-events: none;
                animation: scoreFloat 1.5s ease-out forwards;
                z-index: 1000;
            `;
            
            document.body.appendChild(effect);
            
            setTimeout(() => {
                document.body.removeChild(effect);
            }, 1500);
        }
        
        function highlightCurrentElement() {
            const miniElements = document.querySelectorAll('.mini-element');
            miniElements.forEach(el => {
                el.classList.remove('current');
                if (el.textContent === gameState.currentElement.symbol) {
                    el.classList.add('current');
                }
            });
        }
        
        function showHint() {
            if (gameState.answered || !gameState.running) return;
            
            const element = gameState.currentElement;
            const hints = [
                `提示：该元素的原子序数是 ${element.number}`,
                `提示：该元素属于 ${element.category}`,
                `提示：该元素的符号以 "${element.symbol[0]}" 开头`
            ];
            
            const randomHint = hints[Math.floor(Math.random() * hints.length)];
            alert(randomHint);
        }
        
        function resetGame() {
            gameState = {
                running: false,
                score: 0,
                streak: 0,
                questionCount: 0,
                totalQuestions: 20,
                level: 1,
                currentElement: null,
                gameMode: 'symbol',
                answered: false
            };
            
            document.getElementById('elementSymbol').textContent = 'H';
            document.getElementById('elementName').textContent = '氢';
            document.getElementById('elementDetails').textContent = '原子序数: 1 | 原子量: 1.008';
            document.getElementById('optionsGrid').innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            
            updateUI();
        }
        
        function endGame() {
            gameState.running = false;
            
            const accuracy = Math.round((gameState.score / (gameState.totalQuestions * 10)) * 100);
            
            setTimeout(() => {
                alert(`游戏结束！\n最终得分：${gameState.score}\n正确率：${accuracy}%\n最高连续：${gameState.streak}\n达到等级：${gameState.level}`);
            }, 500);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('questionProgress').textContent = 
                `${gameState.questionCount}/${gameState.totalQuestions}`;
            document.getElementById('level').textContent = gameState.level;
            
            const progress = (gameState.questionCount / gameState.totalQuestions) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes scoreFloat {
                0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                100% { opacity: 0; transform: translate(-50%, -70%) scale(1.2); }
            }
        `;
        document.head.appendChild(style);
        
        // 初始化
        createMiniTable();
        updateUI();
    </script>
</body>
</html>
