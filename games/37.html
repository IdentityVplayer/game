<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块 - Brick Breaker</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .game-area {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        #gameCanvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: #1a1a2e;
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧱 打砖块 Brick Breaker</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div>分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div>生命</div>
                <div class="stat-value" id="lives">3</div>
            </div>
            <div class="stat-item">
                <div>关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-top: 20px;">
            <h3>🎮 游玩方法:</h3>
            <p>• 使用鼠标左右移动挡板</p>
            <p>• 让球反弹击破所有砖块</p>
            <p>• 不要让球落到底部</p>
            <p>• 清除所有砖块进入下一关</p>
            <p>• 收集掉落的道具获得特殊能力</p>
        </div>
        
        <a href="../index.html" style="color: #ffd700; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let game = {
            paddle: { x: 250, y: 350, width: 100, height: 15, speed: 8 },
            ball: { x: 300, y: 200, dx: 4, dy: -4, radius: 8 },
            bricks: [],
            powerups: [],
            score: 0,
            lives: 3,
            level: 1,
            gameRunning: false,
            gameLoop: null,
            ballStuck: true
        };
        
        const brickColors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];
        
        function createBricks() {
            game.bricks = [];
            const rows = 5 + game.level;
            const cols = 10;
            const brickWidth = 55;
            const brickHeight = 20;
            const padding = 5;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    game.bricks.push({
                        x: c * (brickWidth + padding) + padding,
                        y: r * (brickHeight + padding) + 50,
                        width: brickWidth,
                        height: brickHeight,
                        hits: Math.floor(Math.random() * 3) + 1,
                        maxHits: Math.floor(Math.random() * 3) + 1,
                        color: brickColors[Math.floor(Math.random() * brickColors.length)]
                    });
                }
            }
        }
        
        function drawPaddle() {
            const gradient = ctx.createLinearGradient(game.paddle.x, 0, game.paddle.x + game.paddle.width, 0);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(1, '#ee5a24');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(game.paddle.x, game.paddle.y, game.paddle.width, game.paddle.height);
            
            // 高光效果
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(game.paddle.x, game.paddle.y, game.paddle.width, 5);
        }
        
        function drawBall() {
            const gradient = ctx.createRadialGradient(game.ball.x, game.ball.y, 0, game.ball.x, game.ball.y, game.ball.radius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#ffd700');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(game.ball.x, game.ball.y, game.ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawBricks() {
            game.bricks.forEach(brick => {
                const alpha = brick.hits / brick.maxHits;
                ctx.fillStyle = brick.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                
                // 边框
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                
                // 显示剩余生命值
                if (brick.hits > 1) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(brick.hits, brick.x + brick.width/2, brick.y + brick.height/2 + 4);
                }
            });
        }
        
        function drawPowerups() {
            game.powerups.forEach(powerup => {
                ctx.fillStyle = powerup.color;
                ctx.fillRect(powerup.x, powerup.y, 20, 20);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(powerup.type, powerup.x + 10, powerup.y + 14);
            });
        }
        
        function updateBall() {
            if (game.ballStuck) {
                game.ball.x = game.paddle.x + game.paddle.width / 2;
                game.ball.y = game.paddle.y - game.ball.radius;
                return;
            }
            
            game.ball.x += game.ball.dx;
            game.ball.y += game.ball.dy;
            
            // 墙壁碰撞
            if (game.ball.x <= game.ball.radius || game.ball.x >= canvas.width - game.ball.radius) {
                game.ball.dx = -game.ball.dx;
            }
            if (game.ball.y <= game.ball.radius) {
                game.ball.dy = -game.ball.dy;
            }
            
            // 底部碰撞（失去生命）
            if (game.ball.y >= canvas.height - game.ball.radius) {
                game.lives--;
                updateStats();
                if (game.lives <= 0) {
                    gameOver();
                } else {
                    resetBall();
                }
            }
            
            // 挡板碰撞
            if (game.ball.y + game.ball.radius >= game.paddle.y &&
                game.ball.x >= game.paddle.x &&
                game.ball.x <= game.paddle.x + game.paddle.width) {
                
                const hitPos = (game.ball.x - game.paddle.x) / game.paddle.width;
                const angle = (hitPos - 0.5) * Math.PI / 3;
                const speed = Math.sqrt(game.ball.dx * game.ball.dx + game.ball.dy * game.ball.dy);
                
                game.ball.dx = speed * Math.sin(angle);
                game.ball.dy = -speed * Math.cos(angle);
            }
        }
        
        function checkBrickCollisions() {
            game.bricks.forEach((brick, index) => {
                if (game.ball.x >= brick.x &&
                    game.ball.x <= brick.x + brick.width &&
                    game.ball.y >= brick.y &&
                    game.ball.y <= brick.y + brick.height) {
                    
                    game.ball.dy = -game.ball.dy;
                    brick.hits--;
                    
                    if (brick.hits <= 0) {
                        // 随机掉落道具
                        if (Math.random() < 0.2) {
                            const powerupTypes = ['L', 'S', 'M'];
                            const colors = ['#ff6b6b', '#4ecdc4', '#feca57'];
                            const type = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
                            
                            game.powerups.push({
                                x: brick.x + brick.width/2,
                                y: brick.y + brick.height,
                                type: type,
                                color: colors[powerupTypes.indexOf(type)],
                                speed: 2
                            });
                        }
                        
                        game.bricks.splice(index, 1);
                        game.score += 10 * game.level;
                        updateStats();
                        
                        // 检查是否清除所有砖块
                        if (game.bricks.length === 0) {
                            nextLevel();
                        }
                    } else {
                        game.score += 5;
                        updateStats();
                    }
                }
            });
        }
        
        function updatePowerups() {
            game.powerups.forEach((powerup, index) => {
                powerup.y += powerup.speed;
                
                // 检查与挡板碰撞
                if (powerup.y + 20 >= game.paddle.y &&
                    powerup.x + 20 >= game.paddle.x &&
                    powerup.x <= game.paddle.x + game.paddle.width) {
                    
                    applyPowerup(powerup.type);
                    game.powerups.splice(index, 1);
                }
                
                // 移除超出屏幕的道具
                if (powerup.y > canvas.height) {
                    game.powerups.splice(index, 1);
                }
            });
        }
        
        function applyPowerup(type) {
            switch(type) {
                case 'L': // 额外生命
                    game.lives++;
                    break;
                case 'S': // 球速减慢
                    game.ball.dx *= 0.8;
                    game.ball.dy *= 0.8;
                    break;
                case 'M': // 多球（简化为分数加倍）
                    game.score += 100;
                    break;
            }
            updateStats();
        }
        
        function resetBall() {
            game.ball.x = game.paddle.x + game.paddle.width / 2;
            game.ball.y = game.paddle.y - game.ball.radius;
            game.ball.dx = 4;
            game.ball.dy = -4;
            game.ballStuck = true;
        }
        
        function nextLevel() {
            game.level++;
            game.ballStuck = true;
            createBricks();
            resetBall();
            game.ball.dx *= 1.1;
            game.ball.dy *= 1.1;
            updateStats();
        }
        
        function update() {
            if (!game.gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updateBall();
            checkBrickCollisions();
            updatePowerups();
            
            drawBricks();
            drawPaddle();
            drawBall();
            drawPowerups();
            
            if (game.ballStuck) {
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('点击开始发球！', canvas.width/2, canvas.height - 50);
            }
        }
        
        function startGame() {
            if (!game.gameRunning) {
                game.gameRunning = true;
                createBricks();
                resetBall();
                game.gameLoop = setInterval(update, 16);
            }
        }
        
        function pauseGame() {
            game.gameRunning = !game.gameRunning;
        }
        
        function resetGame() {
            game.gameRunning = false;
            clearInterval(game.gameLoop);
            game.score = 0;
            game.lives = 3;
            game.level = 1;
            game.powerups = [];
            game.paddle.x = 250;
            resetBall();
            updateStats();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        
        function gameOver() {
            game.gameRunning = false;
            clearInterval(game.gameLoop);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#fff';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width/2, canvas.height/2 - 50);
            
            ctx.font = '24px Arial';
            ctx.fillText('最终分数: ' + game.score, canvas.width/2, canvas.height/2);
            ctx.fillText('到达关卡: ' + game.level, canvas.width/2, canvas.height/2 + 30);
        }
        
        function updateStats() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('lives').textContent = game.lives;
            document.getElementById('level').textContent = game.level;
        }
        
        // 鼠标控制
        canvas.addEventListener('mousemove', (e) => {
            if (!game.gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            game.paddle.x = mouseX - game.paddle.width / 2;
            
            // 边界限制
            if (game.paddle.x < 0) game.paddle.x = 0;
            if (game.paddle.x > canvas.width - game.paddle.width) {
                game.paddle.x = canvas.width - game.paddle.width;
            }
        });
        
        // 点击发球
        canvas.addEventListener('click', () => {
            if (game.ballStuck && game.gameRunning) {
                game.ballStuck = false;
            }
        });
        
        updateStats();
    </script>
</body>
</html>
