<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冠军2048 4819</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #96CEB4, #45B7D1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #FF6B6B, #FF6B6B);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            background-color: #bbada0;
            border-radius: 10px;
            padding: 10px;
            margin: 20px auto;
            width: fit-content;
        }
        
        .tile {
            width: 80px;
            height: 80px;
            background-color: #cdc1b4;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
        }
        
        .tile-2 { background-color: #eee4da; }
        .tile-4 { background-color: #ede0c8; }
        .tile-8 { background-color: #f2b179; color: white; }
        .tile-16 { background-color: #f59563; color: white; }
        .tile-32 { background-color: #f67c5f; color: white; }
        .tile-64 { background-color: #f65e3b; color: white; }
        .tile-128 { background-color: #edcf72; color: white; font-size: 20px; }
        .tile-256 { background-color: #edcc61; color: white; font-size: 20px; }
        .tile-512 { background-color: #edc850; color: white; font-size: 20px; }
        .tile-1024 { background-color: #edc53f; color: white; font-size: 18px; }
        .tile-2048 { background-color: #edc22e; color: white; font-size: 18px; }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>冠军2048 4819</h1>
        
        <div id="gameBoard"></div>
        <div class="score">得分: <span id="score">0</span></div>
        <button class="btn" onclick="newGame()">新游戏</button>
        
    </div>
    
    <script>
        
        let board = [];
        let score = 0;
        
        function initGame() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            addRandomTile();
            addRandomTile();
            updateDisplay();
        }
        
        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push({x: i, y: j});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.x][randomCell.y] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function updateDisplay() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    
                    if (board[i][j] !== 0) {
                        tile.textContent = board[i][j];
                        tile.classList.add('tile-' + board[i][j]);
                    }
                    
                    gameBoard.appendChild(tile);
                }
            }
            
            document.getElementById('score').textContent = score;
        }
        
        function moveLeft() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                let row = board[i].filter(val => val !== 0);
                
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row[j + 1] = 0;
                    }
                }
                
                row = row.filter(val => val !== 0);
                while (row.length < 4) {
                    row.push(0);
                }
                
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] !== row[j]) {
                        moved = true;
                    }
                    board[i][j] = row[j];
                }
            }
            return moved;
        }
        
        function moveRight() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                let row = board[i].filter(val => val !== 0);
                
                for (let j = row.length - 1; j > 0; j--) {
                    if (row[j] === row[j - 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row[j - 1] = 0;
                    }
                }
                
                row = row.filter(val => val !== 0);
                while (row.length < 4) {
                    row.unshift(0);
                }
                
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] !== row[j]) {
                        moved = true;
                    }
                    board[i][j] = row[j];
                }
            }
            return moved;
        }
        
        function moveUp() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                let column = [];
                for (let i = 0; i < 4; i++) {
                    if (board[i][j] !== 0) {
                        column.push(board[i][j]);
                    }
                }
                
                for (let i = 0; i < column.length - 1; i++) {
                    if (column[i] === column[i + 1]) {
                        column[i] *= 2;
                        score += column[i];
                        column[i + 1] = 0;
                    }
                }
                
                column = column.filter(val => val !== 0);
                while (column.length < 4) {
                    column.push(0);
                }
                
                for (let i = 0; i < 4; i++) {
                    if (board[i][j] !== column[i]) {
                        moved = true;
                    }
                    board[i][j] = column[i];
                }
            }
            return moved;
        }
        
        function moveDown() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                let column = [];
                for (let i = 0; i < 4; i++) {
                    if (board[i][j] !== 0) {
                        column.push(board[i][j]);
                    }
                }
                
                for (let i = column.length - 1; i > 0; i--) {
                    if (column[i] === column[i - 1]) {
                        column[i] *= 2;
                        score += column[i];
                        column[i - 1] = 0;
                    }
                }
                
                column = column.filter(val => val !== 0);
                while (column.length < 4) {
                    column.unshift(0);
                }
                
                for (let i = 0; i < 4; i++) {
                    if (board[i][j] !== column[i]) {
                        moved = true;
                    }
                    board[i][j] = column[i];
                }
            }
            return moved;
        }
        
        function isGameOver() {
            // Check for empty cells
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            
            // Check for possible merges
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === board[i][j + 1] || board[j][i] === board[j + 1][i]) {
                        return false;
                    }
                }
            }
            
            return true;
        }
        
        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 2048) {
                        alert('恭喜！你达到了2048！');
                        return true;
                    }
                }
            }
            return false;
        }
        
        function newGame() {
            initGame();
        }
        
        document.addEventListener('keydown', function(e) {
            let moved = false;
            
            switch(e.code) {
                case 'ArrowLeft':
                    moved = moveLeft();
                    break;
                case 'ArrowRight':
                    moved = moveRight();
                    break;
                case 'ArrowUp':
                    moved = moveUp();
                    break;
                case 'ArrowDown':
                    moved = moveDown();
                    break;
            }
            
            if (moved) {
                addRandomTile();
                updateDisplay();
                
                if (checkWin()) {
                    return;
                }
                
                if (isGameOver()) {
                    alert('游戏结束！得分: ' + score);
                }
            }
        });
        
        initGame();
        
    </script>
</body>
</html>
