<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际象棋</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #8B4513 0%, #D2B48C 50%, #8B4513 100%);
            min-height: 100vh;
        }

        h1 {
            color: #2F4F4F;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 3px solid #8B4513;
            margin: 20px auto;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }

        .square.light {
            background-color: #F5DEB3;
        }

        .square.dark {
            background-color: #D2B48C;
        }

        .square.selected {
            background-color: #FFD700 !important;
            box-shadow: inset 0 0 10px rgba(255,215,0,0.8);
        }

        .square.valid-move {
            background-color: #90EE90 !important;
        }

        .square.in-check {
            background-color: #FF6B6B !important;
        }

        .piece {
            user-select: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .white {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .black {
            color: #2F4F4F;
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            color: #2F4F4F;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #8B4513, #D2B48C);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .status {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🏰 国际象棋</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div class="status" id="status">白方回合</div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="undoMove()">悔棋</button>
        </div>
    </div>

    <script>
        class Chess {
            constructor() {
                this.board = [
                    ['♜','♞','♝','♛','♚','♝','♞','♜'],
                    ['♟','♟','♟','♟','♟','♟','♟','♟'],
                    [null,null,null,null,null,null,null,null],
                    [null,null,null,null,null,null,null,null],
                    [null,null,null,null,null,null,null,null],
                    [null,null,null,null,null,null,null,null],
                    ['♙','♙','♙','♙','♙','♙','♙','♙'],
                    ['♖','♘','♗','♕','♔','♗','♘','♖']
                ];
                
                this.whitePieces = ['♔','♕','♖','♗','♘','♙'];
                this.blackPieces = ['♚','♛','♜','♝','♞','♟'];
                
                this.currentPlayer = 'white';
                this.selectedSquare = null;
                this.gameOver = false;
                this.moveHistory = [];
                
                this.initBoard();
                this.updateStatus();
            }

            initBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                        square.dataset.row = row;
                        square.dataset.col = col;
                        square.onclick = () => this.onSquareClick(row, col);
                        
                        const piece = this.board[row][col];
                        if (piece) {
                            const pieceElement = document.createElement('div');
                            pieceElement.className = `piece ${this.whitePieces.includes(piece) ? 'white' : 'black'}`;
                            pieceElement.textContent = piece;
                            square.appendChild(pieceElement);
                        }
                        
                        boardElement.appendChild(square);
                    }
                }
            }

            onSquareClick(row, col) {
                if (this.gameOver) return;
                
                const piece = this.board[row][col];
                
                if (this.selectedSquare) {
                    const [selectedRow, selectedCol] = this.selectedSquare;
                    
                    if (row === selectedRow && col === selectedCol) {
                        // 取消选择
                        this.clearSelection();
                        return;
                    }
                    
                    if (this.isValidMove(selectedRow, selectedCol, row, col)) {
                        this.makeMove(selectedRow, selectedCol, row, col);
                        this.clearSelection();
                        this.switchPlayer();
                        this.updateStatus();
                        
                        // 简单的AI回应（随机移动）
                        if (this.currentPlayer === 'black' && !this.gameOver) {
                            setTimeout(() => this.makeAIMove(), 500);
                        }
                    } else {
                        this.clearSelection();
                        if (piece && this.isPieceOwnedByCurrentPlayer(piece)) {
                            this.selectSquare(row, col);
                        }
                    }
                } else {
                    if (piece && this.isPieceOwnedByCurrentPlayer(piece)) {
                        this.selectSquare(row, col);
                    }
                }
            }

            selectSquare(row, col) {
                this.selectedSquare = [row, col];
                this.clearHighlights();
                
                const square = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                square.classList.add('selected');
                
                this.highlightValidMoves(row, col);
            }

            clearSelection() {
                this.selectedSquare = null;
                this.clearHighlights();
            }

            clearHighlights() {
                document.querySelectorAll('.square').forEach(square => {
                    square.classList.remove('selected', 'valid-move', 'in-check');
                });
            }

            highlightValidMoves(row, col) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (this.isValidMove(row, col, r, c)) {
                            const square = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                            square.classList.add('valid-move');
                        }
                    }
                }
            }

            isPieceOwnedByCurrentPlayer(piece) {
                if (this.currentPlayer === 'white') {
                    return this.whitePieces.includes(piece);
                } else {
                    return this.blackPieces.includes(piece);
                }
            }

            isValidMove(fromRow, fromCol, toRow, toCol) {
                const piece = this.board[fromRow][fromCol];
                const targetPiece = this.board[toRow][toCol];
                
                if (!piece) return false;
                if (targetPiece && this.isPieceOwnedByCurrentPlayer(targetPiece)) return false;
                
                const rowDiff = toRow - fromRow;
                const colDiff = toCol - fromCol;
                
                // 简化的移动规则
                switch (piece) {
                    case '♙': // 白兵
                        return rowDiff === -1 && colDiff === 0 && !targetPiece;
                    case '♟': // 黑兵
                        return rowDiff === 1 && colDiff === 0 && !targetPiece;
                    case '♖': case '♜': // 车
                        return (rowDiff === 0 || colDiff === 0) && this.isPathClear(fromRow, fromCol, toRow, toCol);
                    case '♗': case '♝': // 象
                        return Math.abs(rowDiff) === Math.abs(colDiff) && this.isPathClear(fromRow, fromCol, toRow, toCol);
                    case '♘': case '♞': // 马
                        return (Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1) || 
                               (Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2);
                    case '♕': case '♛': // 后
                        return (rowDiff === 0 || colDiff === 0 || Math.abs(rowDiff) === Math.abs(colDiff)) && 
                               this.isPathClear(fromRow, fromCol, toRow, toCol);
                    case '♔': case '♚': // 王
                        return Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1;
                    default:
                        return false;
                }
            }

            isPathClear(fromRow, fromCol, toRow, toCol) {
                const rowDir = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
                const colDir = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
                
                let row = fromRow + rowDir;
                let col = fromCol + colDir;
                
                while (row !== toRow || col !== toCol) {
                    if (this.board[row][col]) return false;
                    row += rowDir;
                    col += colDir;
                }
                
                return true;
            }

            makeMove(fromRow, fromCol, toRow, toCol) {
                const piece = this.board[fromRow][fromCol];
                const capturedPiece = this.board[toRow][toCol];
                
                this.moveHistory.push({
                    from: [fromRow, fromCol],
                    to: [toRow, toCol],
                    piece: piece,
                    captured: capturedPiece
                });
                
                this.board[toRow][toCol] = piece;
                this.board[fromRow][fromCol] = null;
                
                this.initBoard();
                
                // 检查游戏结束
                if (capturedPiece === '♔' || capturedPiece === '♚') {
                    this.gameOver = true;
                }
            }

            makeAIMove() {
                const moves = this.getAllValidMoves('black');
                if (moves.length > 0) {
                    const randomMove = moves[Math.floor(Math.random() * moves.length)];
                    this.makeMove(randomMove.from[0], randomMove.from[1], randomMove.to[0], randomMove.to[1]);
                    this.switchPlayer();
                    this.updateStatus();
                }
            }

            getAllValidMoves(player) {
                const moves = [];
                const pieces = player === 'white' ? this.whitePieces : this.blackPieces;
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = this.board[row][col];
                        if (piece && pieces.includes(piece)) {
                            for (let r = 0; r < 8; r++) {
                                for (let c = 0; c < 8; c++) {
                                    if (this.isValidMove(row, col, r, c)) {
                                        moves.push({
                                            from: [row, col],
                                            to: [r, c],
                                            piece: piece
                                        });
                                    }
                                }
                            }
                        }
                    }
                }
                return moves;
            }

            switchPlayer() {
                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';
            }

            updateStatus() {
                const status = document.getElementById('status');
                if (this.gameOver) {
                    status.textContent = `游戏结束！${this.currentPlayer === 'white' ? '黑方' : '白方'}获胜！`;
                    status.style.background = '#FFD700';
                } else {
                    status.textContent = this.currentPlayer === 'white' ? '白方回合' : '黑方回合（电脑）';
                    status.style.background = this.currentPlayer === 'white' ? '#E6F3FF' : '#2F2F2F';
                    status.style.color = this.currentPlayer === 'white' ? '#2F4F4F' : 'white';
                }
            }
        }

        let game;

        function newGame() {
            game = new Chess();
        }

        function undoMove() {
            if (game.moveHistory.length > 0) {
                const lastMove = game.moveHistory.pop();
                game.board[lastMove.from[0]][lastMove.from[1]] = lastMove.piece;
                game.board[lastMove.to[0]][lastMove.to[1]] = lastMove.captured;
                game.switchPlayer();
                game.gameOver = false;
                game.initBoard();
                game.updateStatus();
            }
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
