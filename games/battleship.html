<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海战棋</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }

        .game-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
        }

        .game-area {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 30px 0;
        }

        .board-container {
            text-align: center;
        }

        .board-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e3c72;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            gap: 1px;
            background: #34495e;
            border: 2px solid #2c3e50;
            padding: 5px;
        }

        .cell {
            width: 30px;
            height: 30px;
            background: #3498db;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .cell:hover {
            background: #2980b9;
        }

        .cell.ship {
            background: #2c3e50;
            color: white;
        }

        .cell.hit {
            background: #e74c3c;
            color: white;
        }

        .cell.miss {
            background: #95a5a6;
            color: white;
        }

        .cell.sunk {
            background: #8e44ad;
            color: white;
        }

        .ship-placement {
            text-align: center;
            margin: 20px 0;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
        }

        .ship-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .ship-item {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .ship-item.selected {
            background: #e74c3c;
            border-color: #c0392b;
        }

        .ship-item.placed {
            background: #27ae60;
            cursor: not-allowed;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .status {
            font-size: 18px;
            font-weight: bold;
            color: #1e3c72;
            margin: 10px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 15px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }

        .instructions {
            background: #d1ecf1;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🚢 海战棋</h1>
        
        <div class="game-info">
            <div class="status" id="status">请放置你的战舰</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="playerHits">0</div>
                    <div>你的命中</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="computerHits">0</div>
                    <div>电脑命中</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalShots">0</div>
                    <div>总射击</div>
                </div>
            </div>
        </div>
        
        <div class="ship-placement" id="shipPlacement">
            <h3>放置你的战舰</h3>
            <div class="ship-list" id="shipList">
                <div class="ship-item" data-size="5" data-name="航空母舰">航空母舰 (5)</div>
                <div class="ship-item" data-size="4" data-name="战列舰">战列舰 (4)</div>
                <div class="ship-item" data-size="3" data-name="巡洋舰">巡洋舰 (3)</div>
                <div class="ship-item" data-size="3" data-name="潜水艇">潜水艇 (3)</div>
                <div class="ship-item" data-size="2" data-name="驱逐舰">驱逐舰 (2)</div>
            </div>
            <div class="instructions">
                <strong>操作说明：</strong>
                1. 点击选择要放置的战舰
                2. 点击你的棋盘放置战舰
                3. 再次点击可以旋转战舰方向
                4. 放置完所有战舰后开始游戏
            </div>
        </div>
        
        <div class="game-area">
            <div class="board-container">
                <div class="board-title">你的海域</div>
                <div class="board" id="playerBoard"></div>
            </div>
            
            <div class="board-container">
                <div class="board-title">敌人海域</div>
                <div class="board" id="computerBoard"></div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="randomPlacement()" id="randomBtn">随机放置</button>
            <button onclick="clearBoard()" id="clearBtn">清空棋盘</button>
            <button onclick="startGame()" id="startBtn" disabled>开始游戏</button>
            <button onclick="newGame()">新游戏</button>
        </div>
    </div>

    <script>
        class Battleship {
            constructor() {
                this.playerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
                this.computerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
                this.playerShots = Array(10).fill(null).map(() => Array(10).fill(0));
                this.computerShots = Array(10).fill(null).map(() => Array(10).fill(0));
                
                this.ships = [
                    {name: '航空母舰', size: 5, placed: false},
                    {name: '战列舰', size: 4, placed: false},
                    {name: '巡洋舰', size: 3, placed: false},
                    {name: '潜水艇', size: 3, placed: false},
                    {name: '驱逐舰', size: 2, placed: false}
                ];
                
                this.selectedShip = null;
                this.isHorizontal = true;
                this.gameStarted = false;
                this.playerTurn = true;
                this.playerHits = 0;
                this.computerHits = 0;
                this.totalShots = 0;
                
                this.initializeGame();
            }

            initializeGame() {
                this.createBoards();
                this.setupShipPlacement();
                this.placeComputerShips();
                this.updateDisplay();
            }

            createBoards() {
                this.createBoard('playerBoard', (row, col) => this.onPlayerBoardClick(row, col));
                this.createBoard('computerBoard', (row, col) => this.onComputerBoardClick(row, col));
            }

            createBoard(boardId, clickHandler) {
                const board = document.getElementById(boardId);
                board.innerHTML = '';
                
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        cell.onclick = () => clickHandler(row, col);
                        board.appendChild(cell);
                    }
                }
            }

            setupShipPlacement() {
                const shipItems = document.querySelectorAll('.ship-item');
                shipItems.forEach((item, index) => {
                    item.onclick = () => this.selectShip(index);
                });
            }

            selectShip(index) {
                if (this.ships[index].placed || this.gameStarted) return;
                
                document.querySelectorAll('.ship-item').forEach(item => {
                    item.classList.remove('selected');
                });
                
                document.querySelectorAll('.ship-item')[index].classList.add('selected');
                this.selectedShip = index;
            }

            onPlayerBoardClick(row, col) {
                if (this.gameStarted) return;
                
                if (this.selectedShip === null) return;
                
                // 如果点击已放置的舰，旋转方向
                if (this.playerBoard[row][col] > 0) {
                    this.rotateShip(row, col);
                    return;
                }
                
                this.placeShip(row, col, this.selectedShip);
            }

            placeShip(row, col, shipIndex) {
                const ship = this.ships[shipIndex];
                if (ship.placed) return;
                
                if (this.canPlaceShip(this.playerBoard, row, col, ship.size, this.isHorizontal)) {
                    // 放置舰
                    for (let i = 0; i < ship.size; i++) {
                        const r = this.isHorizontal ? row : row + i;
                        const c = this.isHorizontal ? col + i : col;
                        this.playerBoard[r][c] = shipIndex + 1;
                    }
                    
                    ship.placed = true;
                    
                    // 更新UI
                    const shipItem = document.querySelectorAll('.ship-item')[shipIndex];
                    shipItem.classList.remove('selected');
                    shipItem.classList.add('placed');
                    
                    this.selectedShip = null;
                    this.updatePlayerBoard();
                    
                    // 检查是否所有舰都放置了
                    if (this.ships.every(ship => ship.placed)) {
                        document.getElementById('startBtn').disabled = false;
                    }
                }
            }

            rotateShip(row, col) {
                const shipId = this.playerBoard[row][col];
                if (shipId === 0) return;
                
                const ship = this.ships[shipId - 1];
                
                // 清除原有舰
                this.clearShipFromBoard(this.playerBoard, shipId);
                ship.placed = false;
                
                // 尝试旋转放置
                this.isHorizontal = !this.isHorizontal;
                
                if (this.canPlaceShip(this.playerBoard, row, col, ship.size, this.isHorizontal)) {
                    for (let i = 0; i < ship.size; i++) {
                        const r = this.isHorizontal ? row : row + i;
                        const c = this.isHorizontal ? col + i : col;
                        this.playerBoard[r][c] = shipId;
                    }
                    ship.placed = true;
                } else {
                    // 旋转失败，恢复原来的方向
                    this.isHorizontal = !this.isHorizontal;
                    for (let i = 0; i < ship.size; i++) {
                        const r = this.isHorizontal ? row : row + i;
                        const c = this.isHorizontal ? col + i : col;
                        this.playerBoard[r][c] = shipId;
                    }
                    ship.placed = true;
                }
                
                this.updatePlayerBoard();
            }

            clearShipFromBoard(board, shipId) {
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (board[row][col] === shipId) {
                            board[row][col] = 0;
                        }
                    }
                }
            }

            canPlaceShip(board, row, col, size, horizontal) {
                for (let i = 0; i < size; i++) {
                    const r = horizontal ? row : row + i;
                    const c = horizontal ? col + i : col;
                    
                    if (r >= 10 || c >= 10 || board[r][c] > 0) {
                        return false;
                    }
                }
                return true;
            }

            placeComputerShips() {
                for (let i = 0; i < this.ships.length; i++) {
                    let placed = false;
                    while (!placed) {
                        const row = Math.floor(Math.random() * 10);
                        const col = Math.floor(Math.random() * 10);
                        const horizontal = Math.random() < 0.5;
                        
                        if (this.canPlaceShip(this.computerBoard, row, col, this.ships[i].size, horizontal)) {
                            for (let j = 0; j < this.ships[i].size; j++) {
                                const r = horizontal ? row : row + j;
                                const c = horizontal ? col + j : col;
                                this.computerBoard[r][c] = i + 1;
                            }
                            placed = true;
                        }
                    }
                }
            }

            onComputerBoardClick(row, col) {
                if (!this.gameStarted || !this.playerTurn) return;
                if (this.playerShots[row][col] > 0) return;
                
                this.playerShot(row, col);
            }

            playerShot(row, col) {
                this.totalShots++;
                
                if (this.computerBoard[row][col] > 0) {
                    this.playerShots[row][col] = 2; // 命中
                    this.playerHits++;
                    
                    // 检查是否击沉
                    const shipId = this.computerBoard[row][col];
                    if (this.isShipSunk(this.computerBoard, this.playerShots, shipId)) {
                        this.markShipAsSunk(this.playerShots, this.computerBoard, shipId);
                    }
                } else {
                    this.playerShots[row][col] = 1; // 未命中
                }
                
                this.updateComputerBoard();
                
                if (this.checkWin()) return;
                
                this.playerTurn = false;
                this.updateStatus();
                
                setTimeout(() => this.computerShot(), 1000);
            }

            computerShot() {
                let row, col;
                do {
                    row = Math.floor(Math.random() * 10);
                    col = Math.floor(Math.random() * 10);
                } while (this.computerShots[row][col] > 0);
                
                if (this.playerBoard[row][col] > 0) {
                    this.computerShots[row][col] = 2; // 命中
                    this.computerHits++;
                    
                    const shipId = this.playerBoard[row][col];
                    if (this.isShipSunk(this.playerBoard, this.computerShots, shipId)) {
                        this.markShipAsSunk(this.computerShots, this.playerBoard, shipId);
                    }
                } else {
                    this.computerShots[row][col] = 1; // 未命中
                }
                
                this.updatePlayerBoard();
                
                if (this.checkWin()) return;
                
                this.playerTurn = true;
                this.updateStatus();
            }

            isShipSunk(board, shots, shipId) {
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (board[row][col] === shipId && shots[row][col] !== 2) {
                            return false;
                        }
                    }
                }
                return true;
            }

            markShipAsSunk(shots, board, shipId) {
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (board[row][col] === shipId) {
                            shots[row][col] = 3; // 沉没
                        }
                    }
                }
            }

            checkWin() {
                const playerShipsSunk = this.ships.every((ship, index) => 
                    this.isShipSunk(this.computerBoard, this.playerShots, index + 1)
                );
                
                const computerShipsSunk = this.ships.every((ship, index) => 
                    this.isShipSunk(this.playerBoard, this.computerShots, index + 1)
                );
                
                if (playerShipsSunk) {
                    document.getElementById('status').textContent = '🎉 你赢了！所有敌舰均被击沉！';
                    this.gameStarted = false;
                    return true;
                }
                
                if (computerShipsSunk) {
                    document.getElementById('status').textContent = '😔 你输了！你的舰队全军覆没！';
                    this.gameStarted = false;
                    return true;
                }
                
                return false;
            }

            updatePlayerBoard() {
                const board = document.getElementById('playerBoard');
                const cells = board.querySelectorAll('.cell');
                
                cells.forEach((cell, index) => {
                    const row = Math.floor(index / 10);
                    const col = index % 10;
                    
                    cell.className = 'cell';
                    cell.textContent = '';
                    
                    if (this.computerShots[row][col] === 3) {
                        cell.classList.add('sunk');
                        cell.textContent = '☠️';
                    } else if (this.computerShots[row][col] === 2) {
                        cell.classList.add('hit');
                        cell.textContent = '💥';
                    } else if (this.computerShots[row][col] === 1) {
                        cell.classList.add('miss');
                        cell.textContent = '🌊';
                    } else if (this.playerBoard[row][col] > 0) {
                        cell.classList.add('ship');
                        cell.textContent = '🚢';
                    }
                });
            }

            updateComputerBoard() {
                const board = document.getElementById('computerBoard');
                const cells = board.querySelectorAll('.cell');
                
                cells.forEach((cell, index) => {
                    const row = Math.floor(index / 10);
                    const col = index % 10;
                    
                    cell.className = 'cell';
                    cell.textContent = '';
                    
                    if (this.playerShots[row][col] === 3) {
                        cell.classList.add('sunk');
                        cell.textContent = '☠️';
                    } else if (this.playerShots[row][col] === 2) {
                        cell.classList.add('hit');
                        cell.textContent = '💥';
                    } else if (this.playerShots[row][col] === 1) {
                        cell.classList.add('miss');
                        cell.textContent = '🌊';
                    }
                });
            }

            updateStatus() {
                const status = document.getElementById('status');
                if (this.gameStarted) {
                    status.textContent = this.playerTurn ? '你的回合 - 点击敌人海域发起攻击' : '电脑回合';
                } else {
                    status.textContent = '请放置你的战舰';
                }
            }

            updateDisplay() {
                document.getElementById('playerHits').textContent = this.playerHits;
                document.getElementById('computerHits').textContent = this.computerHits;
                document.getElementById('totalShots').textContent = this.totalShots;
                this.updatePlayerBoard();
                this.updateComputerBoard();
                this.updateStatus();
            }

            startGame() {
                this.gameStarted = true;
                document.getElementById('shipPlacement').style.display = 'none';
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('randomBtn').style.display = 'none';
                document.getElementById('clearBtn').style.display = 'none';
                this.updateStatus();
            }

            randomPlacement() {
                this.clearBoard();
                
                for (let i = 0; i < this.ships.length; i++) {
                    let placed = false;
                    while (!placed) {
                        const row = Math.floor(Math.random() * 10);
                        const col = Math.floor(Math.random() * 10);
                        const horizontal = Math.random() < 0.5;
                        
                        if (this.canPlaceShip(this.playerBoard, row, col, this.ships[i].size, horizontal)) {
                            for (let j = 0; j < this.ships[i].size; j++) {
                                const r = horizontal ? row : row + j;
                                const c = horizontal ? col + j : col;
                                this.playerBoard[r][c] = i + 1;
                            }
                            
                            this.ships[i].placed = true;
                            const shipItem = document.querySelectorAll('.ship-item')[i];
                            shipItem.classList.remove('selected');
                            shipItem.classList.add('placed');
                            
                            placed = true;
                        }
                    }
                }
                
                this.updatePlayerBoard();
                document.getElementById('startBtn').disabled = false;
            }

            clearBoard() {
                this.playerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
                this.ships.forEach((ship, index) => {
                    ship.placed = false;
                    const shipItem = document.querySelectorAll('.ship-item')[index];
                    shipItem.classList.remove('selected', 'placed');
                });
                
                this.selectedShip = null;
                this.updatePlayerBoard();
                document.getElementById('startBtn').disabled = true;
            }
        }

        let game;

        function startGame() {
            game.startGame();
        }

        function randomPlacement() {
            game.randomPlacement();
        }

        function clearBoard() {
            game.clearBoard();
        }

        function newGame() {
            game = new Battleship();
            document.getElementById('shipPlacement').style.display = 'block';
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('randomBtn').style.display = 'inline-block';
            document.getElementById('clearBtn').style.display = 'inline-block';
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
