<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空挖矿</title>
    <style>
        body { background: linear-gradient(135deg, #0f0f23, #1a1a2e); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #ffd700; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .mining-field { width: 100%; height: 500px; background: linear-gradient(180deg, #2c2c54, #40407a); border-radius: 10px; position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; }
        .mining-cell { background: #5f5f5f; border: 1px solid #888; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
        .mining-cell.mined { background: #2f2f2f; cursor: default; }
        .mining-cell.ore { background: radial-gradient(circle, #ffd700, #ffb347); }
        .mining-cell.rare { background: radial-gradient(circle, #9b59b6, #8e44ad); }
        .mining-cell.diamond { background: radial-gradient(circle, #74b9ff, #0984e3); }
        .mining-cell.energy { background: radial-gradient(circle, #00ff00, #32cd32); }
        .mining-cell.rock { background: #696969; }
        .drill { position: absolute; top: 0; left: 50%; width: 80px; height: 50px; background: #e74c3c; transform: translateX(-50%); clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%); z-index: 10; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #ffd700; color: #333; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #ffed4e; }
        .upgrade-panel { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .upgrade-btn { background: #e74c3c; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
        .upgrade-btn:hover { background: #c0392b; }
        .mining-progress { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: #333; border-radius: 5px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000); border-radius: 5px; width: 0%; transition: width 0.3s; }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">太空挖矿</h1>
        <div class="game-category">#模拟游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>金币: <span id="money">0</span></div>
                <div>能量: <span id="energy">100</span></div>
                <div>深度: <span id="depth">0</span>m</div>
                <div>总价值: <span id="totalValue">0</span></div>
            </div>
            
            <div class="upgrade-panel">
                <div class="upgrade-btn" onclick="upgradeDrill('power')">提升力量 (100金)</div>
                <div class="upgrade-btn" onclick="upgradeDrill('efficiency')">提升效率 (150金)</div>
                <div class="upgrade-btn" onclick="buyEnergy()">购买能量 (50金)</div>
                <div class="upgrade-btn" onclick="nextLayer()">下一层 (200金)</div>
            </div>
            
            <div class="mining-field" id="miningField">
                <div class="drill" id="drill">🔩</div>
                <div class="mining-progress">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始挖矿</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 点击方块进行挖掘，获得不同的矿物</p>
            <p>• 灰色方块：普通岩石，无价值</p>
            <p>• 💰金矿：50金币，💎紫水晶：100金币</p>
            <p>• 💎钻石：200金币，⚡能量晶体：补充能量</p>
            <p>• 挖掘需要消耗能量，能量耗尽需要购买</p>
            <p>• 升级设备提高效率，探索更深的层次</p>
            <p>• 成为太空挖矿大亨！</p>
        </div>
    </div>
    
    <script>
        let money = 0;
        let energy = 100;
        let depth = 0;
        let totalValue = 0;
        let gameRunning = false;
        let drillPower = 1;
        let drillEfficiency = 1;
        let currentLayer = 0;
        let miningProgress = 0;
        
        const oreTypes = {
            rock: { emoji: '🪨', value: 0, rarity: 0.6 },
            gold: { emoji: '💰', value: 50, rarity: 0.2 },
            purple: { emoji: '💎', value: 100, rarity: 0.1 },
            diamond: { emoji: '💎', value: 200, rarity: 0.05 },
            energy: { emoji: '⚡', value: 0, rarity: 0.05, energyBonus: 20 }
        };
        
        function initGame() {
            createMiningField();
            updateDisplay();
        }
        
        function createMiningField() {
            const field = document.getElementById('miningField');
            
            // Clear existing cells (except drill and progress)
            field.querySelectorAll('.mining-cell').forEach(cell => cell.remove());
            
            for (let i = 0; i < 96; i++) { // 12x8 grid
                const cell = document.createElement('div');
                cell.className = 'mining-cell';
                cell.dataset.index = i;
                
                // Generate ore based on rarity and depth
                const oreType = generateOre();
                cell.dataset.ore = oreType;
                
                if (oreType !== 'rock') {
                    cell.classList.add(oreType);
                }
                
                cell.addEventListener('click', () => mineCell(cell));
                field.appendChild(cell);
            }
        }
        
        function generateOre() {
            const random = Math.random();
            let cumulativeRarity = 0;
            
            // Adjust rarity based on depth
            const depthMultiplier = 1 + currentLayer * 0.3;
            
            for (const [type, ore] of Object.entries(oreTypes)) {
                let adjustedRarity = ore.rarity;
                if (type !== 'rock') {
                    adjustedRarity *= depthMultiplier;
                }
                
                cumulativeRarity += adjustedRarity;
                if (random < cumulativeRarity) {
                    return type;
                }
            }
            
            return 'rock';
        }
        
        function mineCell(cell) {
            if (!gameRunning || cell.classList.contains('mined') || energy <= 0) return;
            
            const energyCost = 5;
            if (energy < energyCost) {
                alert('能量不足！请购买能量。');
                return;
            }
            
            energy -= energyCost;
            
            // Mining animation
            startMining(cell);
        }
        
        function startMining(cell) {
            miningProgress = 0;
            const miningTime = Math.max(1000 - drillEfficiency * 100, 200);
            const progressInterval = 50;
            const progressStep = (progressInterval / miningTime) * 100;
            
            const drill = document.getElementById('drill');
            const progressFill = document.getElementById('progressFill');
            
            // Position drill over cell
            const cellRect = cell.getBoundingClientRect();
            const fieldRect = document.getElementById('miningField').getBoundingClientRect();
            const relativeX = cellRect.left - fieldRect.left + cellRect.width / 2;
            
            drill.style.left = relativeX + 'px';
            drill.style.animation = 'none';
            drill.style.transform = 'translateX(-50%) rotate(0deg)';
            
            const miningInterval = setInterval(() => {
                miningProgress += progressStep;
                progressFill.style.width = Math.min(miningProgress, 100) + '%';
                
                // Drill animation
                drill.style.transform = `translateX(-50%) rotate(${miningProgress * 3.6}deg)`;
                
                if (miningProgress >= 100) {
                    clearInterval(miningInterval);
                    completeMining(cell);
                }
            }, progressInterval);
        }
        
        function completeMining(cell) {
            const oreType = cell.dataset.ore;
            const ore = oreTypes[oreType];
            
            // Mark cell as mined
            cell.classList.add('mined');
            cell.style.background = '#2f2f2f';
            
            // Add ore emoji
            if (oreType !== 'rock') {
                cell.textContent = ore.emoji;
            }
            
            // Calculate rewards
            const baseValue = ore.value * drillPower;
            const bonusValue = Math.floor(baseValue * (currentLayer * 0.2));
            const totalReward = baseValue + bonusValue;
            
            if (ore.value > 0) {
                money += totalReward;
                totalValue += totalReward;
                
                // Show value popup
                showValuePopup(cell, totalReward);
            }
            
            // Energy bonus
            if (ore.energyBonus) {
                energy = Math.min(100, energy + ore.energyBonus);
                showValuePopup(cell, '+' + ore.energyBonus + ' 能量', '#00ff00');
            }
            
            depth += 1;
            
            // Reset progress
            miningProgress = 0;
            document.getElementById('progressFill').style.width = '0%';
            
            // Reset drill position
            const drill = document.getElementById('drill');
            drill.style.left = '50%';
            drill.style.transform = 'translateX(-50%)';
            
            updateDisplay();
        }
        
        function showValuePopup(cell, value, color = '#ffd700') {
            const popup = document.createElement('div');
            popup.style.position = 'absolute';
            popup.style.color = color;
            popup.style.fontSize = '14px';
            popup.style.fontWeight = 'bold';
            popup.style.pointerEvents = 'none';
            popup.style.animation = 'scoreFloat 1s ease-out';
            popup.textContent = '+' + value;
            
            const cellRect = cell.getBoundingClientRect();
            const fieldRect = document.getElementById('miningField').getBoundingClientRect();
            
            popup.style.left = (cellRect.left - fieldRect.left + 10) + 'px';
            popup.style.top = (cellRect.top - fieldRect.top) + 'px';
            
            document.getElementById('miningField').appendChild(popup);
            
            setTimeout(() => popup.remove(), 1000);
        }
        
        function upgradeDrill(type) {
            const costs = {
                power: 100 * drillPower,
                efficiency: 150 * drillEfficiency
            };
            
            const cost = costs[type];
            
            if (money >= cost) {
                money -= cost;
                
                if (type === 'power') {
                    drillPower++;
                } else if (type === 'efficiency') {
                    drillEfficiency++;
                }
                
                updateDisplay();
            } else {
                alert('金币不足！');
            }
        }
        
        function buyEnergy() {
            if (money >= 50) {
                money -= 50;
                energy = Math.min(100, energy + 30);
                updateDisplay();
            } else {
                alert('金币不足！');
            }
        }
        
        function nextLayer() {
            if (money >= 200) {
                money -= 200;
                currentLayer++;
                depth = 0;
                createMiningField();
                updateDisplay();
            } else {
                alert('金币不足！');
            }
        }
        
        function startGame() {
            gameRunning = true;
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
        }
        
        function resetGame() {
            gameRunning = false;
            money = 0;
            energy = 100;
            depth = 0;
            totalValue = 0;
            drillPower = 1;
            drillEfficiency = 1;
            currentLayer = 0;
            miningProgress = 0;
            
            createMiningField();
            updateDisplay();
        }
        
        function updateDisplay() {
            document.getElementById('money').textContent = money;
            document.getElementById('energy').textContent = energy;
            document.getElementById('depth').textContent = depth;
            document.getElementById('totalValue').textContent = totalValue;
            
            // Update upgrade button costs
            const upgradeButtons = document.querySelectorAll('.upgrade-btn');
            upgradeButtons[0].textContent = `提升力量 (${100 * drillPower}金)`;
            upgradeButtons[1].textContent = `提升效率 (${150 * drillEfficiency}金)`;
            upgradeButtons[3].textContent = `下一层 (${200 + currentLayer * 100}金)`;
        }
        
        initGame();
    </script>
</body>
</html>
