<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字迷阵 - Number Maze</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .game-header {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header-item {
            text-align: center;
        }
        .header-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        .maze-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        .maze-grid {
            display: grid;
            gap: 2px;
            max-width: 500px;
            margin: 0 auto;
            background: #333;
            padding: 10px;
            border-radius: 10px;
        }
        .maze-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .cell-wall {
            background: #2c3e50;
            color: #34495e;
            cursor: not-allowed;
        }
        .cell-path {
            background: #ecf0f1;
            color: #2c3e50;
        }
        .cell-start {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }
        .cell-end {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }
        .cell-player {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.7);
            animation: playerPulse 1.5s ease-in-out infinite;
        }
        .cell-visited {
            background: rgba(155, 89, 182, 0.6);
            color: white;
        }
        .cell-number {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
            font-weight: bold;
        }
        .cell-collected {
            background: rgba(46, 204, 113, 0.3);
            color: #27ae60;
        }
        @keyframes playerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .path-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.6), transparent);
            border-radius: 4px;
            animation: pathRipple 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes pathRipple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .difficulty {
            margin: 20px 0;
        }
        .difficulty button {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
        }
        .difficulty button.active {
            border-color: #ffd700;
            background: rgba(255,215,0,0.3);
        }
        .objective {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #ffd700;
        }
        .win-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .direction-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
            margin: 20px auto;
        }
        .direction-btn {
            padding: 15px;
            font-size: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .direction-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .direction-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 数字迷阵 Number Maze</h1>
        
        <div class="game-header">
            <div class="header-item">
                <div>已收集</div>
                <div class="header-value" id="collected">0</div>
            </div>
            <div class="header-item">
                <div>目标数字</div>
                <div class="header-value" id="target">1</div>
            </div>
            <div class="header-item">
                <div>步数</div>
                <div class="header-value" id="steps">0</div>
            </div>
            <div class="header-item">
                <div>等级</div>
                <div class="header-value" id="level">1</div>
            </div>
        </div>
        
        <div class="objective">
            <strong>目标：</strong> 按数字顺序收集数字，然后到达终点。当前需要收集: <span id="nextNumber" style="color: #ffd700;">1</span>
        </div>
        
        <div class="difficulty">
            <button class="btn active" onclick="setDifficulty('easy')">简单 (8x8)</button>
            <button class="btn" onclick="setDifficulty('medium')">中等 (10x10)</button>
            <button class="btn" onclick="setDifficulty('hard')">困难 (12x12)</button>
        </div>
        
        <div class="maze-container">
            <div id="mazeGrid" class="maze-grid"></div>
        </div>
        
        <div class="direction-buttons">
            <div></div>
            <button class="direction-btn" onclick="movePlayer('up')">↑</button>
            <div></div>
            <button class="direction-btn" onclick="movePlayer('left')">←</button>
            <button class="direction-btn" onclick="movePlayer('down')">↓</button>
            <button class="direction-btn" onclick="movePlayer('right')">→</button>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="generateMaze()">生成新迷阵</button>
            <button class="btn" onclick="resetPlayer()">重置位置</button>
            <button class="btn" onclick="showSolution()">显示提示</button>
        </div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-top: 20px; backdrop-filter: blur(10px);">
            <h3>🎮 游玩方法:</h3>
            <p>• 使用方向键或点击按钮移动</p>
            <p>• 按照数字顺序 1, 2, 3... 收集数字</p>
            <p>• 收集完所有数字后到达红色终点</p>
            <p>• 不能穿过灰色墙壁</p>
            <p>• 尽量用最少的步数完成挑战</p>
        </div>
        
        <a href="../index.html" style="color: #ffd700; text-decoration: none; margin-top: 20px; display: inline-block;">← 返回游戏列表</a>
    </div>
    
    <div id="winModal" class="win-modal">
        <h2>🎉 恭喜通关！</h2>
        <p id="winMessage"></p>
        <button class="btn" onclick="nextLevel()">下一关</button>
        <button class="btn" onclick="hideWinModal()">继续游戏</button>
    </div>

    <script>
        let game = {
            maze: [],
            playerPos: { x: 0, y: 0 },
            startPos: { x: 0, y: 0 },
            endPos: { x: 0, y: 0 },
            numbers: [],
            collectedNumbers: [],
            targetNumber: 1,
            steps: 0,
            level: 1,
            difficulty: 'easy',
            size: 8,
            visited: []
        };
        
        const difficulties = {
            easy: { size: 8, numbers: 5 },
            medium: { size: 10, numbers: 8 },
            hard: { size: 12, numbers: 12 }
        };
        
        function setDifficulty(level) {
            game.difficulty = level;
            game.size = difficulties[level].size;
            
            document.querySelectorAll('.difficulty .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            generateMaze();
        }
        
        function generateMaze() {
            const size = game.size;
            game.maze = [];
            game.numbers = [];
            game.collectedNumbers = [];
            game.targetNumber = 1;
            game.steps = 0;
            game.visited = [];
            
            // 初始化迷阵（全部为墙）
            for (let i = 0; i < size; i++) {
                game.maze[i] = [];
                for (let j = 0; j < size; j++) {
                    game.maze[i][j] = 'wall';
                }
            }
            
            // 生成迷阵路径（简化算法）
            generateMazePaths();
            
            // 设置起点和终点
            game.startPos = findRandomPath();
            game.endPos = findRandomPath();
            while (game.endPos.x === game.startPos.x && game.endPos.y === game.startPos.y) {
                game.endPos = findRandomPath();
            }
            
            game.maze[game.startPos.y][game.startPos.x] = 'start';
            game.maze[game.endPos.y][game.endPos.x] = 'end';
            
            // 放置数字
            placeNumbers();
            
            // 设置玩家位置
            game.playerPos = { ...game.startPos };
            
            renderMaze();
            updateDisplay();
        }
        
        function generateMazePaths() {
            const size = game.size;
            
            // 简化版本：随机生成一些路径
            for (let i = 1; i < size - 1; i += 2) {
                for (let j = 1; j < size - 1; j += 2) {
                    game.maze[i][j] = 'path';
                    
                    // 随机连接相邻路径
                    if (Math.random() < 0.7) {
                        if (j + 2 < size - 1) {
                            game.maze[i][j + 1] = 'path';
                        }
                    }
                    if (Math.random() < 0.7) {
                        if (i + 2 < size - 1) {
                            game.maze[i + 1][j] = 'path';
                        }
                    }
                }
            }
            
            // 确保连通性
            ensureConnectivity();
        }
        
        function ensureConnectivity() {
            // 简化版本：保证有足够的路径
            const size = game.size;
            for (let i = 1; i < size - 1; i++) {
                if (Math.random() < 0.3) {
                    for (let j = 1; j < size - 1; j++) {
                        if (Math.random() < 0.4) {
                            game.maze[i][j] = 'path';
                        }
                    }
                }
            }
        }
        
        function findRandomPath() {
            const paths = [];
            for (let i = 0; i < game.size; i++) {
                for (let j = 0; j < game.size; j++) {
                    if (game.maze[i][j] === 'path') {
                        paths.push({ x: j, y: i });
                    }
                }
            }
            return paths[Math.floor(Math.random() * paths.length)];
        }
        
        function placeNumbers() {
            const numberCount = difficulties[game.difficulty].numbers;
            const paths = [];
            
            for (let i = 0; i < game.size; i++) {
                for (let j = 0; j < game.size; j++) {
                    if (game.maze[i][j] === 'path') {
                        paths.push({ x: j, y: i });
                    }
                }
            }
            
            // 随机选择位置放置数字
            for (let i = 1; i <= numberCount; i++) {
                if (paths.length === 0) break;
                
                const randomIndex = Math.floor(Math.random() * paths.length);
                const pos = paths[randomIndex];
                
                game.numbers.push({ number: i, x: pos.x, y: pos.y, collected: false });
                game.maze[pos.y][pos.x] = 'number';
                
                paths.splice(randomIndex, 1);
            }
        }
        
        function renderMaze() {
            const mazeGrid = document.getElementById('mazeGrid');
            mazeGrid.innerHTML = '';
            mazeGrid.style.gridTemplateColumns = `repeat(${game.size}, 1fr)`;
            
            for (let i = 0; i < game.size; i++) {
                for (let j = 0; j < game.size; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'maze-cell';
                    cell.dataset.x = j;
                    cell.dataset.y = i;
                    
                    // 设置单元格类型
                    if (game.playerPos.x === j && game.playerPos.y === i) {
                        cell.classList.add('cell-player');
                        cell.textContent = '🚀';
                    } else if (game.maze[i][j] === 'wall') {
                        cell.classList.add('cell-wall');
                    } else if (game.maze[i][j] === 'start') {
                        cell.classList.add('cell-start');
                        cell.textContent = '🏁';
                    } else if (game.maze[i][j] === 'end') {
                        cell.classList.add('cell-end');
                        cell.textContent = '🎯';
                    } else if (game.maze[i][j] === 'number') {
                        const numberObj = game.numbers.find(n => n.x === j && n.y === i);
                        if (numberObj && !numberObj.collected) {
                            cell.classList.add('cell-number');
                            cell.textContent = numberObj.number;
                        } else {
                            cell.classList.add('cell-collected');
                            cell.textContent = '✓';
                        }
                    } else {
                        cell.classList.add('cell-path');
                    }
                    
                    // 显示访问过的路径
                    if (game.visited.some(v => v.x === j && v.y === i) && 
                        !(game.playerPos.x === j && game.playerPos.y === i)) {
                        if (cell.classList.contains('cell-path')) {
                            cell.classList.add('cell-visited');
                        }
                    }
                    
                    mazeGrid.appendChild(cell);
                }
            }
        }
        
        function movePlayer(direction) {
            let newX = game.playerPos.x;
            let newY = game.playerPos.y;
            
            switch(direction) {
                case 'up': newY--; break;
                case 'down': newY++; break;
                case 'left': newX--; break;
                case 'right': newX++; break;
            }
            
            // 检查边界和墙壁
            if (newX < 0 || newX >= game.size || newY < 0 || newY >= game.size ||
                game.maze[newY][newX] === 'wall') {
                return;
            }
            
            // 记录访问路径
            if (!game.visited.some(v => v.x === game.playerPos.x && v.y === game.playerPos.y)) {
                game.visited.push({ x: game.playerPos.x, y: game.playerPos.y });
            }
            
            // 移动玩家
            game.playerPos.x = newX;
            game.playerPos.y = newY;
            game.steps++;
            
            // 检查是否收集数字
            checkNumberCollection();
            
            // 检查是否到达终点
            checkWinCondition();
            
            renderMaze();
            updateDisplay();
            
            // 添加移动效果
            addMoveEffect();
        }
        
        function checkNumberCollection() {
            const numberObj = game.numbers.find(n => 
                n.x === game.playerPos.x && 
                n.y === game.playerPos.y && 
                !n.collected
            );
            
            if (numberObj && numberObj.number === game.targetNumber) {
                numberObj.collected = true;
                game.collectedNumbers.push(numberObj.number);
                game.targetNumber++;
                
                // 显示收集效果
                showCollectionEffect();
            }
        }
        
        function checkWinCondition() {
            if (game.playerPos.x === game.endPos.x && 
                game.playerPos.y === game.endPos.y &&
                game.collectedNumbers.length === game.numbers.length) {
                
                showWinModal();
            }
        }
        
        function showWinModal() {
            const winMessage = document.getElementById('winMessage');
            winMessage.innerHTML = `
                <p>等级 ${game.level} 完成！</p>
                <p>步数: ${game.steps}</p>
                <p>收集数字: ${game.collectedNumbers.length}/${game.numbers.length}</p>
            `;
            
            document.getElementById('winModal').style.display = 'block';
        }
        
        function nextLevel() {
            game.level++;
            hideWinModal();
            generateMaze();
        }
        
        function hideWinModal() {
            document.getElementById('winModal').style.display = 'none';
        }
        
        function addMoveEffect() {
            const playerCell = document.querySelector(`[data-x="${game.playerPos.x}"][data-y="${game.playerPos.y}"]`);
            const effect = document.createElement('div');
            effect.className = 'path-effect';
            playerCell.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 600);
        }
        
        function showCollectionEffect() {
            const playerCell = document.querySelector(`[data-x="${game.playerPos.x}"][data-y="${game.playerPos.y}"]`);
            playerCell.style.animation = 'none';
            setTimeout(() => {
                playerCell.style.animation = 'playerPulse 1.5s ease-in-out infinite';
            }, 10);
        }
        
        function resetPlayer() {
            game.playerPos = { ...game.startPos };
            game.steps = 0;
            game.visited = [];
            game.collectedNumbers = [];
            game.targetNumber = 1;
            
            // 重置数字收集状态
            game.numbers.forEach(num => {
                num.collected = false;
            });
            
            renderMaze();
            updateDisplay();
        }
        
        function showSolution() {
            // 简单提示：高亮下一个目标数字
            const targetNum = game.numbers.find(n => n.number === game.targetNumber && !n.collected);
            if (targetNum) {
                const targetCell = document.querySelector(`[data-x="${targetNum.x}"][data-y="${targetNum.y}"]`);
                targetCell.style.boxShadow = '0 0 30px rgba(255, 215, 0, 0.8)';
                
                setTimeout(() => {
                    targetCell.style.boxShadow = '';
                }, 3000);
            }
        }
        
        function updateDisplay() {
            document.getElementById('collected').textContent = game.collectedNumbers.length;
            document.getElementById('target').textContent = game.numbers.length;
            document.getElementById('steps').textContent = game.steps;
            document.getElementById('level').textContent = game.level;
            document.getElementById('nextNumber').textContent = game.targetNumber;
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    movePlayer('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    movePlayer('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    movePlayer('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    movePlayer('right');
                    break;
            }
        });
        
        // 初始化游戏
        generateMaze();
    </script>
</body>
</html>
