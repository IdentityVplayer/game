<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #8B4513 0%, #D2B48C 50%, #F5DEB3 100%);
            min-height: 100vh;
        }

        h1 {
            color: #2F4F4F;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 0;
            background: #DEB887;
            border: 3px solid #8B4513;
            margin: 20px auto;
            position: relative;
        }

        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid #8B4513;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .stone {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #333;
            cursor: default;
        }

        .stone.black {
            background: radial-gradient(circle, #2F2F2F, #000);
        }

        .stone.white {
            background: radial-gradient(circle, #F5F5F5, #DCDCDC);
        }

        .cell:hover:empty::after {
            content: '';
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            position: absolute;
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            color: #2F4F4F;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #8B4513, #D2B48C);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .status {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>⚫ 五子棋</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div class="status" id="status">黑方先手</div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="undo()">悔棋</button>
            <button onclick="showRules()">游戏规则</button>
        </div>
    </div>

    <script>
        class Gomoku {
            constructor() {
                this.board = Array(15).fill(null).map(() => Array(15).fill(null));
                this.currentPlayer = 'black';
                this.gameOver = false;
                this.moveHistory = [];
                
                this.initBoard();
                this.updateStatus();
            }

            initBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < 15; row++) {
                    for (let col = 0; col < 15; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        cell.onclick = () => this.makeMove(row, col);
                        
                        const stone = this.board[row][col];
                        if (stone) {
                            const stoneElement = document.createElement('div');
                            stoneElement.className = `stone ${stone}`;
                            cell.appendChild(stoneElement);
                        }
                        
                        boardElement.appendChild(cell);
                    }
                }
            }

            makeMove(row, col) {
                if (this.gameOver || this.board[row][col]) return;
                
                this.board[row][col] = this.currentPlayer;
                this.moveHistory.push({row, col, player: this.currentPlayer});
                
                this.initBoard();
                
                if (this.checkWin(row, col)) {
                    this.gameOver = true;
                    this.updateStatus();
                    return;
                }
                
                this.currentPlayer = this.currentPlayer === 'black' ? 'white' : 'black';
                this.updateStatus();
            }

            checkWin(row, col) {
                const directions = [
                    [0, 1],   // 水平
                    [1, 0],   // 垂直
                    [1, 1],   // 对角线
                    [1, -1]   // 反对角线
                ];
                
                for (let [dx, dy] of directions) {
                    let count = 1;
                    
                    // 向前计数
                    for (let i = 1; i < 5; i++) {
                        const newRow = row + dx * i;
                        const newCol = col + dy * i;
                        if (newRow >= 0 && newRow < 15 && newCol >= 0 && newCol < 15 &&
                            this.board[newRow][newCol] === this.currentPlayer) {
                            count++;
                        } else {
                            break;
                        }
                    }
                    
                    // 向后计数
                    for (let i = 1; i < 5; i++) {
                        const newRow = row - dx * i;
                        const newCol = col - dy * i;
                        if (newRow >= 0 && newRow < 15 && newCol >= 0 && newCol < 15 &&
                            this.board[newRow][newCol] === this.currentPlayer) {
                            count++;
                        } else {
                            break;
                        }
                    }
                    
                    if (count >= 5) {
                        return true;
                    }
                }
                
                return false;
            }

            updateStatus() {
                const status = document.getElementById('status');
                if (this.gameOver) {
                    status.textContent = `游戏结束！${this.currentPlayer === 'black' ? '黑方' : '白方'}获胜！`;
                    status.style.background = '#FFD700';
                } else {
                    status.textContent = this.currentPlayer === 'black' ? '黑方回合' : '白方回合';
                    status.style.background = this.currentPlayer === 'black' ? '#E6E6E6' : '#F5F5F5';
                }
            }
        }

        let game;

        function newGame() {
            game = new Gomoku();
        }

        function undo() {
            if (game.moveHistory.length > 0) {
                const lastMove = game.moveHistory.pop();
                game.board[lastMove.row][lastMove.col] = null;
                game.currentPlayer = lastMove.player;
                game.gameOver = false;
                game.initBoard();
                game.updateStatus();
            }
        }

        function showRules() {
            alert(`五子棋规则：\n1. 黑方先手\n2. 在棋盘交叉点放置棋子\n3. 率先连成5子的一方获胜\n4. 连成的5子可以是横、竖、斜任意方向\n5. 超过5子也算获胜`);
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
