<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恶魔猎人</title>
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #4a6741); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #e74c3c; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .demon-field { width: 100%; height: 400px; background: linear-gradient(180deg, #8b4513, #654321); border-radius: 10px; position: relative; overflow: hidden; }
        .hunter { width: 60px; height: 60px; background: #ff6b35; border-radius: 50%; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); cursor: move; }
        .demon { width: 40px; height: 40px; background: #8b0000; border-radius: 50%; position: absolute; animation: demonMove 3s linear infinite; }
        .bullet { width: 8px; height: 20px; background: #ffd700; position: absolute; }
        .score { font-size: 1.5em; margin-bottom: 20px; }
        .controls { margin: 20px 0; }
        .btn { background: #e74c3c; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #c0392b; }
        @keyframes demonMove { 0% { top: -40px; } 100% { top: 400px; } }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">恶魔猎人</h1>
        <div class="game-category">#射击游戏</div>
        
        <div class="game-area">
            <div class="score" id="score">得分: 0</div>
            <div class="demon-field" id="demonField">
                <div class="hunter" id="hunter"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 使用鼠标左右移动控制恶魔猎人</p>
            <p>• 点击鼠标或按空格键发射子弹</p>
            <p>• 击中恶魔获得分数</p>
            <p>• 避免让恶魔到达底部</p>
            <p>• 挑战更高分数，成为顶级恶魔猎人！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let gameRunning = false;
        let demons = [];
        let bullets = [];
        
        const hunter = document.getElementById('hunter');
        const field = document.getElementById('demonField');
        const scoreDisplay = document.getElementById('score');
        
        function startGame() {
            gameRunning = true;
            gameLoop();
            spawnDemons();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            demons = [];
            bullets = [];
            scoreDisplay.textContent = '得分: 0';
            field.innerHTML = '<div class="hunter" id="hunter"></div>';
        }
        
        function spawnDemons() {
            if (!gameRunning) return;
            
            const demon = document.createElement('div');
            demon.className = 'demon';
            demon.style.left = Math.random() * 760 + 'px';
            demon.style.top = '-40px';
            field.appendChild(demon);
            demons.push(demon);
            
            setTimeout(spawnDemons, 2000);
        }
        
        function shoot() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            const hunterRect = hunter.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            bullet.style.left = hunterRect.left - fieldRect.left + 26 + 'px';
            bullet.style.top = '340px';
            field.appendChild(bullet);
            bullets.push(bullet);
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move bullets
            bullets.forEach((bullet, bulletIndex) => {
                let top = parseInt(bullet.style.top);
                top -= 10;
                bullet.style.top = top + 'px';
                
                if (top < 0) {
                    bullet.remove();
                    bullets.splice(bulletIndex, 1);
                }
                
                // Check collision with demons
                demons.forEach((demon, demonIndex) => {
                    const bulletRect = bullet.getBoundingClientRect();
                    const demonRect = demon.getBoundingClientRect();
                    
                    if (bulletRect.left < demonRect.right && 
                        bulletRect.right > demonRect.left && 
                        bulletRect.top < demonRect.bottom && 
                        bulletRect.bottom > demonRect.top) {
                        
                        bullet.remove();
                        demon.remove();
                        bullets.splice(bulletIndex, 1);
                        demons.splice(demonIndex, 1);
                        score += 10;
                        scoreDisplay.textContent = '得分: ' + score;
                    }
                });
            });
            
            // Move demons
            demons.forEach((demon, index) => {
                let top = parseInt(demon.style.top);
                top += 3;
                demon.style.top = top + 'px';
                
                if (top > 400) {
                    demon.remove();
                    demons.splice(index, 1);
                }
            });
            
            setTimeout(gameLoop, 50);
        }
        
        // Hunter movement
        field.addEventListener('mousemove', (e) => {
            const fieldRect = field.getBoundingClientRect();
            let x = e.clientX - fieldRect.left - 30;
            x = Math.max(0, Math.min(x, 740));
            hunter.style.left = x + 'px';
        });
        
        // Shooting
        field.addEventListener('click', shoot);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
    </script>
</body>
</html>
