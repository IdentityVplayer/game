<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光线弹球</title>
    <style>
        body { background: linear-gradient(135deg, #0f0f23, #16213e); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #00cec9; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .light-field { width: 500px; height: 600px; background: linear-gradient(180deg, #1a1a2e, #16213e); border-radius: 10px; margin: 0 auto; position: relative; overflow: hidden; border: 2px solid #00cec9; }
        .paddle { width: 80px; height: 12px; background: linear-gradient(90deg, #00cec9, #74b9ff); border-radius: 6px; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 15px #00cec9; }
        .ball { width: 12px; height: 12px; background: radial-gradient(circle, #00cec9, #74b9ff); border-radius: 50%; position: absolute; box-shadow: 0 0 15px #00cec9; }
        .brick { width: 48px; height: 20px; border-radius: 4px; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .brick.level1 { background: linear-gradient(45deg, #ff7675, #e84393); box-shadow: 0 0 10px #ff7675; }
        .brick.level2 { background: linear-gradient(45deg, #fdcb6e, #e17055); box-shadow: 0 0 10px #fdcb6e; }
        .brick.level3 { background: linear-gradient(45deg, #00b894, #00cec9); box-shadow: 0 0 10px #00b894; }
        .brick.level4 { background: linear-gradient(45deg, #a29bfe, #6c5ce7); box-shadow: 0 0 10px #a29bfe; }
        .brick.indestructible { background: linear-gradient(45deg, #2d3436, #636e72); box-shadow: 0 0 10px #636e72; }
        .power-up { width: 20px; height: 20px; border-radius: 50%; position: absolute; animation: fall 4s linear; }
        .power-up.expand { background: radial-gradient(circle, #00b894, #00cec9); }
        .power-up.multi { background: radial-gradient(circle, #a29bfe, #6c5ce7); }
        .power-up.laser { background: radial-gradient(circle, #e17055, #ff7675); }
        .laser-beam { width: 3px; height: 600px; background: linear-gradient(180deg, #e17055, #ff7675); position: absolute; box-shadow: 0 0 10px #e17055; }
        .particle { width: 3px; height: 3px; background: #00cec9; border-radius: 50%; position: absolute; pointer-events: none; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #00cec9; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #00b894; }
        @keyframes fall { 0% { top: 0; } 100% { top: 600px; } }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">光线弹球</h1>
        <div class="game-category">#经典游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>得分: <span id="score">0</span></div>
                <div>生命: <span id="lives">3</span></div>
                <div>等级: <span id="level">1</span></div>
            </div>
            
            <div class="light-field" id="lightField">
                <div class="paddle" id="paddle"></div>
                <div class="ball" id="ball"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 使用左右方向键或AD键控制光线挡板</p>
            <p>• 也可以使用鼠标移动控制挡板</p>
            <p>• 用光球击破所有彩色光线方块</p>
            <p>• 红色(1点): 10分，橙色(2点): 20分</p>
            <p>• 青色(3点): 30分，紫色(4点): 40分</p>
            <p>• 灰色方块不可被摧毁</p>
            <p>• 收集道具：绿色(扩大)、紫色(多球)、红色(激光)</p>
            <p>• 不要让光球掉下屏幕！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let paddle, ball, field;
        let balls = [];
        let bricks = [];
        let powerUps = [];
        let particles = [];
        let keys = {};
        let paddleWidth = 80;
        let laserMode = false;
        let laserTimer = 0;
        
        function initGame() {
            paddle = document.getElementById('paddle');
            ball = document.getElementById('ball');
            field = document.getElementById('lightField');
            
            resetBall();
            createBricks();
            createParticles();
        }
        
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 500 + 'px';
                particle.style.top = Math.random() * 600 + 'px';
                particle.style.animationDelay = Math.random() * 2 + 's';
                field.appendChild(particle);
                particles.push(particle);
                
                // Animate particles
                setInterval(() => {
                    particle.style.opacity = Math.random() * 0.8 + 0.2;
                }, 500);
            }
        }
        
        function createBricks() {
            bricks = [];
            field.querySelectorAll('.brick').forEach(brick => brick.remove());
            
            const rows = 8;
            const cols = 10;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const brick = document.createElement('div');
                    brick.className = 'brick';
                    
                    // Different brick types based on level and position
                    let brickLevel;
                    if (level === 1) {
                        brickLevel = row < 2 ? 4 : row < 4 ? 3 : row < 6 ? 2 : 1;
                    } else {
                        brickLevel = Math.floor(Math.random() * 4) + 1;
                        
                        // Add indestructible bricks in higher levels
                        if (level > 2 && Math.random() < 0.1) {
                            brickLevel = 'indestructible';
                        }
                    }
                    
                    brick.classList.add('level' + brickLevel);
                    if (brickLevel === 'indestructible') {
                        brick.classList.remove('levelindestructible');
                        brick.classList.add('indestructible');
                    }
                    
                    brick.style.left = (col * 50 + 2) + 'px';
                    brick.style.top = (row * 25 + 50) + 'px';
                    
                    field.appendChild(brick);
                    bricks.push({
                        element: brick,
                        x: col * 50 + 2,
                        y: row * 25 + 50,
                        width: 48,
                        height: 20,
                        level: brickLevel,
                        indestructible: brickLevel === 'indestructible'
                    });
                }
            }
        }
        
        function resetBall() {
            const ballObj = {
                element: ball,
                x: 250,
                y: 400,
                vx: 3,
                vy: -3,
                speed: 4 + level * 0.5
            };
            
            ball.style.left = ballObj.x + 'px';
            ball.style.top = ballObj.y + 'px';
            
            balls = [ballObj];
        }
        
        function startGame() {
            gameRunning = true;
            gameLoop();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            lives = 3;
            level = 1;
            paddleWidth = 80;
            laserMode = false;
            laserTimer = 0;
            
            // Clear power-ups and effects
            powerUps.forEach(powerUp => powerUp.element.remove());
            powerUps = [];
            
            field.querySelectorAll('.laser-beam').forEach(beam => beam.remove());
            
            // Reset paddle
            paddle.style.width = paddleWidth + 'px';
            paddle.style.left = '50%';
            paddle.style.background = 'linear-gradient(90deg, #00cec9, #74b9ff)';
            
            resetBall();
            createBricks();
            updateDisplay();
        }
        
        function fireLaser() {
            if (!laserMode) return;
            
            const paddleRect = paddle.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            const laser = document.createElement('div');
            laser.className = 'laser-beam';
            laser.style.left = (paddleRect.left - fieldRect.left + paddleWidth / 2) + 'px';
            laser.style.top = '0px';
            
            field.appendChild(laser);
            
            // Check laser collision with bricks
            const laserX = paddleRect.left - fieldRect.left + paddleWidth / 2;
            
            bricks.forEach((brick, index) => {
                if (!brick.indestructible && 
                    laserX >= brick.x && laserX <= brick.x + brick.width) {
                    
                    // Destroy brick
                    brick.element.remove();
                    bricks.splice(index, 1);
                    
                    const points = {
                        1: 10, 2: 20, 3: 30, 4: 40
                    }[brick.level] || 0;
                    
                    score += points;
                    
                    // Create power-up chance
                    if (Math.random() < 0.15) {
                        createPowerUp(brick.x + 24, brick.y + 10);
                    }
                }
            });
            
            setTimeout(() => laser.remove(), 100);
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move paddle
            const paddleSpeed = 8;
            let currentX = parseInt(paddle.style.left.replace('%', '')) * 5 || 210;
            
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                currentX = Math.max(0, currentX - paddleSpeed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                currentX = Math.min(500 - paddleWidth, currentX + paddleSpeed);
            }
            
            paddle.style.left = (currentX / 5) + '%';
            
            // Handle laser mode
            if (laserMode) {
                laserTimer--;
                if (laserTimer <= 0) {
                    laserMode = false;
                    paddle.style.background = 'linear-gradient(90deg, #00cec9, #74b9ff)';
                }
            }
            
            // Move balls
            balls.forEach((ballObj, ballIndex) => {
                ballObj.x += ballObj.vx;
                ballObj.y += ballObj.vy;
                
                // Ball collision with walls
                if (ballObj.x <= 6 || ballObj.x >= 488) {
                    ballObj.vx *= -1;
                }
                if (ballObj.y <= 6) {
                    ballObj.vy *= -1;
                }
                
                // Ball collision with paddle
                if (ballObj.y >= 540 && ballObj.y <= 560 && 
                    ballObj.x >= currentX && ballObj.x <= currentX + paddleWidth) {
                    ballObj.vy = -Math.abs(ballObj.vy);
                    
                    // Add angle based on hit position
                    const hitPos = (ballObj.x - currentX) / paddleWidth;
                    ballObj.vx = (hitPos - 0.5) * 8;
                }
                
                // Ball falls below paddle
                if (ballObj.y > 600) {
                    if (balls.length > 1) {
                        ballObj.element.remove();
                        balls.splice(ballIndex, 1);
                    } else {
                        lives--;
                        if (lives <= 0) {
                            alert('游戏结束！最终得分: ' + score);
                            resetGame();
                            return;
                        }
                        resetBall();
                    }
                }
                
                // Ball collision with bricks
                bricks.forEach((brick, brickIndex) => {
                    if (ballObj.x + 6 > brick.x && ballObj.x - 6 < brick.x + brick.width &&
                        ballObj.y + 6 > brick.y && ballObj.y - 6 < brick.y + brick.height) {
                        
                        if (!brick.indestructible) {
                            ballObj.vy *= -1;
                            
                            // Multi-hit bricks
                            if (brick.level > 1) {
                                brick.level--;
                                brick.element.className = 'brick level' + brick.level;
                            } else {
                                // Remove brick
                                brick.element.remove();
                                bricks.splice(brickIndex, 1);
                                
                                const points = { 1: 10, 2: 20, 3: 30, 4: 40 }[brick.level] || 0;
                                score += points;
                                
                                // Create power-up chance
                                if (Math.random() < 0.1) {
                                    createPowerUp(brick.x + 24, brick.y + 10);
                                }
                            }
                        } else {
                            ballObj.vy *= -1;
                        }
                        
                        // Check level completion
                        const destructibleBricks = bricks.filter(b => !b.indestructible);
                        if (destructibleBricks.length === 0) {
                            level++;
                            createBricks();
                            resetBall();
                        }
                    }
                });
                
                ballObj.element.style.left = ballObj.x + 'px';
                ballObj.element.style.top = ballObj.y + 'px';
            });
            
            // Move power-ups
            powerUps.forEach((powerUp, index) => {
                powerUp.y += 3;
                powerUp.element.style.top = powerUp.y + 'px';
                
                // Check collision with paddle
                if (powerUp.y >= 540 && powerUp.y <= 570 &&
                    powerUp.x >= currentX && powerUp.x <= currentX + paddleWidth) {
                    
                    activatePowerUp(powerUp.type);
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                }
                
                // Remove power-ups that fall off screen
                if (powerUp.y > 600) {
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                }
            });
            
            updateDisplay();
            setTimeout(gameLoop, 16);
        }
        
        function createPowerUp(x, y) {
            const types = ['expand', 'multi', 'laser'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const powerUp = document.createElement('div');
            powerUp.className = 'power-up ' + type;
            powerUp.style.left = x + 'px';
            powerUp.style.top = y + 'px';
            
            switch (type) {
                case 'expand':
                    powerUp.textContent = '↔️';
                    break;
                case 'multi':
                    powerUp.textContent = '⚙️';
                    break;
                case 'laser':
                    powerUp.textContent = '⚡';
                    break;
            }
            
            powerUp.style.fontSize = '16px';
            powerUp.style.display = 'flex';
            powerUp.style.alignItems = 'center';
            powerUp.style.justifyContent = 'center';
            
            field.appendChild(powerUp);
            powerUps.push({
                element: powerUp,
                x: x,
                y: y,
                type: type
            });
        }
        
        function activatePowerUp(type) {
            switch (type) {
                case 'expand':
                    paddleWidth = Math.min(120, paddleWidth + 20);
                    paddle.style.width = paddleWidth + 'px';
                    break;
                    
                case 'multi':
                    if (balls.length < 3) {
                        const originalBall = balls[0];
                        for (let i = 0; i < 2; i++) {
                            const newBall = document.createElement('div');
                            newBall.className = 'ball';
                            field.appendChild(newBall);
                            
                            const newBallObj = {
                                element: newBall,
                                x: originalBall.x,
                                y: originalBall.y,
                                vx: originalBall.vx * (i === 0 ? 1.2 : -1.2),
                                vy: originalBall.vy,
                                speed: originalBall.speed
                            };
                            
                            balls.push(newBallObj);
                        }
                    }
                    break;
                    
                case 'laser':
                    laserMode = true;
                    laserTimer = 300; // 5 seconds at 60fps
                    paddle.style.background = 'linear-gradient(90deg, #e17055, #ff7675)';
                    break;
            }
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space' && laserMode) {
                e.preventDefault();
                fireLaser();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Mouse control
        field.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            
            const rect = field.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const paddleX = Math.max(0, Math.min(500 - paddleWidth, mouseX - paddleWidth / 2));
            
            paddle.style.left = (paddleX / 5) + '%';
        });
        
        field.addEventListener('click', () => {
            if (laserMode) fireLaser();
        });
        
        initGame();
    </script>
</body>
</html>
