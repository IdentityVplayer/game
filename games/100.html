<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极挑战 - 第100个游戏</title>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2, #ff6b6b, #ffd93d, #6bcf7f); font-family: 'Arial', sans-serif; margin: 0; color: white; overflow: hidden; animation: backgroundShift 10s ease-in-out infinite; }
        .game-container { max-width: 1000px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 4em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: titleGlow 3s ease-in-out infinite; }
        .game-category { color: #ffd700; font-size: 1.5em; margin-bottom: 20px; font-weight: bold; }
        .celebration { font-size: 1.2em; color: #ff6b6b; margin-bottom: 20px; animation: celebrate 2s ease-in-out infinite; }
        .game-area { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 30px; margin: 20px 0; border: 3px solid #ffd700; }
        .ultimate-field { width: 100%; height: 600px; background: linear-gradient(45deg, #0c0c0c, #1a1a2e, #16213e, #0f3460); border-radius: 10px; position: relative; overflow: hidden; border: 2px solid #ffd700; }
        .player { width: 50px; height: 50px; background: radial-gradient(circle, #00cec9, #74b9ff); border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px #00cec9; }
        .challenge { position: absolute; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .challenge:hover { transform: scale(1.1); }
        .challenge.memory { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .challenge.reaction { background: linear-gradient(45deg, #f39c12, #e67e22); }
        .challenge.puzzle { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
        .challenge.skill { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .challenge.boss { background: linear-gradient(45deg, #34495e, #2c3e50); width: 100px; height: 100px; }
        .firework { position: absolute; width: 4px; height: 4px; border-radius: 50%; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.3em; font-weight: bold; }
        .controls { margin: 20px 0; }
        .btn { background: linear-gradient(45deg, #ffd700, #ffed4e); color: #333; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 10px; cursor: pointer; margin: 5px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn:hover { background: linear-gradient(45deg, #ffed4e, #ffd700); transform: translateY(-2px); }
        .achievement { position: fixed; top: 20px; right: 20px; background: rgba(255,215,0,0.9); color: #333; padding: 15px; border-radius: 10px; font-weight: bold; transform: translateX(100%); transition: transform 0.5s ease; }
        .achievement.show { transform: translateX(0); }
        .progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24); transition: width 0.5s ease; }
        @keyframes backgroundShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes titleGlow { 0%, 100% { text-shadow: 0 0 20px #ffd700; } 50% { text-shadow: 0 0 40px #ff6b6b, 0 0 60px #4ecdc4; } }
        @keyframes celebrate { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .how-to-play { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; border: 2px solid #ffd700; }
        .mini-game { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 3px solid #ffd700; display: none; }
        .sequence-display { display: flex; gap: 10px; margin: 20px 0; }
        .sequence-btn { width: 50px; height: 50px; border-radius: 10px; border: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">终极挑战</h1>
        <div class="game-category">#第100个游戏 - 终极挑战</div>
        <div class="celebration">🎉 恭喜你达到第100个游戏！这是终极挑战！ 🎉</div>
        
        <div class="game-area">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            
            <div class="stats">
                <div>得分: <span id="score">0</span></div>
                <div>关卡: <span id="level">1</span></div>
                <div>生命: <span id="lives">5</span></div>
                <div>成就: <span id="achievements">0</span>/10</div>
            </div>
            
            <div class="ultimate-field" id="ultimateField">
                <div class="player" id="player">🎆</div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startUltimateChallenge()">开始终极挑战</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <!-- Mini-game modal -->
        <div class="mini-game" id="miniGame">
            <h3 id="miniGameTitle">挑战开始</h3>
            <div id="miniGameContent"></div>
            <button class="btn" onclick="closeMiniGame()">关闭</button>
        </div>
        
        <!-- Achievement notification -->
        <div class="achievement" id="achievement">
            <div id="achievementText">成就解锁！</div>
        </div>
        
        <div class="how-to-play">
            <h3>终极挑战说明：</h3>
            <p>• 这是第100个游戏，集合了所有游戏类型的终极挑战！</p>
            <p>• 使用WASD键或方向键控制角色移动</p>
            <p>• 🔴 红色挑战：记忆力游戏 - 记住序列并重复</p>
            <p>• 🟠 黄色挑战：反应力游戏 - 在限定时间内点击</p>
            <p>• 🟣 紫色挑战：解谜游戏 - 解决数学问题</p>
            <p>• 🟢 绿色挑战：技巧游戏 - 精准控制</p>
            <p>• ⬛ BOSS挑战：终极BOSS战斗</p>
            <p>• 完成所有挑战获得成就，成为终极游戏大师！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let level = 1;
        let lives = 5;
        let achievementCount = 0;
        let gameRunning = false;
        let player, field;
        let challenges = [];
        let keys = {};
        let currentChallenge = null;
        let fireworks = [];
        
        // Player position
        let playerX = 500;
        let playerY = 300;
        
        // Challenge types
        const challengeTypes = {
            memory: { color: '#e74c3c', emoji: '🧠', name: '记忆力挑战' },
            reaction: { color: '#f39c12', emoji: '⚡', name: '反应力挑战' },
            puzzle: { color: '#9b59b6', emoji: '🧩', name: '解谜挑战' },
            skill: { color: '#2ecc71', emoji: '🎯', name: '技巧挑战' },
            boss: { color: '#34495e', emoji: '🐉', name: 'BOSS挑战' }
        };
        
        // Achievements
        const achievements = [
            '新手上路', '记忆大师', '闪电侠', '解谜专家', '技巧大师',
            'BOSS克星', '连击高手', '完美主义', '挑战者', '终极大师'
        ];
        
        function initGame() {
            player = document.getElementById('player');
            field = document.getElementById('ultimateField');
            createFireworks();
        }
        
        function createFireworks() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 1000 + 'px';
                    firework.style.top = Math.random() * 600 + 'px';
                    firework.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    field.appendChild(firework);
                    
                    fireworks.push(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                        const index = fireworks.indexOf(firework);
                        if (index > -1) fireworks.splice(index, 1);
                    }, 2000);
                    
                    createFireworks();
                }, Math.random() * 3000 + 1000);
            }
        }
        
        function createChallenges() {
            // Clear existing challenges
            challenges.forEach(challenge => challenge.element.remove());
            challenges = [];
            
            const challengeTypesArray = Object.keys(challengeTypes);
            const challengeCount = Math.min(5, 2 + level);
            
            for (let i = 0; i < challengeCount; i++) {
                const type = challengeTypesArray[Math.floor(Math.random() * challengeTypesArray.length)];
                const challengeData = challengeTypes[type];
                
                const challenge = document.createElement('div');
                challenge.className = 'challenge ' + type;
                challenge.style.left = (100 + Math.random() * 700) + 'px';
                challenge.style.top = (50 + Math.random() * 450) + 'px';
                challenge.style.width = type === 'boss' ? '100px' : '80px';
                challenge.style.height = type === 'boss' ? '100px' : '60px';
                challenge.textContent = challengeData.emoji;
                
                challenge.addEventListener('click', () => startChallenge(type));
                
                field.appendChild(challenge);
                
                challenges.push({
                    element: challenge,
                    type: type,
                    x: parseInt(challenge.style.left),
                    y: parseInt(challenge.style.top),
                    completed: false
                });
            }
        }
        
        function startChallenge(type) {
            currentChallenge = type;
            const challengeData = challengeTypes[type];
            
            document.getElementById('miniGameTitle').textContent = challengeData.name;
            document.getElementById('miniGame').style.display = 'block';
            
            switch (type) {
                case 'memory':
                    startMemoryChallenge();
                    break;
                case 'reaction':
                    startReactionChallenge();
                    break;
                case 'puzzle':
                    startPuzzleChallenge();
                    break;
                case 'skill':
                    startSkillChallenge();
                    break;
                case 'boss':
                    startBossChallenge();
                    break;
            }
        }
        
        function startMemoryChallenge() {
            const sequence = [];
            const sequenceLength = 3 + Math.floor(level / 2);
            
            for (let i = 0; i < sequenceLength; i++) {
                sequence.push(Math.floor(Math.random() * 4));
            }
            
            const content = document.getElementById('miniGameContent');
            content.innerHTML = `
                <p>记住以下序列，然后重复：</p>
                <div class="sequence-display" id="sequenceDisplay"></div>
                <div class="sequence-display" id="inputButtons"></div>
                <p id="memoryResult"></p>
            `;
            
            const display = document.getElementById('sequenceDisplay');
            const inputDiv = document.getElementById('inputButtons');
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
            
            // Show sequence
            sequence.forEach((colorIndex, i) => {
                const btn = document.createElement('div');
                btn.className = 'sequence-btn';
                btn.style.background = colors[colorIndex];
                btn.style.animation = `celebrate ${0.5 + i * 0.2}s ease-in-out`;
                display.appendChild(btn);
            });
            
            // Create input buttons
            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'sequence-btn';
                btn.style.background = color;
                btn.onclick = () => checkMemoryInput(index, sequence);
                inputDiv.appendChild(btn);
            });
            
            window.memoryInput = [];
        }
        
        function checkMemoryInput(colorIndex, sequence) {
            window.memoryInput.push(colorIndex);
            
            if (window.memoryInput.length === sequence.length) {
                const correct = window.memoryInput.every((input, i) => input === sequence[i]);
                
                if (correct) {
                    document.getElementById('memoryResult').textContent = '正确！+100分';
                    score += 100;
                    completeChallenge();
                } else {
                    document.getElementById('memoryResult').textContent = '错误！请重试';
                    window.memoryInput = [];
                }
            }
        }
        
        function startReactionChallenge() {
            const content = document.getElementById('miniGameContent');
            content.innerHTML = `
                <p>在绿色出现时尽快点击！</p>
                <div style="width: 200px; height: 200px; background: #e74c3c; margin: 20px auto; border-radius: 10px; cursor: pointer;" id="reactionBox"></div>
                <p id="reactionResult"></p>
            `;
            
            const box = document.getElementById('reactionBox');
            const result = document.getElementById('reactionResult');
            
            setTimeout(() => {
                box.style.background = '#2ecc71';
                const startTime = Date.now();
                
                box.onclick = () => {
                    const reactionTime = Date.now() - startTime;
                    if (reactionTime < 500) {
                        result.textContent = `反应时间: ${reactionTime}ms - 快如闪电！+150分`;
                        score += 150;
                        completeChallenge();
                    } else {
                        result.textContent = `反应时间: ${reactionTime}ms - 太慢了！`;
                        lives--;
                    }
                };
            }, Math.random() * 3000 + 1000);
        }
        
        function startPuzzleChallenge() {
            const a = Math.floor(Math.random() * 20) + 1;
            const b = Math.floor(Math.random() * 20) + 1;
            const operations = ['+', '-', '*'];
            const op = operations[Math.floor(Math.random() * operations.length)];
            
            let answer;
            switch (op) {
                case '+':
                    answer = a + b;
                    break;
                case '-':
                    answer = a - b;
                    break;
                case '*':
                    answer = a * b;
                    break;
            }
            
            const content = document.getElementById('miniGameContent');
            content.innerHTML = `
                <p>解决以下数学问题：</p>
                <h2>${a} ${op} ${b} = ?</h2>
                <input type="number" id="puzzleAnswer" style="padding: 10px; font-size: 18px; border-radius: 5px; border: 2px solid #ffd700;">
                <button onclick="checkPuzzleAnswer(${answer})" class="btn">提交</button>
                <p id="puzzleResult"></p>
            `;
        }
        
        function checkPuzzleAnswer(correctAnswer) {
            const userAnswer = parseInt(document.getElementById('puzzleAnswer').value);
            const result = document.getElementById('puzzleResult');
            
            if (userAnswer === correctAnswer) {
                result.textContent = '正确！你是数学天才！+120分';
                score += 120;
                completeChallenge();
            } else {
                result.textContent = '错误！请重试';
            }
        }
        
        function startSkillChallenge() {
            const content = document.getElementById('miniGameContent');
            content.innerHTML = `
                <p>在移动的目标中心点击！</p>
                <div style="width: 300px; height: 200px; background: #2c3e50; margin: 20px auto; border-radius: 10px; position: relative;" id="skillArea">
                    <div style="width: 20px; height: 20px; background: #e74c3c; border-radius: 50%; position: absolute; cursor: pointer;" id="movingTarget"></div>
                </div>
                <p id="skillResult"></p>
            `;
            
            const target = document.getElementById('movingTarget');
            const area = document.getElementById('skillArea');
            const result = document.getElementById('skillResult');
            
            let hits = 0;
            const targetCount = 5;
            
            function moveTarget() {
                target.style.left = Math.random() * 280 + 'px';
                target.style.top = Math.random() * 180 + 'px';
            }
            
            target.onclick = () => {
                hits++;
                if (hits >= targetCount) {
                    result.textContent = `完成！精准射击！+200分`;
                    score += 200;
                    completeChallenge();
                } else {
                    result.textContent = `命中 ${hits}/${targetCount}`;
                    moveTarget();
                }
            };
            
            moveTarget();
            setInterval(moveTarget, 1500);
        }
        
        function startBossChallenge() {
            const content = document.getElementById('miniGameContent');
            content.innerHTML = `
                <p>终极BOSS挑战！点击BOSS 10次来击败它！</p>
                <div style="width: 150px; height: 150px; background: #34495e; margin: 20px auto; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 60px;" id="bossTarget">🐉</div>
                <p id="bossResult">血量: 10/10</p>
            `;
            
            const boss = document.getElementById('bossTarget');
            const result = document.getElementById('bossResult');
            let bossHealth = 10;
            
            boss.onclick = () => {
                bossHealth--;
                result.textContent = `血量: ${bossHealth}/10`;
                
                if (bossHealth <= 0) {
                    result.textContent = 'BOSS被击败！传说成就！+500分';
                    score += 500;
                    completeChallenge();
                    unlockAchievement('BOSS克星');
                }
            };
        }
        
        function completeChallenge() {
            // Mark challenge as completed
            const challenge = challenges.find(c => c.type === currentChallenge);
            if (challenge) {
                challenge.completed = true;
                challenge.element.style.opacity = '0.3';
                challenge.element.style.pointerEvents = 'none';
            }
            
            // Check if all challenges completed
            const completedChallenges = challenges.filter(c => c.completed).length;
            const progressPercentage = (completedChallenges / challenges.length) * 100;
            document.getElementById('progressFill').style.width = progressPercentage + '%';
            
            if (completedChallenges === challenges.length) {
                level++;
                if (level <= 10) {
                    setTimeout(() => {
                        alert(`关卡 ${level - 1} 完成！进入下一关卡！`);
                        createChallenges();
                    }, 1000);
                } else {
                    setTimeout(() => {
                        alert('恭喜你！你已经完成了所有100个游戏！\n你是真正的游戏大师！\n\n最终得分: ' + score + '\n获得成就: ' + achievementCount + '/10\n\n感谢游玩！');
                        unlockAchievement('终极大师');
                    }, 1000);
                }
            }
            
            setTimeout(() => {
                closeMiniGame();
            }, 2000);
        }
        
        function closeMiniGame() {
            document.getElementById('miniGame').style.display = 'none';
            currentChallenge = null;
        }
        
        function unlockAchievement(name) {
            if (!achievements.includes(name)) return;
            
            achievementCount++;
            document.getElementById('achievementText').textContent = `成就解锁: ${name}`;
            document.getElementById('achievement').classList.add('show');
            
            setTimeout(() => {
                document.getElementById('achievement').classList.remove('show');
            }, 3000);
        }
        
        function startUltimateChallenge() {
            gameRunning = true;
            score = 0;
            level = 1;
            lives = 5;
            achievementCount = 0;
            
            createChallenges();
            gameLoop();
            
            unlockAchievement('新手上路');
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            level = 1;
            lives = 5;
            achievementCount = 0;
            playerX = 500;
            playerY = 300;
            
            challenges.forEach(challenge => challenge.element.remove());
            challenges = [];
            
            closeMiniGame();
            updateDisplay();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Handle player movement
            const speed = 4;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                playerX = Math.max(25, playerX - speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                playerX = Math.min(975, playerX + speed);
            }
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                playerY = Math.max(25, playerY - speed);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                playerY = Math.min(575, playerY + speed);
            }
            
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            
            // Check proximity to challenges
            challenges.forEach(challenge => {
                if (!challenge.completed) {
                    const distance = Math.sqrt(
                        Math.pow(playerX - challenge.x, 2) + 
                        Math.pow(playerY - challenge.y, 2)
                    );
                    
                    if (distance < 50) {
                        challenge.element.style.boxShadow = '0 0 30px #ffd700';
                    } else {
                        challenge.element.style.boxShadow = 'none';
                    }
                }
            });
            
            updateDisplay();
            setTimeout(gameLoop, 16);
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
            document.getElementById('achievements').textContent = achievementCount;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Global functions for mini-games
        window.checkPuzzleAnswer = checkPuzzleAnswer;
        
        initGame();
    </script>
</body>
</html>
