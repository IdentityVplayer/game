<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法塔防</title>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #9b59b6; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .tower-field { width: 100%; height: 500px; background: linear-gradient(180deg, #228b22, #006400); border-radius: 10px; position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; }
        .cell { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
        .path { background: #8b4513; }
        .tower { background: #4a90e2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .enemy { width: 30px; height: 30px; background: #e74c3c; border-radius: 50%; position: absolute; z-index: 10; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #9b59b6; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #8e44ad; }
        .tower-shop { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tower-btn { background: #3498db; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .tower-btn:hover { background: #2980b9; }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">魔法塔防</h1>
        <div class="game-category">#策略游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>生命值: <span id="health">20</span></div>
                <div>金币: <span id="money">100</span></div>
                <div>波次: <span id="wave">1</span></div>
            </div>
            
            <div class="tower-shop">
                <div class="tower-btn" onclick="selectTower('basic')">基础塔 (20金)</div>
                <div class="tower-btn" onclick="selectTower('ice')">冰霜塔 (40金)</div>
                <div class="tower-btn" onclick="selectTower('fire')">火焰塔 (60金)</div>
            </div>
            
            <div class="tower-field" id="towerField"></div>
            
            <div class="controls">
                <button class="btn" onclick="startWave()">开始波次</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 在塔防商店中选择防御塔类型</p>
            <p>• 点击绿色区域放置防御塔</p>
            <p>• 基础塔：攻击力中等，射程适中</p>
            <p>• 冰霜塔：减缓敌人移动速度</p>
            <p>• 火焰塔：群体伤害，攻击力高</p>
            <p>• 阻止敌人到达终点，保护你的基地！</p>
        </div>
    </div>
    
    <script>
        let health = 20;
        let money = 100;
        let wave = 1;
        let gameRunning = false;
        let selectedTower = null;
        let towers = [];
        let enemies = [];
        let grid = [];
        
        const field = document.getElementById('towerField');
        
        // Initialize grid
        function initGrid() {
            grid = [];
            field.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                grid[row] = [];
                for (let col = 0; col < 10; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // Create path
                    if ((row === 4 && col < 9) || (col === 8 && row > 4)) {
                        cell.classList.add('path');
                        grid[row][col] = 'path';
                    } else {
                        grid[row][col] = 'empty';
                        cell.addEventListener('click', () => placeTower(row, col));
                    }
                    
                    field.appendChild(cell);
                }
            }
        }
        
        function selectTower(type) {
            selectedTower = type;
        }
        
        function placeTower(row, col) {
            if (!selectedTower || grid[row][col] !== 'empty') return;
            
            const costs = { basic: 20, ice: 40, fire: 60 };
            if (money < costs[selectedTower]) return;
            
            const cell = field.children[row * 10 + col];
            cell.className = 'cell tower';
            cell.textContent = selectedTower === 'basic' ? '🏹' : selectedTower === 'ice' ? '❄️' : '🔥';
            
            towers.push({ row, col, type: selectedTower });
            money -= costs[selectedTower];
            grid[row][col] = 'tower';
            
            updateDisplay();
        }
        
        function startWave() {
            gameRunning = true;
            spawnEnemies();
            gameLoop();
        }
        
        function spawnEnemies() {
            if (!gameRunning) return;
            
            for (let i = 0; i < wave + 2; i++) {
                setTimeout(() => {
                    const enemy = document.createElement('div');
                    enemy.className = 'enemy';
                    enemy.style.left = '0px';
                    enemy.style.top = '250px';
                    field.appendChild(enemy);
                    
                    enemies.push({
                        element: enemy,
                        hp: wave * 10,
                        maxHp: wave * 10,
                        x: 0,
                        y: 4,
                        pathIndex: 0
                    });
                }, i * 1000);
            }
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move enemies
            enemies.forEach((enemy, index) => {
                moveEnemy(enemy);
                
                if (enemy.x >= 9 && enemy.y >= 7) {
                    enemy.element.remove();
                    enemies.splice(index, 1);
                    health--;
                    updateDisplay();
                    
                    if (health <= 0) {
                        alert('游戏结束！');
                        resetGame();
                        return;
                    }
                }
            });
            
            // Tower attacks
            towers.forEach(tower => {
                attackEnemies(tower);
            });
            
            // Check wave completion
            if (enemies.length === 0 && gameRunning) {
                wave++;
                money += 50;
                updateDisplay();
                setTimeout(() => {
                    if (gameRunning) spawnEnemies();
                }, 2000);
            }
            
            setTimeout(gameLoop, 100);
        }
        
        function moveEnemy(enemy) {
            if (enemy.x < 8) {
                enemy.x += 0.05;
            } else if (enemy.y < 7) {
                enemy.y += 0.05;
            }
            
            enemy.element.style.left = enemy.x * 90 + 30 + 'px';
            enemy.element.style.top = enemy.y * 62.5 + 15 + 'px';
        }
        
        function attackEnemies(tower) {
            enemies.forEach((enemy, index) => {
                const distance = Math.sqrt(
                    Math.pow(tower.col - enemy.x, 2) + 
                    Math.pow(tower.row - enemy.y, 2)
                );
                
                if (distance <= 2) {
                    const damage = tower.type === 'fire' ? 25 : tower.type === 'ice' ? 15 : 20;
                    enemy.hp -= damage;
                    
                    if (enemy.hp <= 0) {
                        enemy.element.remove();
                        enemies.splice(index, 1);
                        money += 10;
                        updateDisplay();
                    }
                }
            });
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function resetGame() {
            gameRunning = false;
            health = 20;
            money = 100;
            wave = 1;
            towers = [];
            enemies = [];
            selectedTower = null;
            
            field.innerHTML = '';
            initGrid();
            updateDisplay();
        }
        
        function updateDisplay() {
            document.getElementById('health').textContent = health;
            document.getElementById('money').textContent = money;
            document.getElementById('wave').textContent = wave;
        }
        
        initGrid();
    </script>
</body>
</html>
