<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冠军俄罗斯方块 3025</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #96CEB4, #45B7D1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #F7DC6F, #98D8C8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameCanvas {
            border: 3px solid #333;
            background: #000;
            margin: 20px 0;
        }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>冠军俄罗斯方块 3025</h1>
        
        <canvas id="gameCanvas" width="320" height="640"></canvas>
        <div class="score">得分: <span id="score">0</span></div>
        <div class="score">级别: <span id="level">1</span></div>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <button class="btn" onclick="pauseGame()">暂停</button>
        
    </div>
    
    <script>
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 32;
        
        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0;
        let level = 1;
        let gameRunning = false;
        let currentPiece = null;
        
        const PIECES = [
            [[[1,1,1,1]]], // I
            [[[1,1],[1,1]]], // O
            [[[0,1,0],[1,1,1]]], // T
            [[[0,1,1],[1,1,0]]], // S
            [[[1,1,0],[0,1,1]]], // Z
            [[[1,0,0],[1,1,1]]], // J
            [[[0,0,1],[1,1,1]]]  // L
        ];
        
        const COLORS = ['#4ECDC4', '#98D8C8', '#DDA0DD', '#45B7D1', '#FFEAA7', '#BB8FCE', '#FFEAA7'];
        
        class Piece {
            constructor() {
                this.shape = PIECES[Math.floor(Math.random() * PIECES.length)][0];
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.x = Math.floor(COLS / 2) - Math.floor(this.shape[0].length / 2);
                this.y = 0;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            ctx.fillRect(
                                (this.x + col) * BLOCK_SIZE,
                                (this.y + row) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
            }
            
            canMove(dx, dy) {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            const newX = this.x + col + dx;
                            const newY = this.y + row + dy;
                            
                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return false;
                            }
                            
                            if (newY >= 0 && board[newY][newX]) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }
            
            move(dx, dy) {
                if (this.canMove(dx, dy)) {
                    this.x += dx;
                    this.y += dy;
                    return true;
                }
                return false;
            }
            
            place() {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            board[this.y + row][this.x + col] = this.color;
                        }
                    }
                }
            }
        }
        
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        ctx.fillStyle = board[row][col];
                        ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }
        }
        
        function clearLines() {
            let linesCleared = 0;
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++; // Check the same row again
                }
            }
            
            if (linesCleared > 0) {
                score += linesCleared * 100 * level;
                level = Math.floor(score / 1000) + 1;
                updateUI();
            }
        }
        
        function gameOver() {
            gameRunning = false;
            alert('游戏结束！得分: ' + score);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            if (!currentPiece.move(0, 1)) {
                currentPiece.place();
                clearLines();
                currentPiece = new Piece();
                
                if (!currentPiece.canMove(0, 0)) {
                    gameOver();
                    return;
                }
            }
            
            drawBoard();
            currentPiece.draw();
            
            setTimeout(gameLoop, Math.max(50, 500 - level * 50));
        }
        
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                currentPiece = new Piece();
                gameLoop();
            }
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) {
                gameLoop();
            }
        }
        
        document.addEventListener('keydown', function(e) {
            if (!gameRunning || !currentPiece) return;
            
            switch(e.code) {
                case 'ArrowLeft':
                    currentPiece.move(-1, 0);
                    break;
                case 'ArrowRight':
                    currentPiece.move(1, 0);
                    break;
                case 'ArrowDown':
                    currentPiece.move(0, 1);
                    break;
                case 'Space':
                    while (currentPiece.move(0, 1)) {}
                    break;
            }
        });
        
        updateUI();
        
    </script>
</body>
</html>
