<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法丁星</title>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #9b59b6; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .magic-field { width: 500px; height: 600px; background: linear-gradient(180deg, #1a1a2e, #16213e); border-radius: 10px; margin: 0 auto; position: relative; overflow: hidden; }
        .player-paddle { width: 100px; height: 15px; background: linear-gradient(90deg, #e74c3c, #c0392b); border-radius: 8px; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); }
        .ball { width: 15px; height: 15px; background: radial-gradient(circle, #f39c12, #e67e22); border-radius: 50%; position: absolute; box-shadow: 0 0 15px #f39c12; }
        .brick { width: 60px; height: 25px; border-radius: 5px; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .brick.red { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .brick.blue { background: linear-gradient(45deg, #3498db, #2980b9); }
        .brick.green { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .brick.yellow { background: linear-gradient(45deg, #f1c40f, #f39c12); }
        .brick.purple { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
        .brick.orange { background: linear-gradient(45deg, #e67e22, #d35400); }
        .brick.special { background: linear-gradient(45deg, #fd79a8, #e84393); animation: sparkle 1s infinite; }
        .power-up { width: 20px; height: 20px; border-radius: 50%; position: absolute; animation: fall 3s linear; }
        .power-up.expand { background: #2ecc71; }
        .power-up.speed { background: #e74c3c; }
        .power-up.multi { background: #9b59b6; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #9b59b6; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #8e44ad; }
        @keyframes sparkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fall { 0% { top: 0; } 100% { top: 600px; } }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">魔法丁星</h1>
        <div class="game-category">#经典游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>得分: <span id="score">0</span></div>
                <div>生命: <span id="lives">3</span></div>
                <div>等级: <span id="level">1</span></div>
            </div>
            
            <div class="magic-field" id="magicField">
                <div class="player-paddle" id="paddle"></div>
                <div class="ball" id="ball"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 使用左右方向键或AD键控制挡板</p>
            <p>• 也可以使用鼠标移动控制挡板</p>
            <p>• 用小球击破所有的彩色方块</p>
            <p>• 不同颜色的方块有不同的分数</p>
            <p>• 收集掉落的道具获得特殊能力</p>
            <p>• 绿色: 扩大挡板，红色: 加速球，紫色: 多球</p>
            <p>• 不要让小球掉下屏幕！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let paddle, ball, field;
        let balls = [];
        let bricks = [];
        let powerUps = [];
        let keys = {};
        let paddleWidth = 100;
        
        function initGame() {
            paddle = document.getElementById('paddle');
            ball = document.getElementById('ball');
            field = document.getElementById('magicField');
            
            resetBall();
            createBricks();
        }
        
        function createBricks() {
            bricks = [];
            field.querySelectorAll('.brick').forEach(brick => brick.remove());
            
            const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
            const rows = 6;
            const cols = 7;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const brick = document.createElement('div');
                    brick.className = 'brick';
                    
                    // Special bricks for higher levels
                    if (level > 2 && Math.random() < 0.1) {
                        brick.classList.add('special');
                        brick.textContent = '✨';
                    } else {
                        const color = colors[row % colors.length];
                        brick.classList.add(color);
                    }
                    
                    brick.style.left = (col * 70 + 10) + 'px';
                    brick.style.top = (row * 35 + 50) + 'px';
                    
                    field.appendChild(brick);
                    bricks.push({
                        element: brick,
                        x: col * 70 + 10,
                        y: row * 35 + 50,
                        width: 60,
                        height: 25,
                        points: (rows - row) * 10,
                        special: brick.classList.contains('special')
                    });
                }
            }
        }
        
        function resetBall() {
            const ballObj = {
                element: ball,
                x: 250,
                y: 400,
                vx: 3,
                vy: -3,
                speed: 3 + level * 0.5
            };
            
            ball.style.left = ballObj.x + 'px';
            ball.style.top = ballObj.y + 'px';
            
            balls = [ballObj];
        }
        
        function startGame() {
            gameRunning = true;
            gameLoop();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            lives = 3;
            level = 1;
            paddleWidth = 100;
            
            // Clear power-ups
            powerUps.forEach(powerUp => powerUp.element.remove());
            powerUps = [];
            
            // Reset paddle
            paddle.style.width = paddleWidth + 'px';
            paddle.style.left = '50%';
            
            resetBall();
            createBricks();
            updateDisplay();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move paddle
            const paddleSpeed = 8;
            let currentX = parseInt(paddle.style.left.replace('%', '')) * 5 || 200;
            
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                currentX = Math.max(0, currentX - paddleSpeed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                currentX = Math.min(500 - paddleWidth, currentX + paddleSpeed);
            }
            
            paddle.style.left = (currentX / 5) + '%';
            
            // Move balls
            balls.forEach((ballObj, ballIndex) => {
                ballObj.x += ballObj.vx;
                ballObj.y += ballObj.vy;
                
                // Ball collision with walls
                if (ballObj.x <= 0 || ballObj.x >= 485) {
                    ballObj.vx *= -1;
                }
                if (ballObj.y <= 0) {
                    ballObj.vy *= -1;
                }
                
                // Ball collision with paddle
                if (ballObj.y >= 540 && ballObj.y <= 560 && 
                    ballObj.x >= currentX && ballObj.x <= currentX + paddleWidth) {
                    ballObj.vy = -Math.abs(ballObj.vy);
                    
                    // Add angle based on hit position
                    const hitPos = (ballObj.x - currentX) / paddleWidth;
                    ballObj.vx = (hitPos - 0.5) * 6;
                }
                
                // Ball falls below paddle
                if (ballObj.y > 600) {
                    if (balls.length > 1) {
                        ballObj.element.remove();
                        balls.splice(ballIndex, 1);
                    } else {
                        lives--;
                        if (lives <= 0) {
                            alert('游戏结束！最终得分: ' + score);
                            resetGame();
                            return;
                        }
                        resetBall();
                    }
                }
                
                // Ball collision with bricks
                bricks.forEach((brick, brickIndex) => {
                    if (ballObj.x + 15 > brick.x && ballObj.x < brick.x + brick.width &&
                        ballObj.y + 15 > brick.y && ballObj.y < brick.y + brick.height) {
                        
                        ballObj.vy *= -1;
                        
                        // Remove brick
                        brick.element.remove();
                        score += brick.points;
                        
                        // Special brick effects
                        if (brick.special) {
                            createPowerUp(brick.x + 30, brick.y + 12);
                        }
                        
                        bricks.splice(brickIndex, 1);
                        
                        // Check level completion
                        if (bricks.length === 0) {
                            level++;
                            createBricks();
                            resetBall();
                        }
                    }
                });
                
                ballObj.element.style.left = ballObj.x + 'px';
                ballObj.element.style.top = ballObj.y + 'px';
            });
            
            // Move power-ups
            powerUps.forEach((powerUp, index) => {
                powerUp.y += 2;
                powerUp.element.style.top = powerUp.y + 'px';
                
                // Check collision with paddle
                if (powerUp.y >= 540 && powerUp.y <= 570 &&
                    powerUp.x >= currentX && powerUp.x <= currentX + paddleWidth) {
                    
                    activatePowerUp(powerUp.type);
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                }
                
                // Remove power-ups that fall off screen
                if (powerUp.y > 600) {
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                }
            });
            
            updateDisplay();
            setTimeout(gameLoop, 20);
        }
        
        function createPowerUp(x, y) {
            const types = ['expand', 'speed', 'multi'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const powerUp = document.createElement('div');
            powerUp.className = 'power-up ' + type;
            powerUp.style.left = x + 'px';
            powerUp.style.top = y + 'px';
            
            switch (type) {
                case 'expand':
                    powerUp.textContent = '↔️';
                    break;
                case 'speed':
                    powerUp.textContent = '⚡';
                    break;
                case 'multi':
                    powerUp.textContent = '⚙️';
                    break;
            }
            
            field.appendChild(powerUp);
            powerUps.push({
                element: powerUp,
                x: x,
                y: y,
                type: type
            });
        }
        
        function activatePowerUp(type) {
            switch (type) {
                case 'expand':
                    paddleWidth = Math.min(150, paddleWidth + 20);
                    paddle.style.width = paddleWidth + 'px';
                    break;
                    
                case 'speed':
                    balls.forEach(ballObj => {
                        ballObj.speed *= 1.2;
                        ballObj.vx *= 1.1;
                        ballObj.vy *= 1.1;
                    });
                    break;
                    
                case 'multi':
                    if (balls.length < 3) {
                        const originalBall = balls[0];
                        const newBall = document.createElement('div');
                        newBall.className = 'ball';
                        field.appendChild(newBall);
                        
                        const newBallObj = {
                            element: newBall,
                            x: originalBall.x,
                            y: originalBall.y,
                            vx: -originalBall.vx,
                            vy: originalBall.vy,
                            speed: originalBall.speed
                        };
                        
                        balls.push(newBallObj);
                    }
                    break;
            }
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Mouse control
        field.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            
            const rect = field.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const paddleX = Math.max(0, Math.min(500 - paddleWidth, mouseX - paddleWidth / 2));
            
            paddle.style.left = (paddleX / 5) + '%';
        });
        
        initGame();
    </script>
</body>
</html>
