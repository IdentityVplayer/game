<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法方块</title>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #9b59b6; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .magic-field { width: 400px; height: 500px; background: linear-gradient(180deg, #2c3e50, #34495e); border-radius: 10px; margin: 0 auto; position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; }
        .block { width: 100%; height: 100%; border-radius: 3px; transition: all 0.3s ease; }
        .block.red { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .block.blue { background: linear-gradient(45deg, #3498db, #2980b9); }
        .block.green { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .block.yellow { background: linear-gradient(45deg, #f1c40f, #f39c12); }
        .block.purple { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
        .block.orange { background: linear-gradient(45deg, #e67e22, #d35400); }
        .block.empty { background: transparent; }
        .block.selected { box-shadow: 0 0 15px #fff; transform: scale(1.1); }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #9b59b6; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #8e44ad; }
        .power-ups { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .power-btn { background: #e74c3c; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
        .power-btn:hover { background: #c0392b; }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">魔法方块</h1>
        <div class="game-category">#益智游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>得分: <span id="score">0</span></div>
                <div>等级: <span id="level">1</span></div>
                <div>移动次数: <span id="moves">30</span></div>
            </div>
            
            <div class="power-ups">
                <div class="power-btn" onclick="usePowerUp('bomb')">炸弹 (3)</div>
                <div class="power-btn" onclick="usePowerUp('rainbow')">彩虹 (2)</div>
                <div class="power-btn" onclick="usePowerUp('shuffle')">洗牌 (1)</div>
            </div>
            
            <div class="magic-field" id="magicField"></div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
                <button class="btn" onclick="hintMove()">提示</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 点击两个相邻的方块交换位置</p>
            <p>• 连接三个或更多相同颜色的方块可消除</p>
            <p>• 消除越多方块得分越高</p>
            <p>• 炸弹：消除周围一圈的方块</p>
            <p>• 彩虹：可与任意颜色匹配</p>
            <p>• 洗牌：重新打乱所有方块位置</p>
            <p>• 在有限的移动次数内获得最高分数！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let level = 1;
        let moves = 30;
        let gameRunning = false;
        let selectedBlock = null;
        let grid = [];
        let powerUps = { bomb: 3, rainbow: 2, shuffle: 1 };
        
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
        const field = document.getElementById('magicField');
        
        function initGame() {
            createGrid();
            updateDisplay();
        }
        
        function createGrid() {
            field.innerHTML = '';
            grid = [];
            
            for (let row = 0; row < 10; row++) {
                grid[row] = [];
                for (let col = 0; col < 8; col++) {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.dataset.row = row;
                    block.dataset.col = col;
                    
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    block.classList.add(color);
                    grid[row][col] = color;
                    
                    block.addEventListener('click', () => selectBlock(row, col, block));
                    field.appendChild(block);
                }
            }
            
            // Remove initial matches
            removeInitialMatches();
        }
        
        function removeInitialMatches() {
            let hasMatches = true;
            while (hasMatches) {
                hasMatches = false;
                
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 8; col++) {
                        if (checkMatches(row, col).length > 0) {
                            grid[row][col] = colors[Math.floor(Math.random() * colors.length)];
                            hasMatches = true;
                        }
                    }
                }
            }
            
            updateGridDisplay();
        }
        
        function selectBlock(row, col, element) {
            if (!gameRunning || moves <= 0) return;
            
            if (selectedBlock) {
                selectedBlock.element.classList.remove('selected');
                
                // Check if blocks are adjacent
                const rowDiff = Math.abs(selectedBlock.row - row);
                const colDiff = Math.abs(selectedBlock.col - col);
                
                if ((rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1)) {
                    swapBlocks(selectedBlock.row, selectedBlock.col, row, col);
                }
                
                selectedBlock = null;
            } else {
                selectedBlock = { row, col, element };
                element.classList.add('selected');
            }
        }
        
        function swapBlocks(row1, col1, row2, col2) {
            // Swap in grid
            const temp = grid[row1][col1];
            grid[row1][col1] = grid[row2][col2];
            grid[row2][col2] = temp;
            
            updateGridDisplay();
            
            // Check for matches
            const matches1 = checkMatches(row1, col1);
            const matches2 = checkMatches(row2, col2);
            
            if (matches1.length > 0 || matches2.length > 0) {
                moves--;
                processMatches();
            } else {
                // Swap back if no matches
                const temp = grid[row1][col1];
                grid[row1][col1] = grid[row2][col2];
                grid[row2][col2] = temp;
                updateGridDisplay();
            }
            
            updateDisplay();
        }
        
        function checkMatches(row, col) {
            const color = grid[row][col];
            if (!color || color === 'empty') return [];
            
            let matches = [];
            
            // Check horizontal
            let horizontal = [{ row, col }];
            
            // Check left
            for (let c = col - 1; c >= 0 && grid[row][c] === color; c--) {
                horizontal.unshift({ row, col: c });
            }
            
            // Check right
            for (let c = col + 1; c < 8 && grid[row][c] === color; c++) {
                horizontal.push({ row, col: c });
            }
            
            if (horizontal.length >= 3) {
                matches = matches.concat(horizontal);
            }
            
            // Check vertical
            let vertical = [{ row, col }];
            
            // Check up
            for (let r = row - 1; r >= 0 && grid[r][col] === color; r--) {
                vertical.unshift({ row: r, col });
            }
            
            // Check down
            for (let r = row + 1; r < 10 && grid[r][col] === color; r++) {
                vertical.push({ row: r, col });
            }
            
            if (vertical.length >= 3) {
                matches = matches.concat(vertical);
            }
            
            return matches;
        }
        
        function processMatches() {
            let allMatches = [];
            
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    const matches = checkMatches(row, col);
                    allMatches = allMatches.concat(matches);
                }
            }
            
            // Remove duplicates
            allMatches = allMatches.filter((match, index, self) => 
                index === self.findIndex(m => m.row === match.row && m.col === match.col)
            );
            
            if (allMatches.length > 0) {
                // Calculate score
                score += allMatches.length * 10 * level;
                
                // Remove matches
                allMatches.forEach(match => {
                    grid[match.row][match.col] = 'empty';
                });
                
                // Drop blocks
                dropBlocks();
                
                // Fill empty spaces
                fillEmpty();
                
                updateGridDisplay();
                
                // Check for more matches
                setTimeout(() => {
                    if (hasAnyMatches()) {
                        processMatches();
                    }
                }, 300);
            }
        }
        
        function hasAnyMatches() {
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    if (checkMatches(row, col).length > 0) {
                        return true;
                    }
                }
            }
            return false;
        }
        
        function dropBlocks() {
            for (let col = 0; col < 8; col++) {
                for (let row = 9; row >= 0; row--) {
                    if (grid[row][col] === 'empty') {
                        for (let r = row - 1; r >= 0; r--) {
                            if (grid[r][col] !== 'empty') {
                                grid[row][col] = grid[r][col];
                                grid[r][col] = 'empty';
                                break;
                            }
                        }
                    }
                }
            }
        }
        
        function fillEmpty() {
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    if (grid[row][col] === 'empty') {
                        grid[row][col] = colors[Math.floor(Math.random() * colors.length)];
                    }
                }
            }
        }
        
        function updateGridDisplay() {
            const blocks = field.children;
            for (let i = 0; i < blocks.length; i++) {
                const row = Math.floor(i / 8);
                const col = i % 8;
                const block = blocks[i];
                
                // Remove all color classes
                colors.forEach(color => block.classList.remove(color));
                block.classList.remove('empty');
                
                // Add current color
                block.classList.add(grid[row][col]);
            }
        }
        
        function usePowerUp(type) {
            if (!gameRunning || powerUps[type] <= 0) return;
            
            powerUps[type]--;
            
            if (type === 'shuffle') {
                shuffleGrid();
            }
            // Other power-ups would be implemented with more complex logic
            
            updateDisplay();
        }
        
        function shuffleGrid() {
            const allColors = [];
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    if (grid[row][col] !== 'empty') {
                        allColors.push(grid[row][col]);
                    }
                }
            }
            
            // Shuffle array
            for (let i = allColors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allColors[i], allColors[j]] = [allColors[j], allColors[i]];
            }
            
            // Redistribute
            let index = 0;
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 8; col++) {
                    if (grid[row][col] !== 'empty') {
                        grid[row][col] = allColors[index++];
                    }
                }
            }
            
            updateGridDisplay();
        }
        
        function hintMove() {
            // Simple hint: find any possible match
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 7; col++) {
                    // Try swapping with right neighbor
                    const temp = grid[row][col];
                    grid[row][col] = grid[row][col + 1];
                    grid[row][col + 1] = temp;
                    
                    if (checkMatches(row, col).length > 0 || checkMatches(row, col + 1).length > 0) {
                        // Highlight hint
                        const block1 = field.children[row * 8 + col];
                        const block2 = field.children[row * 8 + col + 1];
                        
                        block1.style.border = '3px solid #fff';
                        block2.style.border = '3px solid #fff';
                        
                        setTimeout(() => {
                            block1.style.border = '';
                            block2.style.border = '';
                        }, 2000);
                        
                        // Swap back
                        grid[row][col] = grid[row][col + 1];
                        grid[row][col + 1] = temp;
                        return;
                    }
                    
                    // Swap back
                    grid[row][col] = grid[row][col + 1];
                    grid[row][col + 1] = temp;
                }
            }
        }
        
        function startGame() {
            gameRunning = true;
            score = 0;
            level = 1;
            moves = 30;
            powerUps = { bomb: 3, rainbow: 2, shuffle: 1 };
            createGrid();
            updateDisplay();
        }
        
        function resetGame() {
            gameRunning = false;
            selectedBlock = null;
            createGrid();
            updateDisplay();
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('moves').textContent = moves;
            
            if (moves <= 0) {
                alert('游戏结束！最终得分: ' + score);
                resetGame();
            }
        }
        
        initGame();
    </script>
</body>
</html>
