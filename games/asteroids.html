<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids - 太空小行星</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border: 3px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ffff;
        }

        canvas {
            background: radial-gradient(circle at center, #001122 0%, #000 70%);
            display: block;
            border-radius: 7px;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .controls {
            position: absolute;
            bottom: -80px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 7px;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #00cccc;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .game-container {
                width: 95vw;
                height: 70vh;
            }
            
            .ui {
                font-size: 14px;
            }
            
            .controls {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui">
            <div>得分: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
            <div>等级: <span id="level">1</span></div>
        </div>
        
        <div class="controls">
            <div>↑: 推进 | ←→: 转向 | 空格: 射击</div>
            <div>手机: 点击左右区域转向，点击上方推进，点击下方射击</div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <h1 style="font-size: 48px; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 20px;">ASTEROIDS</h1>
            <p style="font-size: 18px; margin-bottom: 10px;">太空小行星</p>
            <p style="font-size: 14px; color: #888; margin-bottom: 20px;">摧毁所有小行星，避免碰撞！</p>
            <button class="start-btn" onclick="startGame()">开始冒险</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;

        // 游戏对象
        let ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: 0,
            velX: 0,
            velY: 0,
            size: 8,
            thrust: false
        };

        let bullets = [];
        let asteroids = [];
        let particles = [];

        // 按键状态
        const keys = {};

        // 事件监听
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 触摸控制
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const touchY = e.touches[0].clientY - rect.top;
            
            if (touchY < canvas.height / 3) {
                // 上方 - 推进
                ship.thrust = true;
            } else if (touchY > canvas.height * 2 / 3) {
                // 下方 - 射击
                shoot();
            } else {
                // 中间 - 转向
                if (touchX < canvas.width / 2) {
                    ship.angle -= 0.2;
                } else {
                    ship.angle += 0.2;
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            ship.thrust = false;
        });

        function startGame() {
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';
            score = 0;
            lives = 3;
            level = 1;
            
            // 重置飞船
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.angle = 0;
            ship.velX = 0;
            ship.velY = 0;
            
            // 清空数组
            bullets = [];
            asteroids = [];
            particles = [];
            
            // 生成小行星
            createAsteroids();
            
            gameLoop();
        }

        function createAsteroids() {
            asteroids = [];
            const numAsteroids = 4 + level;
            
            for (let i = 0; i < numAsteroids; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 100);
                
                asteroids.push({
                    x: x,
                    y: y,
                    velX: (Math.random() - 0.5) * 2,
                    velY: (Math.random() - 0.5) * 2,
                    angle: Math.random() * Math.PI * 2,
                    angularVel: (Math.random() - 0.5) * 0.1,
                    size: 3,
                    radius: 40
                });
            }
        }

        function shoot() {
            if (bullets.length < 5) {
                bullets.push({
                    x: ship.x + Math.cos(ship.angle) * ship.size,
                    y: ship.y + Math.sin(ship.angle) * ship.size,
                    velX: Math.cos(ship.angle) * 8,
                    velY: Math.sin(ship.angle) * 8,
                    life: 60
                });
            }
        }

        function updateShip() {
            // 旋转
            if (keys['ArrowLeft']) ship.angle -= 0.15;
            if (keys['ArrowRight']) ship.angle += 0.15;
            
            // 推进
            if (keys['ArrowUp']) ship.thrust = true;
            else ship.thrust = false;
            
            // 射击
            if (keys[' ']) shoot();
            
            // 推进效果
            if (ship.thrust) {
                ship.velX += Math.cos(ship.angle) * 0.3;
                ship.velY += Math.sin(ship.angle) * 0.3;
                
                // 添加尾焰粒子
                for (let i = 0; i < 3; i++) {
                    particles.push({
                        x: ship.x - Math.cos(ship.angle) * ship.size,
                        y: ship.y - Math.sin(ship.angle) * ship.size,
                        velX: -Math.cos(ship.angle) * 2 + (Math.random() - 0.5),
                        velY: -Math.sin(ship.angle) * 2 + (Math.random() - 0.5),
                        life: 20,
                        color: '#ff6600'
                    });
                }
            }
            
            // 阻力
            ship.velX *= 0.99;
            ship.velY *= 0.99;
            
            // 移动
            ship.x += ship.velX;
            ship.y += ship.velY;
            
            // 边界环绕
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                bullet.x += bullet.velX;
                bullet.y += bullet.velY;
                bullet.life--;
                
                // 边界环绕
                if (bullet.x < 0) bullet.x = canvas.width;
                if (bullet.x > canvas.width) bullet.x = 0;
                if (bullet.y < 0) bullet.y = canvas.height;
                if (bullet.y > canvas.height) bullet.y = 0;
                
                // 生命结束
                if (bullet.life <= 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function updateAsteroids() {
            for (const asteroid of asteroids) {
                asteroid.x += asteroid.velX;
                asteroid.y += asteroid.velY;
                asteroid.angle += asteroid.angularVel;
                
                // 边界环绕
                if (asteroid.x < 0) asteroid.x = canvas.width;
                if (asteroid.x > canvas.width) asteroid.x = 0;
                if (asteroid.y < 0) asteroid.y = canvas.height;
                if (asteroid.y > canvas.height) asteroid.y = 0;
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                particle.x += particle.velX;
                particle.y += particle.velY;
                particle.life--;
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            // 子弹击中小行星
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dist = Math.hypot(bullet.x - asteroid.x, bullet.y - asteroid.y);
                    
                    if (dist < asteroid.radius) {
                        // 创建爆炸粒子
                        for (let k = 0; k < 10; k++) {
                            particles.push({
                                x: asteroid.x,
                                y: asteroid.y,
                                velX: (Math.random() - 0.5) * 4,
                                velY: (Math.random() - 0.5) * 4,
                                life: 30,
                                color: '#00ffff'
                            });
                        }
                        
                        // 分裂小行星
                        if (asteroid.size > 1) {
                            for (let k = 0; k < 2; k++) {
                                asteroids.push({
                                    x: asteroid.x,
                                    y: asteroid.y,
                                    velX: (Math.random() - 0.5) * 3,
                                    velY: (Math.random() - 0.5) * 3,
                                    angle: Math.random() * Math.PI * 2,
                                    angularVel: (Math.random() - 0.5) * 0.2,
                                    size: asteroid.size - 1,
                                    radius: asteroid.radius * 0.6
                                });
                            }
                        }
                        
                        // 加分
                        score += (4 - asteroid.size) * 20;
                        
                        // 移除子弹和小行星
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        break;
                    }
                }
            }
            
            // 飞船撞击小行星
            for (const asteroid of asteroids) {
                const dist = Math.hypot(ship.x - asteroid.x, ship.y - asteroid.y);
                if (dist < asteroid.radius + ship.size) {
                    lives--;
                    
                    // 创建爆炸效果
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: ship.x,
                            y: ship.y,
                            velX: (Math.random() - 0.5) * 6,
                            velY: (Math.random() - 0.5) * 6,
                            life: 40,
                            color: '#ff0000'
                        });
                    }
                    
                    // 重置飞船位置
                    ship.x = canvas.width / 2;
                    ship.y = canvas.height / 2;
                    ship.velX = 0;
                    ship.velY = 0;
                    
                    if (lives <= 0) {
                        endGame();
                    }
                    break;
                }
            }
        }

        function endGame() {
            gameRunning = false;
            const startScreen = document.getElementById('startScreen');
            startScreen.style.display = 'flex';
            startScreen.innerHTML = `
                <h1 style="font-size: 48px; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 20px;">游戏结束</h1>
                <p style="font-size: 24px; margin-bottom: 10px;">最终得分: ${score}</p>
                <p style="font-size: 18px; margin-bottom: 10px;">达到等级: ${level}</p>
                <button class="start-btn" onclick="startGame()">重新开始</button>
            `;
        }

        function nextLevel() {
            level++;
            score += 1000;
            createAsteroids();
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            
            // 绘制飞船
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            
            ctx.strokeStyle = ship.thrust ? '#00ffff' : '#ffffff';
            ctx.beginPath();
            ctx.moveTo(ship.size, 0);
            ctx.lineTo(-ship.size, -ship.size / 2);
            ctx.lineTo(-ship.size / 2, 0);
            ctx.lineTo(-ship.size, ship.size / 2);
            ctx.closePath();
            ctx.stroke();
            
            ctx.restore();
            
            // 绘制子弹
            ctx.fillStyle = '#ffff00';
            for (const bullet of bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制小行星
            ctx.strokeStyle = '#888888';
            for (const asteroid of asteroids) {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.angle);
                
                ctx.beginPath();
                const points = 8;
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = asteroid.radius * (0.8 + Math.sin(angle * 3) * 0.2);
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
                
                ctx.restore();
            }
            
            // 绘制粒子
            for (const particle of particles) {
                const alpha = particle.life / 30;
                ctx.fillStyle = particle.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 更新UI
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            updateShip();
            updateBullets();
            updateAsteroids();
            updateParticles();
            checkCollisions();
            
            // 检查是否清除所有小行星
            if (asteroids.length === 0) {
                nextLevel();
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 响应式调整
        function resizeCanvas() {
            if (window.innerWidth <= 768) {
                canvas.width = Math.min(600, window.innerWidth - 40);
                canvas.height = Math.min(400, window.innerHeight - 200);
            } else {
                canvas.width = 800;
                canvas.height = 600;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 初始绘制
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
