<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空中追逐</title>
    <style>
        body { background: linear-gradient(135deg, #74b9ff, #0984e3); font-family: 'Arial', sans-serif; margin: 0; color: white; overflow: hidden; }
        .game-container { max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #ffeaa7; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .sky-field { width: 100%; height: 600px; background: linear-gradient(180deg, #74b9ff, #81ecec); border-radius: 10px; position: relative; overflow: hidden; }
        .player-plane { width: 60px; height: 60px; background: #00b894; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .enemy-plane { width: 50px; height: 50px; background: #e17055; position: absolute; clip-path: polygon(50% 100%, 0% 0%, 100% 0%); }
        .missile { width: 8px; height: 20px; background: #fdcb6e; position: absolute; border-radius: 4px; }
        .cloud { width: 80px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 20px; position: absolute; }
        .power-up { width: 25px; height: 25px; background: #fd79a8; border-radius: 50%; position: absolute; }
        .explosion { width: 50px; height: 50px; background: radial-gradient(circle, #ff7675, #e17055); border-radius: 50%; position: absolute; animation: explode 0.5s ease-out; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #ffeaa7; color: #333; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #fdcb6e; }
        .radar { position: absolute; top: 20px; right: 20px; width: 100px; height: 100px; border: 2px solid #fff; border-radius: 50%; background: rgba(0,0,0,0.7); }
        .radar-dot { width: 4px; height: 4px; background: #e17055; border-radius: 50%; position: absolute; }
        @keyframes explode { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">空中追逐</h1>
        <div class="game-category">#飞行游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>得分: <span id="score">0</span></div>
                <div>生命: <span id="lives">3</span></div>
                <div>弹药: <span id="ammo">20</span></div>
                <div>速度: <span id="speed">1.0x</span></div>
            </div>
            
            <div class="sky-field" id="skyField">
                <div class="radar" id="radar"></div>
                <div class="player-plane" id="playerPlane">✈️</div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始飞行</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 使用WASD键或方向键控制飞机移动</p>
            <p>• 按空格键或点击鼠标发射导弹</p>
            <p>• 击落敌机获得分数和奖励</p>
            <p>• 收集粉色道具补充弹药和生命</p>
            <p>• 避开敌机的攻击和碰撞</p>
            <p>• 随着时间推移，游戏速度会加快</p>
            <p>• 使用右上角雷达监控敌机位置</p>
            <p>• 成为空中王牌飞行员！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let lives = 3;
        let ammo = 20;
        let speed = 1.0;
        let gameRunning = false;
        let playerPlane, field;
        let enemyPlanes = [];
        let missiles = [];
        let enemyMissiles = [];
        let clouds = [];
        let powerUps = [];
        let keys = {};
        
        function initGame() {
            playerPlane = document.getElementById('playerPlane');
            field = document.getElementById('skyField');
            createClouds();
        }
        
        function createClouds() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    if (gameRunning) {
                        const cloud = document.createElement('div');
                        cloud.className = 'cloud';
                        cloud.style.left = Math.random() * 820 + 'px';
                        cloud.style.top = '-40px';
                        cloud.style.opacity = Math.random() * 0.5 + 0.3;
                        field.appendChild(cloud);
                        
                        clouds.push({
                            element: cloud,
                            y: -40,
                            speed: 1 + Math.random()
                        });
                    }
                    createClouds();
                }, Math.random() * 3000 + 2000);
            }
        }
        
        function startGame() {
            gameRunning = true;
            gameLoop();
            spawnEnemies();
            spawnPowerUps();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) {
                gameLoop();
                spawnEnemies();
                spawnPowerUps();
            }
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            lives = 3;
            ammo = 20;
            speed = 1.0;
            
            // Clear all objects
            enemyPlanes.forEach(plane => plane.element.remove());
            missiles.forEach(missile => missile.element.remove());
            enemyMissiles.forEach(missile => missile.element.remove());
            powerUps.forEach(powerUp => powerUp.element.remove());
            
            enemyPlanes = [];
            missiles = [];
            enemyMissiles = [];
            powerUps = [];
            
            // Reset player position
            playerPlane.style.left = '50%';
            playerPlane.style.bottom = '50px';
            
            updateDisplay();
        }
        
        function spawnEnemies() {
            if (!gameRunning) return;
            
            const enemy = document.createElement('div');
            enemy.className = 'enemy-plane';
            enemy.style.left = Math.random() * 850 + 'px';
            enemy.style.top = '-50px';
            enemy.textContent = '✈️';
            enemy.style.fontSize = '40px';
            enemy.style.display = 'flex';
            enemy.style.alignItems = 'center';
            enemy.style.justifyContent = 'center';
            enemy.style.transform = 'rotate(180deg)';
            
            field.appendChild(enemy);
            
            enemyPlanes.push({
                element: enemy,
                x: parseInt(enemy.style.left),
                y: -50,
                speed: 2 + speed,
                lastShot: Date.now()
            });
            
            const spawnRate = Math.max(1500 - speed * 200, 500);
            setTimeout(spawnEnemies, spawnRate);
        }
        
        function spawnPowerUps() {
            if (!gameRunning) return;
            
            if (Math.random() < 0.3) {
                const powerUp = document.createElement('div');
                powerUp.className = 'power-up';
                powerUp.style.left = Math.random() * 875 + 'px';
                powerUp.style.top = '-25px';
                powerUp.textContent = Math.random() < 0.5 ? '💫' : '❤️';
                powerUp.style.fontSize = '20px';
                powerUp.style.display = 'flex';
                powerUp.style.alignItems = 'center';
                powerUp.style.justifyContent = 'center';
                
                field.appendChild(powerUp);
                
                powerUps.push({
                    element: powerUp,
                    x: parseInt(powerUp.style.left),
                    y: -25,
                    type: powerUp.textContent === '💫' ? 'ammo' : 'life',
                    speed: 3
                });
            }
            
            setTimeout(spawnPowerUps, 5000);
        }
        
        function shoot() {
            if (ammo <= 0) return;
            
            ammo--;
            
            const missile = document.createElement('div');
            missile.className = 'missile';
            
            const planeRect = playerPlane.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            missile.style.left = (planeRect.left - fieldRect.left + 26) + 'px';
            missile.style.bottom = '110px';
            
            field.appendChild(missile);
            
            missiles.push({
                element: missile,
                x: planeRect.left - fieldRect.left + 26,
                y: 490
            });
        }
        
        function enemyShoot(enemy) {
            const missile = document.createElement('div');
            missile.className = 'missile';
            missile.style.background = '#e17055';
            missile.style.left = (enemy.x + 21) + 'px';
            missile.style.top = (enemy.y + 50) + 'px';
            
            field.appendChild(missile);
            
            enemyMissiles.push({
                element: missile,
                x: enemy.x + 21,
                y: enemy.y + 50
            });
        }
        
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = x + 'px';
            explosion.style.top = y + 'px';
            field.appendChild(explosion);
            
            setTimeout(() => explosion.remove(), 500);
        }
        
        function updateRadar() {
            const radar = document.getElementById('radar');
            radar.innerHTML = '';
            
            enemyPlanes.forEach(enemy => {
                const dot = document.createElement('div');
                dot.className = 'radar-dot';
                
                const radarX = (enemy.x / 900) * 96 + 2;
                const radarY = (enemy.y / 600) * 96 + 2;
                
                dot.style.left = radarX + 'px';
                dot.style.top = radarY + 'px';
                
                radar.appendChild(dot);
            });
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move player plane
            const planeSpeed = 6;
            let currentX = parseInt(playerPlane.style.left.replace('%', '')) * 9 || 450;
            let currentY = parseInt(playerPlane.style.bottom.replace('px', '')) || 50;
            
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                currentX = Math.max(0, currentX - planeSpeed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                currentX = Math.min(840, currentX + planeSpeed);
            }
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                currentY = Math.min(550, currentY + planeSpeed);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                currentY = Math.max(0, currentY - planeSpeed);
            }
            
            playerPlane.style.left = (currentX / 9) + '%';
            playerPlane.style.bottom = currentY + 'px';
            
            // Move clouds
            clouds.forEach((cloud, index) => {
                cloud.y += cloud.speed;
                cloud.element.style.top = cloud.y + 'px';
                
                if (cloud.y > 600) {
                    cloud.element.remove();
                    clouds.splice(index, 1);
                }
            });
            
            // Move enemy planes
            enemyPlanes.forEach((enemy, index) => {
                enemy.y += enemy.speed;
                enemy.element.style.top = enemy.y + 'px';
                
                // Enemy shooting
                if (Date.now() - enemy.lastShot > 2000 && Math.random() < 0.02) {
                    enemyShoot(enemy);
                    enemy.lastShot = Date.now();
                }
                
                // Remove enemies that go off screen
                if (enemy.y > 600) {
                    enemy.element.remove();
                    enemyPlanes.splice(index, 1);
                }
                
                // Check collision with player
                const distance = Math.sqrt(
                    Math.pow(currentX - enemy.x, 2) + 
                    Math.pow((600 - currentY) - enemy.y, 2)
                );
                
                if (distance < 40) {
                    createExplosion(enemy.x, enemy.y);
                    createExplosion(currentX, 600 - currentY);
                    
                    enemy.element.remove();
                    enemyPlanes.splice(index, 1);
                    
                    lives--;
                    if (lives <= 0) {
                        alert('游戏结束！最终得分: ' + score);
                        resetGame();
                        return;
                    }
                }
            });
            
            // Move player missiles
            missiles.forEach((missile, index) => {
                missile.y -= 10;
                missile.element.style.bottom = (600 - missile.y) + 'px';
                
                if (missile.y < 0) {
                    missile.element.remove();
                    missiles.splice(index, 1);
                }
                
                // Check collision with enemies
                enemyPlanes.forEach((enemy, enemyIndex) => {
                    const distance = Math.sqrt(
                        Math.pow(missile.x - enemy.x, 2) + 
                        Math.pow(missile.y - enemy.y, 2)
                    );
                    
                    if (distance < 30) {
                        createExplosion(enemy.x, enemy.y);
                        
                        missile.element.remove();
                        enemy.element.remove();
                        
                        missiles.splice(index, 1);
                        enemyPlanes.splice(enemyIndex, 1);
                        
                        score += 100;
                    }
                });
            });
            
            // Move enemy missiles
            enemyMissiles.forEach((missile, index) => {
                missile.y += 8;
                missile.element.style.top = missile.y + 'px';
                
                if (missile.y > 600) {
                    missile.element.remove();
                    enemyMissiles.splice(index, 1);
                }
                
                // Check collision with player
                const distance = Math.sqrt(
                    Math.pow(missile.x - currentX, 2) + 
                    Math.pow(missile.y - (600 - currentY), 2)
                );
                
                if (distance < 25) {
                    createExplosion(currentX, 600 - currentY);
                    
                    missile.element.remove();
                    enemyMissiles.splice(index, 1);
                    
                    lives--;
                    if (lives <= 0) {
                        alert('游戏结束！最终得分: ' + score);
                        resetGame();
                        return;
                    }
                }
            });
            
            // Move power-ups
            powerUps.forEach((powerUp, index) => {
                powerUp.y += powerUp.speed;
                powerUp.element.style.top = powerUp.y + 'px';
                
                if (powerUp.y > 600) {
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                }
                
                // Check collection
                const distance = Math.sqrt(
                    Math.pow(powerUp.x - currentX, 2) + 
                    Math.pow(powerUp.y - (600 - currentY), 2)
                );
                
                if (distance < 30) {
                    powerUp.element.remove();
                    powerUps.splice(index, 1);
                    
                    if (powerUp.type === 'ammo') {
                        ammo = Math.min(ammo + 10, 50);
                    } else if (powerUp.type === 'life') {
                        lives = Math.min(lives + 1, 5);
                    }
                }
            });
            
            // Increase speed over time
            speed += 0.001;
            
            updateRadar();
            updateDisplay();
            setTimeout(gameLoop, 20);
        }
        
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('ammo').textContent = ammo;
            document.getElementById('speed').textContent = speed.toFixed(1) + 'x';
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        field.addEventListener('click', shoot);
        
        initGame();
    </script>
</body>
</html>
