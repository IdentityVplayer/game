<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双陆棋</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2E8B57 0%, #90EE90 50%, #98FB98 100%);
            min-height: 100vh;
        }

        h1 {
            color: #2F4F4F;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
        }

        .board {
            display: flex;
            background: #8B4513;
            border: 5px solid #654321;
            border-radius: 10px;
            padding: 10px;
            margin: 20px 0;
        }

        .half-board {
            display: flex;
            flex-direction: column;
            width: 50%;
        }

        .row {
            display: flex;
            height: 150px;
        }

        .point {
            width: 40px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 2px;
            cursor: pointer;
            position: relative;
            border-radius: 5px;
        }

        .point.dark {
            background: #654321;
        }

        .point.light {
            background: #D2B48C;
        }

        .point.selected {
            background: #FFD700 !important;
        }

        .point.valid-move {
            background: #90EE90 !important;
        }

        .checker {
            width: 35px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid #333;
            margin: 1px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .checker:hover {
            transform: scale(1.1);
        }

        .checker.white {
            background: radial-gradient(circle, #F5F5F5, #DCDCDC);
        }

        .checker.black {
            background: radial-gradient(circle, #2F2F2F, #000);
        }

        .bar {
            width: 60px;
            background: #8B4513;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            border: 2px solid #654321;
            border-radius: 10px;
        }

        .bear-off {
            width: 60px;
            background: #654321;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            border: 2px solid #8B4513;
            border-radius: 10px;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 20px 0;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .dice:hover {
            transform: scale(1.1);
        }

        .dice.used {
            background: #ccc;
            opacity: 0.5;
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            color: #2F4F4F;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #2E8B57, #90EE90);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .status {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }

        .point-number {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #2F4F4F;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎲 双陆棋</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div class="status" id="status">白方回合 - 点击掷骰子</div>
        </div>
        
        <div class="dice-container">
            <button id="rollButton" onclick="rollDice()">掷骰子</button>
            <div class="dice" id="dice1">?</div>
            <div class="dice" id="dice2">?</div>
        </div>
        
        <div class="board" id="board">
            <!-- 棋盘将通过JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="showRules()">游戏规则</button>
            <button onclick="endTurn()" id="endTurnBtn" style="display: none;">结束回合</button>
        </div>
    </div>

    <script>
        class Backgammon {
            constructor() {
                this.points = new Array(24).fill(null).map(() => []);
                this.bar = { white: 0, black: 0 };
                this.bearOff = { white: 0, black: 0 };
                this.currentPlayer = 'white';
                this.dice = [0, 0];
                this.availableMoves = [];
                this.selectedPoint = null;
                this.gameOver = false;
                
                this.initializeBoard();
                this.renderBoard();
                this.updateStatus();
            }

            initializeBoard() {
                // 初始棋子位置（按照标准双陆棋规则）
                this.points[0] = ['white', 'white'];           // 点1: 2个白子
                this.points[11] = ['white', 'white', 'white', 'white', 'white']; // 点12: 5个白子
                this.points[16] = ['white', 'white', 'white'];  // 点17: 3个白子
                this.points[18] = ['white', 'white', 'white', 'white', 'white']; // 点19: 5个白子
                
                this.points[23] = ['black', 'black'];           // 点24: 2个黑子
                this.points[12] = ['black', 'black', 'black', 'black', 'black']; // 点13: 5个黑子
                this.points[7] = ['black', 'black', 'black'];   // 点8: 3个黑子
                this.points[5] = ['black', 'black', 'black', 'black', 'black'];  // 点6: 5个黑子
            }

            renderBoard() {
                const board = document.getElementById('board');
                board.innerHTML = '';
                
                // 上半部分（点13-24）
                const topHalf = document.createElement('div');
                topHalf.className = 'half-board';
                
                const topRow = document.createElement('div');
                topRow.className = 'row';
                
                // 点19-24
                for (let i = 18; i >= 13; i--) {
                    topRow.appendChild(this.createPointElement(i, true));
                }
                
                topHalf.appendChild(topRow);
                
                // 中间bar区域
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.innerHTML = '<div>BAR</div>';
                
                // 添加bar中的棋子
                for (let i = 0; i < this.bar.white; i++) {
                    const checker = document.createElement('div');
                    checker.className = 'checker white';
                    bar.appendChild(checker);
                }
                for (let i = 0; i < this.bar.black; i++) {
                    const checker = document.createElement('div');
                    checker.className = 'checker black';
                    bar.appendChild(checker);
                }
                
                // 下半部分（点1-12）
                const bottomHalf = document.createElement('div');
                bottomHalf.className = 'half-board';
                
                const bottomRow = document.createElement('div');
                bottomRow.className = 'row';
                bottomRow.style.flexDirection = 'column-reverse';
                
                // 点7-12
                for (let i = 6; i < 12; i++) {
                    bottomRow.appendChild(this.createPointElement(i, false));
                }
                
                bottomHalf.appendChild(bottomRow);
                
                // Bear-off区域
                const bearOff = document.createElement('div');
                bearOff.className = 'bear-off';
                bearOff.innerHTML = '<div>OFF</div>';
                
                // 添加bear-off中的棋子
                for (let i = 0; i < this.bearOff.white; i++) {
                    const checker = document.createElement('div');
                    checker.className = 'checker white';
                    bearOff.appendChild(checker);
                }
                for (let i = 0; i < this.bearOff.black; i++) {
                    const checker = document.createElement('div');
                    checker.className = 'checker black';
                    bearOff.appendChild(checker);
                }
                
                board.appendChild(topHalf);
                board.appendChild(bar);
                board.appendChild(bottomHalf);
                board.appendChild(bearOff);
                
                // 添加点1-6
                const bottomRow2 = document.createElement('div');
                bottomRow2.className = 'row';
                bottomRow2.style.flexDirection = 'column-reverse';
                
                for (let i = 5; i >= 0; i--) {
                    bottomRow2.appendChild(this.createPointElement(i, false));
                }
                
                bottomHalf.appendChild(bottomRow2);
            }

            createPointElement(index, isTop) {
                const point = document.createElement('div');
                point.className = `point ${index % 2 === 0 ? 'dark' : 'light'}`;
                point.dataset.point = index;
                point.onclick = () => this.onPointClick(index);
                
                // 添加点号
                const pointNumber = document.createElement('div');
                pointNumber.className = 'point-number';
                pointNumber.textContent = index + 1;
                point.appendChild(pointNumber);
                
                // 添加棋子
                const checkers = this.points[index];
                checkers.forEach((color, i) => {
                    if (i < 6) { // 最多显示6个棋子
                        const checker = document.createElement('div');
                        checker.className = `checker ${color}`;
                        if (checkers.length > 6 && i === 5) {
                            checker.textContent = checkers.length - 5;
                            checker.style.fontSize = '10px';
                        }
                        point.appendChild(checker);
                    }
                });
                
                return point;
            }

            onPointClick(pointIndex) {
                if (this.gameOver || this.availableMoves.length === 0) return;
                
                if (this.selectedPoint === null) {
                    // 选择起始点
                    if (this.canSelectPoint(pointIndex)) {
                        this.selectedPoint = pointIndex;
                        this.highlightValidMoves(pointIndex);
                    }
                } else {
                    // 尝试移动到目标点
                    if (pointIndex === this.selectedPoint) {
                        this.clearSelection();
                    } else if (this.canMoveTo(this.selectedPoint, pointIndex)) {
                        this.makeMove(this.selectedPoint, pointIndex);
                        this.clearSelection();
                    } else {
                        this.clearSelection();
                        if (this.canSelectPoint(pointIndex)) {
                            this.selectedPoint = pointIndex;
                            this.highlightValidMoves(pointIndex);
                        }
                    }
                }
            }

            canSelectPoint(pointIndex) {
                const checkers = this.points[pointIndex];
                return checkers.length > 0 && checkers[checkers.length - 1] === this.currentPlayer;
            }

            canMoveTo(fromPoint, toPoint) {
                const distance = Math.abs(toPoint - fromPoint);
                return this.availableMoves.includes(distance) && this.isValidMove(fromPoint, toPoint);
            }

            isValidMove(fromPoint, toPoint) {
                const targetCheckers = this.points[toPoint];
                
                // 检查目标点是否被对方控制（超过1个棋子）
                if (targetCheckers.length > 1 && targetCheckers[0] !== this.currentPlayer) {
                    return false;
                }
                
                // 检查移动方向
                if (this.currentPlayer === 'white') {
                    return toPoint > fromPoint;
                } else {
                    return toPoint < fromPoint;
                }
            }

            makeMove(fromPoint, toPoint) {
                const distance = Math.abs(toPoint - fromPoint);
                const diceIndex = this.availableMoves.indexOf(distance);
                
                if (diceIndex !== -1) {
                    // 移除使用的骰子
                    this.availableMoves.splice(diceIndex, 1);
                    
                    // 移动棋子
                    const movingChecker = this.points[fromPoint].pop();
                    
                    // 检查是否击中对方棋子
                    const targetCheckers = this.points[toPoint];
                    if (targetCheckers.length === 1 && targetCheckers[0] !== this.currentPlayer) {
                        const hitChecker = targetCheckers.pop();
                        this.bar[hitChecker]++;
                    }
                    
                    this.points[toPoint].push(movingChecker);
                    
                    this.renderBoard();
                    this.updateDiceDisplay();
                    
                    // 检查是否所有骰子都用完
                    if (this.availableMoves.length === 0) {
                        this.endTurn();
                    }
                    
                    this.checkWin();
                }
            }

            highlightValidMoves(fromPoint) {
                this.clearHighlights();
                
                document.querySelector(`[data-point="${fromPoint}"]`).classList.add('selected');
                
                this.availableMoves.forEach(distance => {
                    let toPoint;
                    if (this.currentPlayer === 'white') {
                        toPoint = fromPoint + distance;
                    } else {
                        toPoint = fromPoint - distance;
                    }
                    
                    if (toPoint >= 0 && toPoint < 24 && this.isValidMove(fromPoint, toPoint)) {
                        document.querySelector(`[data-point="${toPoint}"]`).classList.add('valid-move');
                    }
                });
            }

            clearSelection() {
                this.selectedPoint = null;
                this.clearHighlights();
            }

            clearHighlights() {
                document.querySelectorAll('.point').forEach(point => {
                    point.classList.remove('selected', 'valid-move');
                });
            }

            rollDice() {
                if (this.availableMoves.length > 0) return;
                
                this.dice[0] = Math.floor(Math.random() * 6) + 1;
                this.dice[1] = Math.floor(Math.random() * 6) + 1;
                
                if (this.dice[0] === this.dice[1]) {
                    // 双重
                    this.availableMoves = [this.dice[0], this.dice[0], this.dice[0], this.dice[0]];
                } else {
                    this.availableMoves = [this.dice[0], this.dice[1]];
                }
                
                this.updateDiceDisplay();
                this.updateStatus();
                
                document.getElementById('rollButton').style.display = 'none';
                document.getElementById('endTurnBtn').style.display = 'inline-block';
            }

            updateDiceDisplay() {
                document.getElementById('dice1').textContent = this.dice[0];
                document.getElementById('dice2').textContent = this.dice[1];
                
                // 标记已使用的骰子
                const usedMoves = this.dice[0] === this.dice[1] ? 4 - this.availableMoves.length : 2 - this.availableMoves.length;
                
                document.getElementById('dice1').className = usedMoves >= 1 ? 'dice used' : 'dice';
                document.getElementById('dice2').className = usedMoves >= 2 ? 'dice used' : 'dice';
            }

            endTurn() {
                this.availableMoves = [];
                this.clearSelection();
                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';
                
                document.getElementById('rollButton').style.display = 'inline-block';
                document.getElementById('endTurnBtn').style.display = 'none';
                
                this.updateStatus();
            }

            updateStatus() {
                const status = document.getElementById('status');
                if (this.gameOver) {
                    status.textContent = `游戏结束！${this.currentPlayer === 'white' ? '黑方' : '白方'}获胜！`;
                    status.style.background = '#FFD700';
                } else if (this.availableMoves.length === 0) {
                    status.textContent = `${this.currentPlayer === 'white' ? '白方' : '黑方'}回合 - 点击掷骰子`;
                } else {
                    status.textContent = `${this.currentPlayer === 'white' ? '白方' : '黑方'}回合 - 可移动: ${this.availableMoves.join(', ')}`;
                }
            }

            checkWin() {
                if (this.bearOff.white === 15) {
                    this.gameOver = true;
                    this.currentPlayer = 'white';
                    this.updateStatus();
                } else if (this.bearOff.black === 15) {
                    this.gameOver = true;
                    this.currentPlayer = 'black';
                    this.updateStatus();
                }
            }
        }

        let game;

        function rollDice() {
            game.rollDice();
        }

        function endTurn() {
            game.endTurn();
        }

        function newGame() {
            game = new Backgammon();
        }

        function showRules() {
            alert(`双陆棋规则：
1. 每位玩家有15个棋子
2. 掷两个骰子决定移动步数
3. 可以用一个或两个骰子移动
4. 双重时可以移动4次
5. 不能移动到被对方控制的点（2个或以上棋子）
6. 可以击中对方单独的棋子
7. 被击中的棋子放到中间bar，必须重新进入
8. 所有棋子进入己方区域后可以移出棋盘
9. 先移出所有棋子的玩家获胜`);
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
