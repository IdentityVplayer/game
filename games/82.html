<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忍者跳跃</title>
    <style>
        body { background: linear-gradient(135deg, #2d3436, #636e72); font-family: 'Arial', sans-serif; margin: 0; color: white; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #fd79a8; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .ninja-field { width: 100%; height: 400px; background: linear-gradient(180deg, #74b9ff, #0984e3); border-radius: 10px; position: relative; overflow: hidden; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 80px; background: #00b894; }
        .ninja { width: 40px; height: 60px; background: #2d3436; position: absolute; bottom: 80px; left: 100px; border-radius: 5px; transition: bottom 0.3s ease; }
        .obstacle { width: 30px; height: 60px; background: #e17055; position: absolute; bottom: 80px; border-radius: 5px; }
        .cloud { width: 80px; height: 40px; background: white; border-radius: 20px; position: absolute; opacity: 0.7; }
        .score { font-size: 1.5em; margin-bottom: 20px; }
        .controls { margin: 20px 0; }
        .btn { background: #fd79a8; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #e84393; }
        .jump-btn { background: #00cec9; padding: 15px 30px; font-size: 1.2em; border-radius: 50%; }
        .jump-btn:hover { background: #00b894; }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
        @keyframes move { 0% { right: -50px; } 100% { right: 800px; } }
        @keyframes cloudMove { 0% { right: -100px; } 100% { right: 900px; } }
        .game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 30px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">忍者跳跃</h1>
        <div class="game-category">#动作游戏</div>
        
        <div class="game-area">
            <div class="score" id="score">得分: 0</div>
            
            <div class="ninja-field" id="ninjaField">
                <div class="ground"></div>
                <div class="ninja" id="ninja">🥷</div>
                
                <div class="game-over" id="gameOver">
                    <h2>游戏结束!</h2>
                    <p>你的得分: <span id="finalScore">0</span></p>
                    <button class="btn" onclick="resetGame()">重新开始</button>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn jump-btn" onclick="jump()"　onmousedown="jump()" ontouchstart="jump()">跳跃</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 点击“跳跃”按钮或按空格键让忍者跳起</p>
            <p>• 避开迅速移动的障碍物</p>
            <p>• 成功跳过障碍物可获得分数</p>
            <p>• 碰到障碍物游戏结束</p>
            <p>• 随着时间推移，游戏速度会逐渐加快</p>
            <p>• 挑战你的反应速度，成为跳跃大师！</p>
        </div>
    </div>
    
    <script>
        let score = 0;
        let gameRunning = false;
        let gameSpeed = 3;
        let obstacles = [];
        let clouds = [];
        let ninja;
        let field;
        let isJumping = false;
        
        function initGame() {
            ninja = document.getElementById('ninja');
            field = document.getElementById('ninjaField');
            createClouds();
        }
        
        function createClouds() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    cloud.style.top = Math.random() * 200 + 'px';
                    cloud.style.right = '-100px';
                    cloud.style.animation = 'cloudMove 15s linear infinite';
                    field.appendChild(cloud);
                    clouds.push(cloud);
                }, i * 5000);
            }
        }
        
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gameSpeed = 3;
            score = 0;
            updateScore();
            
            document.getElementById('gameOver').style.display = 'none';
            gameLoop();
            spawnObstacles();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) {
                gameLoop();
            }
        }
        
        function resetGame() {
            gameRunning = false;
            score = 0;
            gameSpeed = 3;
            isJumping = false;
            
            // Clear obstacles
            obstacles.forEach(obstacle => obstacle.remove());
            obstacles = [];
            
            // Reset ninja position
            ninja.style.bottom = '80px';
            ninja.style.transform = 'none';
            
            // Hide game over screen
            document.getElementById('gameOver').style.display = 'none';
            
            updateScore();
        }
        
        function jump() {
            if (!gameRunning || isJumping) return;
            
            isJumping = true;
            ninja.style.bottom = '200px';
            ninja.style.transform = 'rotate(15deg)';
            
            setTimeout(() => {
                ninja.style.bottom = '80px';
                ninja.style.transform = 'rotate(0deg)';
                isJumping = false;
            }, 600);
        }
        
        function spawnObstacles() {
            if (!gameRunning) return;
            
            const obstacle = document.createElement('div');
            obstacle.className = 'obstacle';
            obstacle.style.right = '-30px';
            obstacle.style.animation = `move ${8 - gameSpeed * 0.5}s linear`;
            obstacle.textContent = '🌵';
            obstacle.style.fontSize = '40px';
            obstacle.style.display = 'flex';
            obstacle.style.alignItems = 'center';
            obstacle.style.justifyContent = 'center';
            
            field.appendChild(obstacle);
            obstacles.push(obstacle);
            
            // Remove obstacle after animation
            setTimeout(() => {
                if (obstacle.parentNode) {
                    obstacle.remove();
                    const index = obstacles.indexOf(obstacle);
                    if (index > -1) {
                        obstacles.splice(index, 1);
                    }
                }
            }, (8 - gameSpeed * 0.5) * 1000);
            
            // Spawn next obstacle
            const nextSpawnTime = Math.max(1500 - score * 10, 800);
            setTimeout(spawnObstacles, nextSpawnTime);
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Check collisions
            obstacles.forEach((obstacle, index) => {
                const obstacleRect = obstacle.getBoundingClientRect();
                const ninjaRect = ninja.getBoundingClientRect();
                
                // Check if obstacle passed ninja (score point)
                const obstacleRight = parseFloat(obstacle.style.right);
                if (obstacleRight > 150 && obstacleRight < 200) {
                    score += 10;
                    updateScore();
                    
                    // Increase game speed gradually
                    if (score % 100 === 0 && gameSpeed < 6) {
                        gameSpeed += 0.5;
                    }
                }
                
                // Check collision
                if (obstacleRect.left < ninjaRect.right && 
                    obstacleRect.right > ninjaRect.left && 
                    obstacleRect.top < ninjaRect.bottom && 
                    obstacleRect.bottom > ninjaRect.top) {
                    
                    gameOver();
                    return;
                }
            });
            
            setTimeout(gameLoop, 50);
        }
        
        function gameOver() {
            gameRunning = false;
            
            // Stop all animations
            obstacles.forEach(obstacle => {
                obstacle.style.animationPlayState = 'paused';
            });
            
            // Show game over screen
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            
            // Add some visual effect
            ninja.style.transform = 'rotate(90deg)';
            ninja.style.background = '#e17055';
            
            setTimeout(() => {
                ninja.style.background = '#2d3436';
            }, 1000);
        }
        
        function updateScore() {
            document.getElementById('score').textContent = '得分: ' + score;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        
        // Touch events for mobile
        field.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        // Initialize game
        initGame();
    </script>
</body>
</html>
