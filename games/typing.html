<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打字游戏</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            min-height: 100vh;
            color: #00ff00;
        }

        h1 {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 20px;
        }

        .game-container {
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .stat-box {
            background: rgba(0, 255, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #00ff00;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #00cc00;
            text-transform: uppercase;
        }

        .text-display {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.6;
            min-height: 120px;
            position: relative;
        }

        .text-content {
            white-space: pre-wrap;
        }

        .char {
            position: relative;
        }

        .char.correct {
            background: rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }

        .char.incorrect {
            background: rgba(255, 0, 0, 0.3);
            color: #ff0000;
        }

        .char.current {
            background: rgba(255, 255, 0, 0.3);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .input-area {
            margin: 20px 0;
        }

        .typing-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .typing-input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #00cc00, #00ff00);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .difficulty {
            margin: 20px 0;
            text-align: center;
        }

        .difficulty label {
            margin: 0 15px;
            cursor: pointer;
            color: #00cc00;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #00cc00, #00ff00);
            transition: width 0.3s;
            width: 0%;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #00ff00;
            text-align: center;
            margin: 15px 0;
        }

        .result {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>⌨️ 打字游戏</h1>
    
    <div class="game-container">
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="wpm">0</div>
                <div class="stat-label">WPM 速度</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="accuracy">100%</div>
                <div class="stat-label">准确率</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="errors">0</div>
                <div class="stat-label">错误数</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="chars">0</div>
                <div class="stat-label">字符数</div>
            </div>
        </div>
        
        <div class="timer" id="timer">01:00</div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="difficulty">
            <label><input type="radio" name="difficulty" value="easy" checked> 简单</label>
            <label><input type="radio" name="difficulty" value="medium"> 中等</label>
            <label><input type="radio" name="difficulty" value="hard"> 困难</label>
        </div>
        
        <div class="text-display" id="textDisplay">
            <div class="text-content" id="textContent"></div>
        </div>
        
        <div class="input-area">
            <input type="text" class="typing-input" id="typingInput" 
                   placeholder="点击开始打字..." disabled>
        </div>
        
        <div class="result" id="result"></div>
        
        <div class="controls">
            <button onclick="startTest()" id="startBtn">开始测试</button>
            <button onclick="resetTest()">重新开始</button>
            <button onclick="generateText()">更换文本</button>
        </div>
    </div>

    <script>
        class TypingGame {
            constructor() {
                this.texts = {
                    easy: [
                        "The quick brown fox jumps over the lazy dog.",
                        "Pack my box with five dozen liquor jugs.",
                        "How razorback jumping frogs can level six piqued gymnasts.",
                        "Sphinx of black quartz judge my vow."
                    ],
                    medium: [
                        "Programming is the art of telling another human what one wants the computer to do.",
                        "The best way to predict the future is to invent it yourself.",
                        "Code is like humor. When you have to explain it, it's bad.",
                        "First solve the problem. Then write the code."
                    ],
                    hard: [
                        "The complexity of software is an essential property, not an accidental one. Hence, descriptions of a software entity that abstract away its complexity often abstract away its essence.",
                        "There are only two hard things in computer science: cache invalidation and naming things.",
                        "Any fool can write code that a computer can understand. Good programmers write code that humans can understand."
                    ]
                };
                
                this.currentText = '';
                this.currentPosition = 0;
                this.startTime = null;
                this.timer = null;
                this.gameTime = 60;
                this.isStarted = false;
                this.isFinished = false;
                this.errors = 0;
                this.totalChars = 0;
                
                this.generateText();
                this.setupEventListeners();
            }

            generateText() {
                const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
                const texts = this.texts[difficulty];
                this.currentText = texts[Math.floor(Math.random() * texts.length)];
                this.resetTest();
                this.displayText();
            }

            displayText() {
                const textContent = document.getElementById('textContent');
                textContent.innerHTML = '';
                
                for (let i = 0; i < this.currentText.length; i++) {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = this.currentText[i];
                    
                    if (i === this.currentPosition) {
                        span.classList.add('current');
                    }
                    
                    textContent.appendChild(span);
                }
            }

            setupEventListeners() {
                const typingInput = document.getElementById('typingInput');
                
                typingInput.addEventListener('input', (e) => {
                    if (!this.isStarted) return;
                    
                    const inputValue = e.target.value;
                    const currentChar = this.currentText[this.currentPosition];
                    
                    if (inputValue.length > 0) {
                        const lastChar = inputValue[inputValue.length - 1];
                        
                        if (lastChar === currentChar) {
                            this.markCharacter(this.currentPosition, 'correct');
                            this.currentPosition++;
                            this.totalChars++;
                        } else {
                            this.markCharacter(this.currentPosition, 'incorrect');
                            this.errors++;
                            this.currentPosition++;
                            this.totalChars++;
                        }
                        
                        e.target.value = '';
                        this.updateDisplay();
                        
                        if (this.currentPosition >= this.currentText.length) {
                            this.finishTest();
                        }
                    }
                });
                
                typingInput.addEventListener('focus', () => {
                    if (!this.isStarted && !this.isFinished) {
                        this.startTest();
                    }
                });
            }

            markCharacter(position, status) {
                const chars = document.querySelectorAll('.char');
                if (chars[position]) {
                    chars[position].classList.remove('current');
                    chars[position].classList.add(status);
                }
                
                if (chars[position + 1]) {
                    chars[position + 1].classList.add('current');
                }
            }

            startTest() {
                if (this.isStarted) return;
                
                this.isStarted = true;
                this.isFinished = false;
                this.startTime = Date.now();
                
                document.getElementById('typingInput').disabled = false;
                document.getElementById('typingInput').placeholder = '开始打字...';
                document.getElementById('startBtn').textContent = '正在进行...';
                document.getElementById('startBtn').disabled = true;
                
                this.timer = setInterval(() => {
                    this.updateTimer();
                }, 1000);
            }

            updateTimer() {
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const remaining = Math.max(0, this.gameTime - elapsed);
                
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (remaining === 0) {
                    this.finishTest();
                }
            }

            updateDisplay() {
                const elapsed = this.isStarted ? (Date.now() - this.startTime) / 1000 : 0;
                const minutes = elapsed / 60;
                
                // 计算WPM
                const words = this.totalChars / 5; // 标准单词长度5个字符
                const wpm = minutes > 0 ? Math.round(words / minutes) : 0;
                
                // 计算准确率
                const accuracy = this.totalChars > 0 ? 
                    Math.round(((this.totalChars - this.errors) / this.totalChars) * 100) : 100;
                
                // 计算进度
                const progress = (this.currentPosition / this.currentText.length) * 100;
                
                document.getElementById('wpm').textContent = wpm;
                document.getElementById('accuracy').textContent = accuracy + '%';
                document.getElementById('errors').textContent = this.errors;
                document.getElementById('chars').textContent = this.totalChars;
                document.getElementById('progressBar').style.width = progress + '%';
            }

            finishTest() {
                this.isStarted = false;
                this.isFinished = true;
                
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                document.getElementById('typingInput').disabled = true;
                document.getElementById('startBtn').textContent = '开始测试';
                document.getElementById('startBtn').disabled = false;
                
                this.showResult();
            }

            showResult() {
                const elapsed = (Date.now() - this.startTime) / 1000;
                const minutes = elapsed / 60;
                const words = this.totalChars / 5;
                const wpm = minutes > 0 ? Math.round(words / minutes) : 0;
                const accuracy = this.totalChars > 0 ? 
                    Math.round(((this.totalChars - this.errors) / this.totalChars) * 100) : 100;
                
                let rating = '';
                if (wpm >= 60) rating = '🎆 大师级别';
                else if (wpm >= 40) rating = '💪 高手级别';
                else if (wpm >= 25) rating = '👍 中级水平';
                else if (wpm >= 15) rating = '🚀 初级水平';
                else rating = '🐣 新手上路';
                
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>测试结果</h3>
                    <div style="margin: 15px 0;">
                        <div>打字速度: <strong>${wpm} WPM</strong></div>
                        <div>准确率: <strong>${accuracy}%</strong></div>
                        <div>错误数: <strong>${this.errors}</strong></div>
                        <div>总字符: <strong>${this.totalChars}</strong></div>
                    </div>
                    <div style="font-size: 20px; margin-top: 15px;">${rating}</div>
                `;
                
                result.classList.add('show');
            }

            resetTest() {
                this.currentPosition = 0;
                this.startTime = null;
                this.isStarted = false;
                this.isFinished = false;
                this.errors = 0;
                this.totalChars = 0;
                
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                document.getElementById('typingInput').value = '';
                document.getElementById('typingInput').disabled = true;
                document.getElementById('typingInput').placeholder = '点击开始打字...';
                document.getElementById('startBtn').textContent = '开始测试';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('timer').textContent = '01:00';
                document.getElementById('result').classList.remove('show');
                
                this.displayText();
                this.updateDisplay();
            }
        }

        let game;

        function startTest() {
            game.startTest();
        }

        function resetTest() {
            game.resetTest();
        }

        function generateText() {
            game.generateText();
        }

        // 初始化游戏
        game = new TypingGame();
    </script>
</body>
</html>
