<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际战舰</title>
    <style>
        body { background: linear-gradient(135deg, #0c0c0c, #1a1a2e); font-family: 'Arial', sans-serif; margin: 0; color: white; overflow: hidden; }
        .game-container { max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        .game-title { font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .game-category { color: #00d4ff; font-size: 1.2em; margin-bottom: 20px; }
        .game-area { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .space-field { width: 100%; height: 600px; background: linear-gradient(180deg, #000428, #004e92); border-radius: 10px; position: relative; overflow: hidden; }
        .spaceship { width: 60px; height: 80px; background: #00d4ff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }
        .enemy-ship { width: 50px; height: 60px; background: #ff4757; clip-path: polygon(50% 100%, 0% 0%, 100% 0%); position: absolute; }
        .laser { width: 4px; height: 20px; background: #00ff00; position: absolute; box-shadow: 0 0 10px #00ff00; }
        .enemy-laser { width: 4px; height: 20px; background: #ff0000; position: absolute; box-shadow: 0 0 10px #ff0000; }
        .star { width: 2px; height: 2px; background: white; position: absolute; border-radius: 50%; }
        .explosion { width: 60px; height: 60px; background: radial-gradient(circle, #ffaa00, #ff0000); border-radius: 50%; position: absolute; animation: explode 0.5s ease-out; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.2em; }
        .controls { margin: 20px 0; }
        .btn { background: #00d4ff; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #0099cc; }
        @keyframes explode { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .how-to-play { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">星际战舰</h1>
        <div class="game-category">#射击游戏</div>
        
        <div class="game-area">
            <div class="stats">
                <div>生命值: <span id="health">100</span></div>
                <div>得分: <span id="score">0</span></div>
                <div>等级: <span id="level">1</span></div>
            </div>
            
            <div class="space-field" id="spaceField">
                <div class="spaceship" id="spaceship"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
                <button class="btn" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="how-to-play">
            <h3>游玩方法：</h3>
            <p>• 使用WASD键或方向键控制战舰移动</p>
            <p>• 按空格键发射激光</p>
            <p>• 躲避敌舰的攻击</p>
            <p>• 击毁敌舰获得分数</p>
            <p>• 生命值归零游戏结束</p>
            <p>• 随着等级提升，敌舰会变得更强！</p>
        </div>
    </div>
    
    <script>
        let health = 100;
        let score = 0;
        let level = 1;
        let gameRunning = false;
        let spaceship, field;
        let enemies = [];
        let lasers = [];
        let enemyLasers = [];
        let stars = [];
        let keys = {};
        
        function initGame() {
            spaceship = document.getElementById('spaceship');
            field = document.getElementById('spaceField');
            createStars();
        }
        
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                field.appendChild(star);
                stars.push(star);
            }
        }
        
        function startGame() {
            gameRunning = true;
            gameLoop();
            spawnEnemies();
            moveStars();
        }
        
        function pauseGame() {
            gameRunning = !gameRunning;
            if (gameRunning) {
                gameLoop();
                moveStars();
            }
        }
        
        function resetGame() {
            gameRunning = false;
            health = 100;
            score = 0;
            level = 1;
            enemies = [];
            lasers = [];
            enemyLasers = [];
            
            field.innerHTML = '<div class="spaceship" id="spaceship"></div>';
            spaceship = document.getElementById('spaceship');
            spaceship.style.left = '50%';
            spaceship.style.bottom = '20px';
            
            createStars();
            updateDisplay();
        }
        
        function spawnEnemies() {
            if (!gameRunning) return;
            
            const enemy = document.createElement('div');
            enemy.className = 'enemy-ship';
            enemy.style.left = Math.random() * 850 + 'px';
            enemy.style.top = '-60px';
            field.appendChild(enemy);
            
            enemies.push({
                element: enemy,
                x: parseInt(enemy.style.left),
                y: -60,
                health: level * 2,
                lastShot: 0
            });
            
            setTimeout(spawnEnemies, Math.max(1000 - level * 100, 300));
        }
        
        function shoot() {
            const laser = document.createElement('div');
            laser.className = 'laser';
            const shipRect = spaceship.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            laser.style.left = shipRect.left - fieldRect.left + 28 + 'px';
            laser.style.bottom = '100px';
            field.appendChild(laser);
            
            lasers.push({
                element: laser,
                x: shipRect.left - fieldRect.left + 28,
                y: 500
            });
        }
        
        function enemyShoot(enemy) {
            const laser = document.createElement('div');
            laser.className = 'enemy-laser';
            laser.style.left = enemy.x + 23 + 'px';
            laser.style.top = enemy.y + 60 + 'px';
            field.appendChild(laser);
            
            enemyLasers.push({
                element: laser,
                x: enemy.x + 23,
                y: enemy.y + 60
            });
        }
        
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = x + 'px';
            explosion.style.top = y + 'px';
            field.appendChild(explosion);
            
            setTimeout(() => explosion.remove(), 500);
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move spaceship
            const speed = 5;
            let currentX = parseInt(spaceship.style.left) || 400;
            
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                currentX = Math.max(0, currentX - speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                currentX = Math.min(840, currentX + speed);
            }
            
            spaceship.style.left = currentX + 'px';
            
            // Move enemies
            enemies.forEach((enemy, index) => {
                enemy.y += 2 + level * 0.5;
                enemy.element.style.top = enemy.y + 'px';
                
                // Enemy shooting
                if (Date.now() - enemy.lastShot > 2000) {
                    enemyShoot(enemy);
                    enemy.lastShot = Date.now();
                }
                
                if (enemy.y > 600) {
                    enemy.element.remove();
                    enemies.splice(index, 1);
                }
            });
            
            // Move lasers
            lasers.forEach((laser, index) => {
                laser.y -= 10;
                laser.element.style.bottom = (600 - laser.y) + 'px';
                
                if (laser.y < 0) {
                    laser.element.remove();
                    lasers.splice(index, 1);
                }
            });
            
            // Move enemy lasers
            enemyLasers.forEach((laser, index) => {
                laser.y += 8;
                laser.element.style.top = laser.y + 'px';
                
                if (laser.y > 600) {
                    laser.element.remove();
                    enemyLasers.splice(index, 1);
                }
                
                // Check collision with player
                const shipRect = spaceship.getBoundingClientRect();
                const fieldRect = field.getBoundingClientRect();
                const shipX = shipRect.left - fieldRect.left;
                const shipY = 520;
                
                if (laser.x > shipX && laser.x < shipX + 60 && 
                    laser.y > shipY && laser.y < shipY + 80) {
                    laser.element.remove();
                    enemyLasers.splice(index, 1);
                    health -= 10;
                    updateDisplay();
                    
                    if (health <= 0) {
                        createExplosion(shipX, shipY);
                        alert('游戏结束！最终得分: ' + score);
                        resetGame();
                        return;
                    }
                }
            });
            
            // Check laser-enemy collisions
            lasers.forEach((laser, laserIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (laser.x > enemy.x && laser.x < enemy.x + 50 &&
                        laser.y > enemy.y && laser.y < enemy.y + 60) {
                        
                        laser.element.remove();
                        lasers.splice(laserIndex, 1);
                        
                        enemy.health--;
                        if (enemy.health <= 0) {
                            createExplosion(enemy.x, enemy.y);
                            enemy.element.remove();
                            enemies.splice(enemyIndex, 1);
                            score += 100 * level;
                            
                            if (score > level * 1000) {
                                level++;
                            }
                            
                            updateDisplay();
                        }
                    }
                });
            });
            
            setTimeout(gameLoop, 20);
        }
        
        function moveStars() {
            if (!gameRunning) return;
            
            stars.forEach(star => {
                let top = parseInt(star.style.top);
                top += 2;
                if (top > 600) {
                    top = -10;
                    star.style.left = Math.random() * 100 + '%';
                }
                star.style.top = top + 'px';
            });
            
            setTimeout(moveStars, 50);
        }
        
        function updateDisplay() {
            document.getElementById('health').textContent = health;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        initGame();
    </script>
</body>
</html>
