<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻将</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2E8B57 0%, #90EE90 100%);
            min-height: 100vh;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            gap: 5px;
            margin: 20px auto;
            justify-content: center;
        }

        .tile {
            width: 60px;
            height: 80px;
            background: linear-gradient(145deg, #f0f8ff, #e0e0e0);
            border: 2px solid #8B4513;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .tile.selected {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            transform: translateY(-10px);
        }

        .tile.matched {
            background: linear-gradient(145deg, #90EE90, #98FB98);
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
        }

        .score {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #2E8B57, #90EE90);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #2E8B57;
            margin: 10px 0;
        }

        .hint {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
    </style>
</head>
<body>
    <h1>🀄 麻将</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div class="score">
                分数: <span id="score">0</span> | 
                剩余: <span id="remaining">144</span> | 
                时间: <span id="timer" class="timer">00:00</span>
            </div>
            <div class="hint" id="hint">提示: 找到两个相同的可选择麻将牌</div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="showHint()">提示</button>
            <button onclick="shuffle()">洗牌</button>
        </div>
    </div>

    <script>
        class Mahjong {
            constructor() {
                this.tiles = [];
                this.selectedTiles = [];
                this.score = 0;
                this.gameStarted = false;
                this.startTime = 0;
                this.timerInterval = null;
                
                this.symbols = ['🀄', '🀅', '🀆', '🀇', '🀈', '🀉', '🀊', '🀋', '🀌',
                              '一', '二', '三', '四', '五', '六', '七', '八', '九',
                              '筒', '萬', '索', '白', '中', '發'];
                
                this.initGame();
            }

            initGame() {
                this.generateTiles();
                this.renderBoard();
                this.updateDisplay();
                this.startTimer();
            }

            generateTiles() {
                this.tiles = [];
                
                // 生成144张牌，每种符号有多张
                for (let i = 0; i < 6; i++) {
                    for (let symbol of this.symbols) {
                        this.tiles.push({
                            symbol: symbol,
                            id: this.tiles.length,
                            matched: false,
                            selectable: false
                        });
                    }
                }
                
                // 洗牌
                this.shuffleTiles();
                
                // 设置初始可选择状态
                this.updateSelectableStates();
            }

            shuffleTiles() {
                for (let i = this.tiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.tiles[i], this.tiles[j]] = [this.tiles[j], this.tiles[i]];
                }
            }

            updateSelectableStates() {
                // 简化版本：所有未匹配的牌都可选择
                this.tiles.forEach(tile => {
                    tile.selectable = !tile.matched;
                });
            }

            renderBoard() {
                const board = document.getElementById('board');
                board.innerHTML = '';
                
                this.tiles.forEach((tile, index) => {
                    if (!tile.matched) {
                        const tileElement = document.createElement('div');
                        tileElement.className = 'tile';
                        tileElement.textContent = tile.symbol;
                        tileElement.dataset.index = index;
                        tileElement.onclick = () => this.selectTile(index);
                        
                        if (!tile.selectable) {
                            tileElement.style.opacity = '0.5';
                            tileElement.style.pointerEvents = 'none';
                        }
                        
                        board.appendChild(tileElement);
                    }
                });
            }

            selectTile(index) {
                const tile = this.tiles[index];
                if (!tile.selectable || tile.matched) return;
                
                if (this.selectedTiles.includes(index)) {
                    // 取消选择
                    this.selectedTiles = this.selectedTiles.filter(i => i !== index);
                } else {
                    this.selectedTiles.push(index);
                }
                
                this.updateTileVisuals();
                
                if (this.selectedTiles.length === 2) {
                    this.checkMatch();
                }
            }

            updateTileVisuals() {
                document.querySelectorAll('.tile').forEach(element => {
                    element.classList.remove('selected');
                });
                
                this.selectedTiles.forEach(index => {
                    const element = document.querySelector(`[data-index="${index}"]`);
                    if (element) {
                        element.classList.add('selected');
                    }
                });
            }

            checkMatch() {
                const [index1, index2] = this.selectedTiles;
                const tile1 = this.tiles[index1];
                const tile2 = this.tiles[index2];
                
                if (tile1.symbol === tile2.symbol) {
                    // 匹配成功
                    tile1.matched = true;
                    tile2.matched = true;
                    this.score += 10;
                    
                    // 动画效果
                    setTimeout(() => {
                        const elements = [index1, index2].map(i => 
                            document.querySelector(`[data-index="${i}"]`)
                        );
                        elements.forEach(el => {
                            if (el) el.classList.add('matched');
                        });
                        
                        setTimeout(() => {
                            this.renderBoard();
                            this.updateSelectableStates();
                        }, 500);
                    }, 100);
                } else {
                    // 匹配失败，1秒后清除选择
                    setTimeout(() => {
                        this.selectedTiles = [];
                        this.updateTileVisuals();
                    }, 1000);
                }
                
                this.selectedTiles = [];
                this.updateDisplay();
                
                // 检查是否胜利
                if (this.tiles.every(tile => tile.matched)) {
                    this.gameWon();
                }
            }

            showHint() {
                const availablePairs = this.getAvailablePairs();
                if (availablePairs.length > 0) {
                    const hint = document.getElementById('hint');
                    hint.style.display = 'block';
                    hint.textContent = `提示: 找到 ${availablePairs[0].symbol} 的配对`;
                    
                    setTimeout(() => {
                        hint.style.display = 'none';
                    }, 3000);
                }
            }

            getAvailablePairs() {
                const selectableTiles = this.tiles.filter(tile => tile.selectable && !tile.matched);
                const pairs = [];
                
                for (let i = 0; i < selectableTiles.length; i++) {
                    for (let j = i + 1; j < selectableTiles.length; j++) {
                        if (selectableTiles[i].symbol === selectableTiles[j].symbol) {
                            pairs.push(selectableTiles[i]);
                            break;
                        }
                    }
                }
                
                return pairs;
            }

            shuffle() {
                const unmatchedTiles = this.tiles.filter(tile => !tile.matched);
                const symbols = unmatchedTiles.map(tile => tile.symbol);
                
                // 洗牌重新分配符号
                for (let i = symbols.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
                }
                
                let symbolIndex = 0;
                this.tiles.forEach(tile => {
                    if (!tile.matched) {
                        tile.symbol = symbols[symbolIndex];
                        symbolIndex++;
                    }
                });
                
                this.renderBoard();
                this.updateSelectableStates();
            }

            startTimer() {
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('timer').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            gameWon() {
                clearInterval(this.timerInterval);
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                alert(`恭喜你！游戏完成！\n得分: ${this.score}\n用时: ${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`);
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                const remaining = this.tiles.filter(tile => !tile.matched).length;
                document.getElementById('remaining').textContent = remaining;
            }
        }

        let game;

        function newGame() {
            if (game && game.timerInterval) {
                clearInterval(game.timerInterval);
            }
            game = new Mahjong();
        }

        function showHint() {
            game.showHint();
        }

        function shuffle() {
            game.shuffle();
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
