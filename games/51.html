<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻牌记忆 - 记忆力训练游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .stat {
            text-align: center;
            color: #ffd93d;
            font-size: 1.2em;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .card.flipped {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            transform: rotateY(180deg);
        }
        .card.matched {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            animation: matchedPulse 0.6s ease;
        }
        @keyframes matchedPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .card.hidden {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: transparent;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 5px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .difficulty {
            margin: 20px 0;
            text-align: center;
        }
        .difficulty label {
            margin: 0 10px;
            cursor: pointer;
        }
        .difficulty input[type="radio"] {
            margin-right: 5px;
        }
        .instruction {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .timer {
            font-size: 1.5em;
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 翻牌记忆</h1>
        
        <div class="game-info">
            <div class="stat">
                <div>步数</div>
                <div id="moves">0</div>
            </div>
            <div class="stat">
                <div>配对</div>
                <div id="matches">0</div>
            </div>
            <div class="stat">
                <div>用时</div>
                <div class="timer" id="timer">00:00</div>
            </div>
            <div class="stat">
                <div>得分</div>
                <div id="score">0</div>
            </div>
        </div>
        
        <div class="difficulty">
            <label><input type="radio" name="difficulty" value="easy" checked> 简单 (4x4)</label>
            <label><input type="radio" name="difficulty" value="medium"> 中等 (4x5)</label>
            <label><input type="radio" name="difficulty" value="hard"> 困难 (6x6)</label>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="resetGame()">重新开始</button>
            <button onclick="showAllCards()">预览所有牌</button>
        </div>
        
        <div class="instruction">
            <h3>🎮 游玩方法：</h3>
            <p><strong>游戏目标：</strong>翻开所有配对的卡牌</p>
            <p><strong>操作方式：</strong></p>
            <ul>
                <li>点击卡牌翻开，寻找配对的图案</li>
                <li>每次只能翻开两张牌</li>
                <li>如果两张牌图案相同，则配对成功</li>
                <li>如果不同，牌会自动翻回背面</li>
            </ul>
            <p><strong>评分规则：</strong></p>
            <ul>
                <li>配对成功：+100分</li>
                <li>连续配对：额外奖励分数</li>
                <li>用时越短，奖励越多</li>
                <li>步数越少，分数越高</li>
            </ul>
            <p><strong>小贴士：</strong>记住已翻开的牌的位置，减少尝试次数！</p>
        </div>
    </div>

    <script>
        let gameState = {
            cards: [],
            flippedCards: [],
            matchedPairs: 0,
            moves: 0,
            score: 0,
            startTime: null,
            gameRunning: false,
            timer: null,
            consecutiveMatches: 0
        };
        
        const cardSymbols = {
            easy: ['🐱', '🐶', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'],
            medium: ['🐱', '🐶', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯'],
            hard: ['🐱', '🐶', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐸', '🐷', '🐮', '🐵', '🐧', '🦆', '🐢']
        };
        
        const gridSizes = {
            easy: { cols: 4, rows: 4, pairs: 8 },
            medium: { cols: 4, rows: 5, pairs: 10 },
            hard: { cols: 6, rows: 6, pairs: 18 }
        };
        
        function getDifficulty() {
            return document.querySelector('input[name="difficulty"]:checked').value;
        }
        
        function startGame() {
            resetGame();
            const difficulty = getDifficulty();
            const grid = gridSizes[difficulty];
            const symbols = cardSymbols[difficulty].slice(0, grid.pairs);
            
            // 创建卡牌对
            gameState.cards = [];
            symbols.forEach(symbol => {
                gameState.cards.push(symbol, symbol);
            });
            
            // 打乱卡牌
            shuffleArray(gameState.cards);
            
            // 创建游戏板
            createGameBoard(grid.cols, grid.rows);
            
            gameState.gameRunning = true;
            gameState.startTime = Date.now();
            gameState.timer = setInterval(updateTimer, 1000);
            
            updateUI();
        }
        
        function resetGame() {
            gameState = {
                cards: [],
                flippedCards: [],
                matchedPairs: 0,
                moves: 0,
                score: 0,
                startTime: null,
                gameRunning: false,
                timer: null,
                consecutiveMatches: 0
            };
            
            if (gameState.timer) {
                clearInterval(gameState.timer);
            }
            
            updateUI();
        }
        
        function createGameBoard(cols, rows) {
            const board = document.getElementById('gameBoard');
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.innerHTML = '';
            
            for (let i = 0; i < gameState.cards.length; i++) {
                const card = document.createElement('div');
                card.className = 'card hidden';
                card.dataset.index = i;
                card.dataset.symbol = gameState.cards[i];
                card.addEventListener('click', () => flipCard(i));
                board.appendChild(card);
            }
        }
        
        function flipCard(index) {
            if (!gameState.gameRunning) return;
            if (gameState.flippedCards.length >= 2) return;
            if (gameState.flippedCards.includes(index)) return;
            
            const card = document.querySelector(`[data-index="${index}"]`);
            card.textContent = gameState.cards[index];
            card.classList.remove('hidden');
            card.classList.add('flipped');
            
            gameState.flippedCards.push(index);
            
            if (gameState.flippedCards.length === 2) {
                gameState.moves++;
                setTimeout(checkMatch, 1000);
            }
            
            updateUI();
        }
        
        function checkMatch() {
            const [index1, index2] = gameState.flippedCards;
            const card1 = document.querySelector(`[data-index="${index1}"]`);
            const card2 = document.querySelector(`[data-index="${index2}"]`);
            
            if (gameState.cards[index1] === gameState.cards[index2]) {
                // 匹配成功
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                gameState.matchedPairs++;
                gameState.consecutiveMatches++;
                
                // 计分
                let points = 100;
                points += gameState.consecutiveMatches * 20; // 连击奖励
                gameState.score += points;
                
                // 检查游戏是否完成
                if (gameState.matchedPairs === gameState.cards.length / 2) {
                    gameWon();
                }
            } else {
                // 不匹配，翻回背面
                card1.textContent = '';
                card2.textContent = '';
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.classList.add('hidden');
                card2.classList.add('hidden');
                
                gameState.consecutiveMatches = 0;
            }
            
            gameState.flippedCards = [];
            updateUI();
        }
        
        function showAllCards() {
            if (gameState.gameRunning) return;
            
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.textContent = gameState.cards[index];
                card.classList.remove('hidden');
                card.classList.add('flipped');
            });
            
            setTimeout(() => {
                cards.forEach(card => {
                    card.textContent = '';
                    card.classList.remove('flipped');
                    card.classList.add('hidden');
                });
            }, 3000);
        }
        
        function gameWon() {
            clearInterval(gameState.timer);
            gameState.gameRunning = false;
            
            const timeBonus = Math.max(0, 1000 - Math.floor((Date.now() - gameState.startTime) / 1000));
            const moveBonus = Math.max(0, 500 - gameState.moves * 10);
            gameState.score += timeBonus + moveBonus;
            
            setTimeout(() => {
                alert(`恭喜完成！\n最终得分：${gameState.score}\n用时：${formatTime(Date.now() - gameState.startTime)}\n步数：${gameState.moves}`);
            }, 500);
            
            updateUI();
        }
        
        function updateTimer() {
            if (!gameState.startTime) return;
            
            const elapsed = Date.now() - gameState.startTime;
            document.getElementById('timer').textContent = formatTime(elapsed);
        }
        
        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            return `${minutes.toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;
        }
        
        function updateUI() {
            document.getElementById('moves').textContent = gameState.moves;
            document.getElementById('matches').textContent = gameState.matchedPairs;
            document.getElementById('score').textContent = gameState.score;
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 初始化
        updateUI();
    </script>
</body>
</html>
