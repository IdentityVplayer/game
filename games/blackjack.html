<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑杰克</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 30px;
        }

        .table {
            width: 100%;
            background: #0F5132;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
        }

        .dealer-area, .player-area {
            margin: 30px 0;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .card {
            width: 70px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            position: relative;
        }

        .card.red {
            color: red;
        }

        .card.black {
            color: black;
        }

        .card.back {
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            color: white;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            color: white;
        }

        .controls {
            text-align: center;
            margin: 30px 0;
        }

        button {
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-info {
            background: rgba(26,26,46,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .chips {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a2e;
            margin: 10px 0;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .result.win {
            background: #d4edda;
            color: #155724;
        }

        .result.lose {
            background: #f8d7da;
            color: #721c24;
        }

        .result.push {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🃏 黑杰克</h1>
        
        <div class="game-info">
            <div class="chips">筹码: $<span id="chips">1000</span></div>
            <div>当前下注: $<span id="currentBet">0</span></div>
        </div>
        
        <div class="table">
            <div class="dealer-area">
                <h3 style="color: white;">庄家</h3>
                <div class="cards" id="dealerCards"></div>
                <div class="score" id="dealerScore">分数: ?</div>
            </div>
            
            <div class="player-area">
                <h3 style="color: white;">玩家</h3>
                <div class="cards" id="playerCards"></div>
                <div class="score" id="playerScore">分数: 0</div>
            </div>
        </div>
        
        <div id="result" class="result" style="display: none;"></div>
        
        <div class="controls">
            <div id="bettingControls">
                <button onclick="bet(10)">$10</button>
                <button onclick="bet(25)">$25</button>
                <button onclick="bet(50)">$50</button>
                <button onclick="bet(100)">$100</button>
                <button onclick="deal()" id="dealBtn">开始游戏</button>
            </div>
            
            <div id="gameControls" style="display: none;">
                <button onclick="hit()" id="hitBtn">要牌</button>
                <button onclick="stand()" id="standBtn">停牌</button>
                <button onclick="doubleDown()" id="doubleBtn">加倍</button>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="newGame()">新游戏</button>
            <button onclick="showRules()">游戏规则</button>
        </div>
    </div>

    <script>
        class Blackjack {
            constructor() {
                this.deck = [];
                this.playerCards = [];
                this.dealerCards = [];
                this.playerScore = 0;
                this.dealerScore = 0;
                this.chips = 1000;
                this.currentBet = 0;
                this.gameActive = false;
                this.dealerHidden = true;
                
                this.initDeck();
                this.updateDisplay();
            }

            initDeck() {
                const suits = ['♠', '♥', '♦', '♣'];
                const ranks = [
                    {name: 'A', value: 11},
                    {name: '2', value: 2}, {name: '3', value: 3}, {name: '4', value: 4},
                    {name: '5', value: 5}, {name: '6', value: 6}, {name: '7', value: 7},
                    {name: '8', value: 8}, {name: '9', value: 9}, {name: '10', value: 10},
                    {name: 'J', value: 10}, {name: 'Q', value: 10}, {name: 'K', value: 10}
                ];
                
                this.deck = [];
                for (let suit of suits) {
                    for (let rank of ranks) {
                        this.deck.push({
                            suit: suit,
                            rank: rank.name,
                            value: rank.value,
                            isRed: suit === '♥' || suit === '♦'
                        });
                    }
                }
                
                this.shuffleDeck();
            }

            shuffleDeck() {
                for (let i = this.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
                }
            }

            bet(amount) {
                if (this.gameActive || this.chips < amount) return;
                
                this.currentBet = amount;
                this.chips -= amount;
                this.updateDisplay();
                
                document.getElementById('dealBtn').disabled = false;
            }

            deal() {
                if (this.currentBet === 0) return;
                
                this.gameActive = true;
                this.dealerHidden = true;
                this.playerCards = [];
                this.dealerCards = [];
                
                // 发牌
                this.playerCards.push(this.deck.pop());
                this.dealerCards.push(this.deck.pop());
                this.playerCards.push(this.deck.pop());
                this.dealerCards.push(this.deck.pop());
                
                this.calculateScores();
                this.updateDisplay();
                
                // 检查黑杰克
                if (this.playerScore === 21) {
                    this.checkBlackjack();
                } else {
                    this.showGameControls(true);
                }
            }

            hit() {
                this.playerCards.push(this.deck.pop());
                this.calculateScores();
                this.updateDisplay();
                
                if (this.playerScore > 21) {
                    this.endGame('爆牌！你输了！', 'lose');
                } else if (this.playerScore === 21) {
                    this.stand();
                }
            }

            stand() {
                this.dealerHidden = false;
                this.showGameControls(false);
                
                // 庄家继续要牌
                while (this.dealerScore < 17) {
                    this.dealerCards.push(this.deck.pop());
                    this.calculateScores();
                }
                
                this.updateDisplay();
                this.determineWinner();
            }

            doubleDown() {
                if (this.chips < this.currentBet) return;
                
                this.chips -= this.currentBet;
                this.currentBet *= 2;
                
                this.hit();
                
                if (this.playerScore <= 21) {
                    this.stand();
                }
            }

            calculateScores() {
                this.playerScore = this.calculateHandValue(this.playerCards);
                this.dealerScore = this.calculateHandValue(this.dealerCards);
            }

            calculateHandValue(cards) {
                let value = 0;
                let aces = 0;
                
                for (let card of cards) {
                    if (card.rank === 'A') {
                        aces++;
                        value += 11;
                    } else {
                        value += card.value;
                    }
                }
                
                // 处理A的值
                while (value > 21 && aces > 0) {
                    value -= 10;
                    aces--;
                }
                
                return value;
            }

            checkBlackjack() {
                const playerBlackjack = this.playerScore === 21 && this.playerCards.length === 2;
                const dealerBlackjack = this.dealerScore === 21 && this.dealerCards.length === 2;
                
                if (playerBlackjack && dealerBlackjack) {
                    this.endGame('双方都是黑杰克！平局！', 'push');
                } else if (playerBlackjack) {
                    this.endGame('黑杰克！你赢了！', 'win', 2.5);
                } else {
                    this.showGameControls(true);
                }
            }

            determineWinner() {
                if (this.dealerScore > 21) {
                    this.endGame('庄家爆牌！你赢了！', 'win');
                } else if (this.playerScore > this.dealerScore) {
                    this.endGame('你赢了！', 'win');
                } else if (this.dealerScore > this.playerScore) {
                    this.endGame('庄家赢了！', 'lose');
                } else {
                    this.endGame('平局！', 'push');
                }
            }

            endGame(message, result, multiplier = 2) {
                this.gameActive = false;
                this.dealerHidden = false;
                
                if (result === 'win') {
                    this.chips += Math.floor(this.currentBet * multiplier);
                } else if (result === 'push') {
                    this.chips += this.currentBet;
                }
                
                this.currentBet = 0;
                
                const resultElement = document.getElementById('result');
                resultElement.textContent = message;
                resultElement.className = `result ${result}`;
                resultElement.style.display = 'block';
                
                this.showGameControls(false);
                this.updateDisplay();
            }

            showGameControls(show) {
                document.getElementById('bettingControls').style.display = show ? 'none' : 'block';
                document.getElementById('gameControls').style.display = show ? 'block' : 'none';
                document.getElementById('dealBtn').disabled = this.currentBet === 0;
            }

            createCardElement(card, hidden = false) {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${hidden ? 'back' : (card.isRed ? 'red' : 'black')}`;
                
                if (hidden) {
                    cardDiv.innerHTML = '🂠';
                } else {
                    cardDiv.innerHTML = `<div>${card.rank}</div><div>${card.suit}</div>`;
                }
                
                return cardDiv;
            }

            updateDisplay() {
                // 更新玩家手牌
                const playerCardsElement = document.getElementById('playerCards');
                playerCardsElement.innerHTML = '';
                this.playerCards.forEach(card => {
                    playerCardsElement.appendChild(this.createCardElement(card));
                });
                
                // 更新庄家手牌
                const dealerCardsElement = document.getElementById('dealerCards');
                dealerCardsElement.innerHTML = '';
                this.dealerCards.forEach((card, index) => {
                    const hidden = this.dealerHidden && index === 1;
                    dealerCardsElement.appendChild(this.createCardElement(card, hidden));
                });
                
                // 更新分数
                document.getElementById('playerScore').textContent = `分数: ${this.playerScore}`;
                if (this.dealerHidden && this.dealerCards.length > 0) {
                    document.getElementById('dealerScore').textContent = `分数: ${this.dealerCards[0].value}`;
                } else {
                    document.getElementById('dealerScore').textContent = `分数: ${this.dealerScore}`;
                }
                
                // 更新筹码和下注
                document.getElementById('chips').textContent = this.chips;
                document.getElementById('currentBet').textContent = this.currentBet;
                
                // 更新按钮状态
                const canDouble = this.gameActive && this.playerCards.length === 2 && this.chips >= this.currentBet;
                document.getElementById('doubleBtn').disabled = !canDouble;
            }
        }

        let game;

        function bet(amount) {
            game.bet(amount);
        }

        function deal() {
            game.deal();
        }

        function hit() {
            game.hit();
        }

        function stand() {
            game.stand();
        }

        function doubleDown() {
            game.doubleDown();
        }

        function newGame() {
            game = new Blackjack();
            document.getElementById('result').style.display = 'none';
        }

        function showRules() {
            alert(`黑杰克规则：\n1. 目标是让手牌总点数尽可能接近21而不超过\n2. A可以算作1成11\n3. J、Q、K都算作10点\n4. 黑杰克（A+10点牌）获肗2.5倍奖金\n5. 庄家必须在17点或以上\n6. 超过21点即为爆牌`);
        }

        // 初始化游戏
        newGame();
    </script>
</body>
</html>
