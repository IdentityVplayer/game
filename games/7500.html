<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法冒险 7500</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #98D8C8, #98D8C8);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .btn {
            background: linear-gradient(45deg, #4ECDC4, #98D8C8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        
        
        #gameArea {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        #map {
            width: 300px;
            height: 200px;
            border: 2px solid #333;
            background: linear-gradient(45deg, #8FBC8F, #228B22);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 10px;
        }
        
        #character {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 300px;
            margin: 0 auto;
        }
        
        .stat {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        #actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        #log {
            height: 150px;
            background: #f9f9f9;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
        }
        
    </style>
</head>
<body>
    <div class="game-container">
        <h1>魔法冒险 7500</h1>
        
        <div id="gameArea">
            <div id="map"></div>
            <div id="character">
                <div class="stat">生命: <span id="hp">100</span>/100</div>
                <div class="stat">等级: <span id="level">1</span></div>
                <div class="stat">经验: <span id="exp">0</span>/100</div>
                <div class="stat">金币: <span id="gold">0</span></div>
            </div>
            <div id="actions">
                <button class="btn" onclick="explore()">探索</button>
                <button class="btn" onclick="rest()">休息</button>
                <button class="btn" onclick="shop()">商店</button>
            </div>
            <div id="log"></div>
        </div>
        
    </div>
    
    <script>
        
        let player = {
            hp: 100,
            maxHp: 100,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 0,
            items: []
        };
        
        let currentLocation = '森林';
        
        const locations = [
            '森林', '山洞', '河边', '村庄', '废墟', '神庙'
        ];
        
        const monsters = [
            {name: '史莱姆', hp: 20, damage: 5, exp: 15, gold: 5},
            {name: '哥布林', hp: 35, damage: 8, exp: 25, gold: 10},
            {name: '骷髅', hp: 50, damage: 12, exp: 40, gold: 15},
            {name: '兽人', hp: 80, damage: 18, exp: 60, gold: 25},
            {name: '巨龙', hp: 200, damage: 35, exp: 150, gold: 100}
        ];
        
        function updateDisplay() {
            document.getElementById('hp').textContent = player.hp;
            document.getElementById('level').textContent = player.level;
            document.getElementById('exp').textContent = player.exp;
            document.getElementById('gold').textContent = player.gold;
            document.getElementById('map').textContent = currentLocation;
        }
        
        function addLog(message) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.textContent = message;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }
        
        function explore() {
            if (player.hp <= 0) {
                addLog('你已经死亡，无法探索！');
                return;
            }
            
            const event = Math.random();
            
            if (event < 0.6) {
                // 遇到怪物
                const monster = monsters[Math.floor(Math.random() * Math.min(monsters.length, player.level + 1))];
                battle(monster);
            } else if (event < 0.8) {
                // 找到金币
                const gold = Math.floor(Math.random() * 20) + 5;
                player.gold += gold;
                addLog(`你找到了 ${gold} 金币！`);
            } else if (event < 0.9) {
                // 找到经验
                const exp = Math.floor(Math.random() * 15) + 5;
                gainExp(exp);
                addLog(`你获得了 ${exp} 经验值！`);
            } else {
                // 移动到新地点
                currentLocation = locations[Math.floor(Math.random() * locations.length)];
                addLog(`你来到了 ${currentLocation}`);
            }
            
            updateDisplay();
        }
        
        function battle(monster) {
            addLog(`遭遇 ${monster.name}！`);
            
            let monsterHp = monster.hp;
            
            while (monsterHp > 0 && player.hp > 0) {
                // 玩家攻击
                const playerDamage = Math.floor(Math.random() * (player.level * 10)) + 5;
                monsterHp -= playerDamage;
                addLog(`你对 ${monster.name} 造成 ${playerDamage} 伤害`);
                
                if (monsterHp <= 0) {
                    addLog(`${monster.name} 被击败！`);
                    gainExp(monster.exp);
                    player.gold += monster.gold;
                    addLog(`获得 ${monster.exp} 经验和 ${monster.gold} 金币`);
                    break;
                }
                
                // 怪物攻击
                const monsterDamage = Math.floor(Math.random() * monster.damage) + 1;
                player.hp -= monsterDamage;
                addLog(`${monster.name} 对你造成 ${monsterDamage} 伤害`);
                
                if (player.hp <= 0) {
                    player.hp = 0;
                    addLog('你被击败了！');
                    break;
                }
            }
        }
        
        function gainExp(exp) {
            player.exp += exp;
            
            while (player.exp >= player.expToNext) {
                player.exp -= player.expToNext;
                player.level++;
                player.maxHp += 20;
                player.hp = player.maxHp; // 升级回满血
                player.expToNext = player.level * 100;
                addLog(`恭喜升级！现在是 ${player.level} 级！`);
            }
        }
        
        function rest() {
            if (player.hp >= player.maxHp) {
                addLog('你的生命值已满！');
                return;
            }
            
            const heal = Math.floor(player.maxHp * 0.3);
            player.hp = Math.min(player.hp + heal, player.maxHp);
            addLog(`你休息了一会，恢复了 ${heal} 生命值`);
            updateDisplay();
        }
        
        function shop() {
            const items = [
                {name: '生命药水', price: 50, effect: () => {
                    const heal = 50;
                    player.hp = Math.min(player.hp + heal, player.maxHp);
                    addLog(`使用生命药水，恢复 ${heal} 生命值`);
                }},
                {name: '经验药水', price: 100, effect: () => {
                    gainExp(50);
                    addLog('使用经验药水，获得 50 经验值');
                }},
                {name: '力量药水', price: 200, effect: () => {
                    player.maxHp += 10;
                    addLog('使用力量药水，最大生命值增加 10');
                }}
            ];
            
            const item = items[Math.floor(Math.random() * items.length)];
            
            if (player.gold >= item.price) {
                if (confirm(`购买 ${item.name} (${item.price} 金币)？`)) {
                    player.gold -= item.price;
                    item.effect();
                    addLog(`购买了 ${item.name}`);
                    updateDisplay();
                }
            } else {
                addLog(`金币不足，无法购买 ${item.name}`);
            }
        }
        
        // 初始化
        addLog('欢迎来到冒险世界！');
        addLog('点击探索开始你的冒险吧！');
        updateDisplay();
        
    </script>
</body>
</html>
