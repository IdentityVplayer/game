<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填字游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            min-height: 100vh;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        .crossword {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            gap: 1px;
            margin: 20px auto;
            background: #333;
            padding: 5px;
        }

        .cell {
            width: 30px;
            height: 30px;
            background: white;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .cell.black {
            background: #333;
        }

        .cell.selected {
            background: #74b9ff;
            color: white;
        }

        .cell.highlighted {
            background: #81ecec;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            outline: none;
        }

        .number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            color: #666;
        }

        .clues {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .clue-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .clue-section h3 {
            margin-top: 0;
            color: #6c5ce7;
        }

        .clue {
            margin: 8px 0;
            padding: 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .clue:hover {
            background: #e9ecef;
        }

        .clue.selected {
            background: #74b9ff;
            color: white;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            transition: width 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
    <h1>📝 填字游戏</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div>完成度: <span id="progress">0</span>%</div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        
        <div class="crossword" id="crossword"></div>
        
        <div class="clues">
            <div class="clue-section">
                <h3>横向</h3>
                <div id="acrossClues"></div>
            </div>
            <div class="clue-section">
                <h3>竖向</h3>
                <div id="downClues"></div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="checkAnswers()">检查答案</button>
            <button onclick="showHint()">显示提示</button>
            <button onclick="newPuzzle()">新谜题</button>
        </div>
    </div>

    <script>
        class Crossword {
            constructor() {
                this.grid = Array(10).fill(null).map(() => Array(10).fill(null));
                this.words = [
                    {word: 'APPLE', clue: '红色水果', start: [0, 0], direction: 'across', number: 1},
                    {word: 'BOOK', clue: '阅读的物品', start: [2, 1], direction: 'across', number: 2},
                    {word: 'CAT', clue: '家庭宠物', start: [4, 3], direction: 'across', number: 3},
                    {word: 'DOG', clue: '人类最好的朋友', start: [6, 0], direction: 'across', number: 4},
                    {word: 'EGG', clue: '鸡产的东西', start: [8, 2], direction: 'across', number: 5},
                    {word: 'ABLE', clue: '有能力的', start: [0, 0], direction: 'down', number: 6},
                    {word: 'PHONE', clue: '通讯工具', start: [0, 1], direction: 'down', number: 7},
                    {word: 'LOVE', clue: '爱情', start: [0, 2], direction: 'down', number: 8},
                    {word: 'MONEY', clue: '购买物品的媒介', start: [1, 4], direction: 'down', number: 9},
                    {word: 'GAME', clue: '娱乐活动', start: [3, 6], direction: 'down', number: 10}
                ];
                
                this.selectedCell = null;
                this.selectedWord = null;
                
                this.initGrid();
                this.renderGrid();
                this.renderClues();
                this.updateProgress();
            }

            initGrid() {
                // 清空网格
                this.grid = Array(10).fill(null).map(() => Array(10).fill(null));
                
                // 放置单词
                this.words.forEach(wordData => {
                    const {word, start, direction} = wordData;
                    const [row, col] = start;
                    
                    for (let i = 0; i < word.length; i++) {
                        const currentRow = direction === 'across' ? row : row + i;
                        const currentCol = direction === 'across' ? col + i : col;
                        
                        if (currentRow < 10 && currentCol < 10) {
                            this.grid[currentRow][currentCol] = {
                                letter: word[i],
                                number: i === 0 ? wordData.number : null,
                                userInput: '',
                                words: this.grid[currentRow][currentCol] ? 
                                      [...this.grid[currentRow][currentCol].words, wordData] : [wordData]
                            };
                        }
                    }
                });
            }

            renderGrid() {
                const crossword = document.getElementById('crossword');
                crossword.innerHTML = '';
                
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        if (this.grid[row][col]) {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.maxLength = 1;
                            input.value = this.grid[row][col].userInput;
                            input.oninput = (e) => this.onInput(e, row, col);
                            input.onclick = () => this.selectCell(row, col);
                            input.onkeydown = (e) => this.onKeyDown(e, row, col);
                            
                            cell.appendChild(input);
                            
                            if (this.grid[row][col].number) {
                                const number = document.createElement('div');
                                number.className = 'number';
                                number.textContent = this.grid[row][col].number;
                                cell.appendChild(number);
                            }
                        } else {
                            cell.classList.add('black');
                        }
                        
                        crossword.appendChild(cell);
                    }
                }
            }

            renderClues() {
                const acrossClues = document.getElementById('acrossClues');
                const downClues = document.getElementById('downClues');
                
                acrossClues.innerHTML = '';
                downClues.innerHTML = '';
                
                this.words.forEach(wordData => {
                    const clueDiv = document.createElement('div');
                    clueDiv.className = 'clue';
                    clueDiv.textContent = `${wordData.number}. ${wordData.clue}`;
                    clueDiv.onclick = () => this.selectWord(wordData);
                    
                    if (wordData.direction === 'across') {
                        acrossClues.appendChild(clueDiv);
                    } else {
                        downClues.appendChild(clueDiv);
                    }
                });
            }

            selectCell(row, col) {
                this.selectedCell = [row, col];
                this.highlightCell(row, col);
            }

            selectWord(wordData) {
                this.selectedWord = wordData;
                this.highlightWord(wordData);
                
                // 高亮选中的线索
                document.querySelectorAll('.clue').forEach(clue => {
                    clue.classList.remove('selected');
                });
                event.target.classList.add('selected');
            }

            highlightCell(row, col) {
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.classList.remove('selected', 'highlighted');
                });
                
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                if (cell) {
                    cell.classList.add('selected');
                }
            }

            highlightWord(wordData) {
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.classList.remove('highlighted');
                });
                
                const {start, direction, word} = wordData;
                const [startRow, startCol] = start;
                
                for (let i = 0; i < word.length; i++) {
                    const row = direction === 'across' ? startRow : startRow + i;
                    const col = direction === 'across' ? startCol + i : startCol;
                    
                    const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    if (cell) {
                        cell.classList.add('highlighted');
                    }
                }
            }

            onInput(event, row, col) {
                const value = event.target.value.toUpperCase();
                if (this.grid[row][col]) {
                    this.grid[row][col].userInput = value;
                }
                this.updateProgress();
                
                // 自动移动到下一个格子
                if (value && this.selectedWord) {
                    this.moveToNextCell(row, col);
                }
            }

            onKeyDown(event, row, col) {
                if (event.key === 'Backspace' && !event.target.value) {
                    this.moveToPrevCell(row, col);
                } else if (event.key === 'ArrowRight') {
                    this.moveToNextCell(row, col);
                } else if (event.key === 'ArrowLeft') {
                    this.moveToPrevCell(row, col);
                }
            }

            moveToNextCell(row, col) {
                if (!this.selectedWord) return;
                
                const {start, direction, word} = this.selectedWord;
                const [startRow, startCol] = start;
                
                // 计算当前位置在单词中的索引
                const currentIndex = direction === 'across' ? col - startCol : row - startRow;
                
                if (currentIndex < word.length - 1) {
                    const nextRow = direction === 'across' ? row : row + 1;
                    const nextCol = direction === 'across' ? col + 1 : col;
                    const nextCell = document.querySelector(`[data-row="${nextRow}"][data-col="${nextCol}"] input`);
                    if (nextCell) {
                        nextCell.focus();
                    }
                }
            }

            moveToPrevCell(row, col) {
                if (!this.selectedWord) return;
                
                const {start, direction} = this.selectedWord;
                const [startRow, startCol] = start;
                
                const currentIndex = direction === 'across' ? col - startCol : row - startRow;
                
                if (currentIndex > 0) {
                    const prevRow = direction === 'across' ? row : row - 1;
                    const prevCol = direction === 'across' ? col - 1 : col;
                    const prevCell = document.querySelector(`[data-row="${prevRow}"][data-col="${prevCol}"] input`);
                    if (prevCell) {
                        prevCell.focus();
                    }
                }
            }

            checkAnswers() {
                let correct = 0;
                let total = 0;
                
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (this.grid[row][col]) {
                            total++;
                            if (this.grid[row][col].userInput === this.grid[row][col].letter) {
                                correct++;
                                // 标记正确答案
                                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                                cell.style.background = '#d4edda';
                            } else {
                                // 标记错误答案
                                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                                cell.style.background = '#f8d7da';
                            }
                        }
                    }
                }
                
                setTimeout(() => {
                    document.querySelectorAll('.cell').forEach(cell => {
                        cell.style.background = '';
                    });
                }, 2000);
                
                alert(`正确率: ${Math.round((correct / total) * 100)}%\n正确: ${correct}/${total}`);
            }

            showHint() {
                // 显示一个随机空格的正确答案
                const emptyCells = [];
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (this.grid[row][col] && !this.grid[row][col].userInput) {
                            emptyCells.push([row, col]);
                        }
                    }
                }
                
                if (emptyCells.length > 0) {
                    const [row, col] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[row][col].userInput = this.grid[row][col].letter;
                    
                    const input = document.querySelector(`[data-row="${row}"][data-col="${col}"] input`);
                    if (input) {
                        input.value = this.grid[row][col].letter;
                        input.style.background = '#fff3cd';
                        setTimeout(() => {
                            input.style.background = '';
                        }, 2000);
                    }
                    
                    this.updateProgress();
                }
            }

            updateProgress() {
                let filled = 0;
                let total = 0;
                
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        if (this.grid[row][col]) {
                            total++;
                            if (this.grid[row][col].userInput) {
                                filled++;
                            }
                        }
                    }
                }
                
                const progress = Math.round((filled / total) * 100);
                document.getElementById('progress').textContent = progress;
                document.getElementById('progressBar').style.width = progress + '%';
            }
        }

        let game;

        function newPuzzle() {
            game = new Crossword();
        }

        function checkAnswers() {
            game.checkAnswers();
        }

        function showHint() {
            game.showHint();
        }

        // 初始化游戏
        newPuzzle();
    </script>
</body>
</html>
