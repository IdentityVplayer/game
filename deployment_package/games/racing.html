<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速赛车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        
        .game-container {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #e74c3c;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1rem;
            font-size: 1rem;
            flex-wrap: wrap;
        }
        
        .info-item {
            background: rgba(231,76,60,0.1);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            margin: 0.2rem;
            border: 1px solid rgba(231,76,60,0.3);
        }
        
        .info-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        
        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        #gameCanvas {
            border: 3px solid #e74c3c;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(231,76,60,0.5);
            background: #2c3e50;
        }
        
        .controls {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn-pause {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }
        
        .btn-reset {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(231,76,60,0.3);
        }
        
        .instructions {
            margin-top: 1rem;
            opacity: 0.9;
            font-size: 0.9rem;
            line-height: 1.5;
            background: rgba(231,76,60,0.1);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(231,76,60,0.2);
        }
        
        .back-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(231,76,60,0.2);
            color: #e74c3c;
            border: 1px solid rgba(231,76,60,0.3);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(231,76,60,0.3);
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over-content {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #f39c12;
        }
        
        .speed-meter {
            margin: 1rem 0;
            text-align: center;
        }
        
        .speed-bar {
            width: 200px;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin: 0.5rem auto;
            overflow: hidden;
        }
        
        .speed-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            width: 0;
            transition: width 0.3s ease;
        }
        
        @media (max-width: 600px) {
            .game-container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #gameCanvas {
                width: 300px;
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">← 返回</button>
    
    <div class="game-container">
        <h1>🏎️ 极速赛车</h1>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">分数</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">最高分</div>
                <div class="info-value" id="highScore">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">距离</div>
                <div class="info-value" id="distance">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">等级</div>
                <div class="info-value" id="level">1</div>
            </div>
        </div>
        
        <div class="speed-meter">
            <div style="font-size: 0.9rem; margin-bottom: 0.5rem;">速度表</div>
            <div class="speed-bar">
                <div class="speed-fill" id="speedFill"></div>
            </div>
            <div id="speedText">0 km/h</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">开始游戏</button>
            <button class="btn btn-pause" onclick="pauseGame()">暂停</button>
            <button class="btn btn-reset" onclick="resetGame()">重置</button>
        </div>
        
        <div class="instructions">
            <strong>控制说明：</strong><br>
            ←→ 或 A/D 左右移动<br>
            ↑↓ 或 W/S 加速/减速<br>
            避开障碍车辆，挑战高分！
        </div>
    </div>
    
    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2>🏁 游戏结束！</h2>
            <p>最终分数：<span id="finalScore">0</span></p>
            <p>行驶距离：<span id="finalDistance">0</span> 米</p>
            <p>达到等级：<span id="finalLevel">0</span></p>
            <p>最高速度：<span id="maxSpeed">0</span> km/h</p>
            <button class="btn btn-start" onclick="restartGame()">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop = null;
        let score = 0;
        let highScore = localStorage.getItem('racingHighScore') || 0;
        let distance = 0;
        let level = 1;
        let gameSpeed = 2;
        let maxSpeedReached = 0;
        
        // 玩家车辆
        let player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 80,
            width: 30,
            height: 50,
            speed: 5,
            velocity: 0,
            maxSpeed: 8,
            color: '#e74c3c'
        };
        
        // 游戏对象
        let obstacles = [];
        let roadLines = [];
        let particles = [];
        
        // 键盘状态
        let keys = {};
        
        // 初始化道路线条
        function initRoadLines() {
            roadLines = [];
            for (let i = 0; i < 20; i++) {
                roadLines.push({
                    x: canvas.width / 2 - 2,
                    y: i * 40,
                    width: 4,
                    height: 20
                });
            }
        }
        
        // 创建障碍车辆
        function createObstacle() {
            const lanes = [canvas.width / 4, canvas.width / 2, (canvas.width * 3) / 4];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            
            const colors = ['#3498db', '#f39c12', '#2ecc71', '#9b59b6', '#34495e'];
            
            return {
                x: lane - 15,
                y: -60,
                width: 30,
                height: 50,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: gameSpeed + Math.random() * 2
            };
        }
        
        // 创建粒子效果
        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x + Math.random() * 20 - 10,
                    y: y + Math.random() * 20 - 10,
                    vx: Math.random() * 6 - 3,
                    vy: Math.random() * 6 - 3,
                    life: 30,
                    color: '#ff6b35'
                });
            }
        }
        
        // 绘制道路
        function drawRoad() {
            // 道路背景
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 道路边界
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 50, canvas.height);
            ctx.fillRect(canvas.width - 50, 0, 50, canvas.height);
            
            // 道路中央线和车道线
            ctx.fillStyle = '#f1c40f';
            roadLines.forEach(line => {
                ctx.fillRect(line.x, line.y, line.width, line.height);
                
                // 车道分隔线
                ctx.fillRect(canvas.width / 4 - 1, line.y, 2, line.height);
                ctx.fillRect((canvas.width * 3) / 4 - 1, line.y, 2, line.height);
            });
        }
        
        // 绘制车辆
        function drawVehicle(vehicle, isPlayer = false) {
            // 车身
            ctx.fillStyle = vehicle.color;
            ctx.fillRect(vehicle.x, vehicle.y, vehicle.width, vehicle.height);
            
            // 车身高光
            ctx.fillStyle = isPlayer ? '#c0392b' : 'rgba(255,255,255,0.3)';
            ctx.fillRect(vehicle.x + 2, vehicle.y + 2, vehicle.width - 4, 10);
            
            // 车窗
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(vehicle.x + 5, vehicle.y + 8, vehicle.width - 10, 15);
            
            // 车轮
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(vehicle.x - 3, vehicle.y + 5, 6, 8);
            ctx.fillRect(vehicle.x + vehicle.width - 3, vehicle.y + 5, 6, 8);
            ctx.fillRect(vehicle.x - 3, vehicle.y + vehicle.height - 13, 6, 8);
            ctx.fillRect(vehicle.x + vehicle.width - 3, vehicle.y + vehicle.height - 13, 6, 8);
            
            // 玩家车辆特效
            if (isPlayer && player.velocity > 0) {
                // 引擎火焰
                ctx.fillStyle = '#ff6b35';
                ctx.fillRect(vehicle.x + 8, vehicle.y + vehicle.height, 14, 8);
                ctx.fillStyle = '#ffd93d';
                ctx.fillRect(vehicle.x + 10, vehicle.y + vehicle.height, 10, 6);
            }
        }
        
        // 绘制粒子
        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life / 30;
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, 3, 3);
            });
            ctx.globalAlpha = 1;
        }
        
        // 绘制UI
        function drawUI() {
            // 分数显示
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, 10, 120, 80);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Arial';
            ctx.fillText(`分数: ${score}`, 20, 30);
            ctx.fillText(`距离: ${Math.floor(distance)}m`, 20, 50);
            ctx.fillText(`等级: ${level}`, 20, 70);
            
            // 速度显示
            ctx.fillText(`${Math.floor(player.velocity * 20)} km/h`, 20, canvas.height - 20);
        }
        
        // 绘制游戏
        function draw() {
            drawRoad();
            
            // 绘制障碍车辆
            obstacles.forEach(obstacle => {
                drawVehicle(obstacle);
            });
            
            // 绘制玩家车辆
            drawVehicle(player, true);
            
            drawParticles();
            drawUI();
        }
        
        // 更新游戏状态
        function update() {
            if (!gameRunning || gamePaused) return;
            
            // 更新距离和分数
            distance += gameSpeed;
            score += Math.floor(gameSpeed);
            
            // 等级提升
            if (Math.floor(distance / 1000) + 1 > level) {
                level = Math.floor(distance / 1000) + 1;
                gameSpeed = Math.min(gameSpeed + 0.2, 6);
            }
            
            // 玩家移动
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x = Math.max(60, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x = Math.min(canvas.width - 60 - player.width, player.x + player.speed);
            }
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.velocity = Math.min(player.velocity + 0.2, player.maxSpeed);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.velocity = Math.max(player.velocity - 0.3, 0);
            } else {
                // 自然减速
                player.velocity = Math.max(player.velocity - 0.1, 1);
            }
            
            // 记录最高速度
            maxSpeedReached = Math.max(maxSpeedReached, player.velocity * 20);
            
            // 更新道路线条
            roadLines.forEach(line => {
                line.y += gameSpeed + player.velocity;
                if (line.y > canvas.height) {
                    line.y = -40;
                }
            });
            
            // 更新障碍车辆
            obstacles.forEach((obstacle, index) => {
                obstacle.y += obstacle.speed + player.velocity;
                
                // 移除屏幕外的障碍物
                if (obstacle.y > canvas.height) {
                    obstacles.splice(index, 1);
                    score += 10; // 成功避开奖励
                }
            });
            
            // 生成新障碍物
            if (Math.random() < 0.02 + level * 0.005) {
                obstacles.push(createObstacle());
            }
            
            // 碰撞检测
            checkCollisions();
            
            // 更新粒子
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.98;
                particle.vy *= 0.98;
                particle.life--;
                return particle.life > 0;
            });
            
            updateDisplay();
        }
        
        // 碰撞检测
        function checkCollisions() {
            obstacles.forEach((obstacle, index) => {
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    
                    // 发生碰撞
                    createParticles(player.x + player.width / 2, player.y + player.height / 2);
                    gameOver();
                }
            });
        }
        
        // 游戏循环
        function gameStep() {
            update();
            draw();
            
            if (gameRunning) {
                gameLoop = requestAnimationFrame(gameStep);
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning && !gamePaused) return;
            
            if (gamePaused) {
                gamePaused = false;
            } else {
                gameRunning = true;
            }
            
            gameLoop = requestAnimationFrame(gameStep);
        }
        
        // 暂停游戏
        function pauseGame() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            if (!gamePaused) {
                gameLoop = requestAnimationFrame(gameStep);
            }
        }
        
        // 重置游戏
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
            
            score = 0;
            distance = 0;
            level = 1;
            gameSpeed = 2;
            maxSpeedReached = 0;
            
            player.x = canvas.width / 2 - 15;
            player.y = canvas.height - 80;
            player.velocity = 0;
            
            obstacles = [];
            particles = [];
            
            initRoadLines();
            updateDisplay();
            draw();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('racingHighScore', highScore);
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDistance').textContent = Math.floor(distance);
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('maxSpeed').textContent = Math.floor(maxSpeedReached);
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        // 重新开始游戏
        function restartGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            resetGame();
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('distance').textContent = Math.floor(distance);
            document.getElementById('level').textContent = level;
            
            // 更新速度表
            const speedPercent = (player.velocity / player.maxSpeed) * 100;
            document.getElementById('speedFill').style.width = speedPercent + '%';
            document.getElementById('speedText').textContent = Math.floor(player.velocity * 20) + ' km/h';
        }
        
        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 触摸控制（移动设备）
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameRunning || gamePaused) return;
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            // 左右移动
            if (Math.abs(deltaX) > 10) {
                if (deltaX > 0) {
                    player.x = Math.min(canvas.width - 60 - player.width, player.x + 3);
                } else {
                    player.x = Math.max(60, player.x - 3);
                }
                touchStartX = touch.clientX;
            }
            
            // 上下控制速度
            if (Math.abs(deltaY) > 10) {
                if (deltaY < 0) {
                    player.velocity = Math.min(player.velocity + 0.1, player.maxSpeed);
                } else {
                    player.velocity = Math.max(player.velocity - 0.1, 0);
                }
                touchStartY = touch.clientY;
            }
        });
        
        // 初始化游戏
        resetGame();
    </script>
</body>
</html>
