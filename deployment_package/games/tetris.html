<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .game-container {
            display: flex;
            gap: 2rem;
            background: rgba(0,0,0,0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .game-area {
            text-align: center;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 200px;
        }
        
        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #gameCanvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .info-panel {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        
        .info-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #FFD700;
        }
        
        .next-piece {
            width: 100px;
            height: 100px;
            border: 2px solid #fff;
            margin: 0 auto;
            background: #000;
            border-radius: 5px;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .btn {
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-pause {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
        }
        
        .btn-reset {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .back-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over-content {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 800px) {
            .game-container {
                flex-direction: column;
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #gameCanvas {
                width: 300px;
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">← 返回</button>
    
    <div class="game-container">
        <div class="game-area">
            <h1>🧩 俄罗斯方块</h1>
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>
        
        <div class="sidebar">
            <div class="info-panel">
                <div class="info-title">分数</div>
                <div id="score">0</div>
            </div>
            
            <div class="info-panel">
                <div class="info-title">等级</div>
                <div id="level">1</div>
            </div>
            
            <div class="info-panel">
                <div class="info-title">行数</div>
                <div id="lines">0</div>
            </div>
            
            <div class="info-panel">
                <div class="info-title">下一个方块</div>
                <canvas id="nextCanvas" class="next-piece" width="100" height="100"></canvas>
            </div>
            
            <div class="controls">
                <button class="btn btn-start" onclick="startGame()">开始游戏</button>
                <button class="btn btn-pause" onclick="pauseGame()">暂停</button>
                <button class="btn btn-reset" onclick="resetGame()">重置</button>
            </div>
            
            <div class="instructions">
                <strong>控制说明：</strong><br>
                ←→ 左右移动<br>
                ↓ 快速下降<br>
                ↑ 旋转方块<br>
                空格 暂停/继续
            </div>
        </div>
    </div>
    
    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2>🎮 游戏结束！</h2>
            <p>最终分数：<span id="finalScore">0</span></p>
            <p>消除行数：<span id="finalLines">0</span></p>
            <p>达到等级：<span id="finalLevel">0</span></p>
            <button class="btn btn-start" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;
        
        // 方块类型定义
        const PIECES = [
            {
                shape: [
                    [1, 1, 1, 1]
                ],
                color: '#00f0f0'
            },
            {
                shape: [
                    [1, 1],
                    [1, 1]
                ],
                color: '#f0f000'
            },
            {
                shape: [
                    [0, 1, 0],
                    [1, 1, 1]
                ],
                color: '#a000f0'
            },
            {
                shape: [
                    [0, 1, 1],
                    [1, 1, 0]
                ],
                color: '#00f000'
            },
            {
                shape: [
                    [1, 1, 0],
                    [0, 1, 1]
                ],
                color: '#f00000'
            },
            {
                shape: [
                    [1, 0, 0],
                    [1, 1, 1]
                ],
                color: '#f0a000'
            },
            {
                shape: [
                    [0, 0, 1],
                    [1, 1, 1]
                ],
                color: '#0000f0'
            }
        ];
        
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let currentX = 0;
        let currentY = 0;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gameLoop = null;
        let dropTime = 0;
        let lastTime = 0;
        
        // 初始化游戏板
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = 0;
                }
            }
        }
        
        // 创建新方块
        function createPiece() {
            const piece = JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random() * PIECES.length)]));
            return piece;
        }
        
        // 旋转方块
        function rotatePiece(piece) {
            const rotated = {
                shape: [],
                color: piece.color
            };
            
            const N = piece.shape.length;
            for (let i = 0; i < N; i++) {
                rotated.shape[i] = [];
                for (let j = 0; j < piece.shape[i].length; j++) {
                    rotated.shape[i][j] = piece.shape[N - 1 - j][i];
                }
            }
            
            return rotated;
        }
        
        // 检查碰撞
        function isValidPosition(piece, x, y) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const newX = x + c;
                        const newY = y + r;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }
        
        // 放置方块
        function placePiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const boardY = currentY + r;
                        const boardX = currentX + c;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
        }
        
        // 检查并清除满行
        function clearLines() {
            let linesCleared = 0;
            
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(0));
                    linesCleared++;
                    r++; // 重新检查这一行
                }
            }
            
            if (linesCleared > 0) {
                lines += linesCleared;
                score += linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                updateDisplay();
            }
        }
        
        // 绘制单个方块
        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }
        
        // 绘制游戏板
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制已放置的方块
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        drawBlock(ctx, c, r, board[r][c]);
                    }
                }
            }
            
            // 绘制当前方块
            if (currentPiece) {
                ctx.fillStyle = currentPiece.color;
                for (let r = 0; r < currentPiece.shape.length; r++) {
                    for (let c = 0; c < currentPiece.shape[r].length; c++) {
                        if (currentPiece.shape[r][c]) {
                            drawBlock(ctx, currentX + c, currentY + r, currentPiece.color);
                        }
                    }
                }
            }
        }
        
        // 绘制下一个方块
        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const blockSize = 20;
                const offsetX = (nextCanvas.width - nextPiece.shape[0].length * blockSize) / 2;
                const offsetY = (nextCanvas.height - nextPiece.shape.length * blockSize) / 2;
                
                nextCtx.fillStyle = nextPiece.color;
                for (let r = 0; r < nextPiece.shape.length; r++) {
                    for (let c = 0; c < nextPiece.shape[r].length; c++) {
                        if (nextPiece.shape[r][c]) {
                            nextCtx.fillRect(
                                offsetX + c * blockSize,
                                offsetY + r * blockSize,
                                blockSize,
                                blockSize
                            );
                            nextCtx.strokeStyle = '#fff';
                            nextCtx.strokeRect(
                                offsetX + c * blockSize,
                                offsetY + r * blockSize,
                                blockSize,
                                blockSize
                            );
                        }
                    }
                }
            }
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }
        
        // 生成新方块
        function spawnPiece() {
            currentPiece = nextPiece || createPiece();
            nextPiece = createPiece();
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;
            
            if (!isValidPosition(currentPiece, currentX, currentY)) {
                gameOver();
            }
            
            drawNextPiece();
        }
        
        // 方块下降
        function dropPiece() {
            if (isValidPosition(currentPiece, currentX, currentY + 1)) {
                currentY++;
            } else {
                placePiece();
                clearLines();
                spawnPiece();
            }
        }
        
        // 游戏循环
        function gameStep(time) {
            if (!gameRunning) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropTime += deltaTime;
            
            if (dropTime > 1000 / level) {
                dropPiece();
                dropTime = 0;
            }
            
            drawBoard();
            gameLoop = requestAnimationFrame(gameStep);
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            lastTime = 0;
            dropTime = 0;
            spawnPiece();
            gameLoop = requestAnimationFrame(gameStep);
        }
        
        // 暂停游戏
        function pauseGame() {
            gameRunning = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
        }
        
        // 重置游戏
        function resetGame() {
            pauseGame();
            initBoard();
            currentPiece = null;
            nextPiece = null;
            score = 0;
            lines = 0;
            level = 1;
            updateDisplay();
            drawBoard();
            drawNextPiece();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLines').textContent = lines;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        // 重新开始游戏
        function restartGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            resetGame();
            startGame();
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || !currentPiece) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (isValidPosition(currentPiece, currentX - 1, currentY)) {
                        currentX--;
                    }
                    break;
                case 'ArrowRight':
                    if (isValidPosition(currentPiece, currentX + 1, currentY)) {
                        currentX++;
                    }
                    break;
                case 'ArrowDown':
                    dropPiece();
                    break;
                case 'ArrowUp':
                    const rotated = rotatePiece(currentPiece);
                    if (isValidPosition(rotated, currentX, currentY)) {
                        currentPiece = rotated;
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    if (gameRunning) {
                        pauseGame();
                    } else {
                        startGame();
                    }
                    break;
            }
        });
        
        // 初始化
        initBoard();
        updateDisplay();
        drawBoard();
        drawNextPiece();
    </script>
</body>
</html>
